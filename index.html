<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MO OS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='23' fill='%23141416'/%3E%3Ctext x='50' y='55' font-family='Inter,Arial,sans-serif' font-size='58' font-weight='700' fill='%23f5f5f7' text-anchor='middle' dominant-baseline='central'%3EM%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MO OS">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060607;
    --bg-2:#0a0a0c;
    --panel:#08080a;
    --card:#101012;
    --card-2:#141416;
    --card-hi:#18181b;
    --border:rgba(255,255,255,.07);
    --border-2:rgba(255,255,255,.13);
    --text:#f4f4f5;
    --muted:#adadb5;
    --faint:#7c7c86;
    --accent:#ff7a47;
    --accent-2:#ffb02e;
    --accent-soft:rgba(255,122,71,.13);
    --teal:#2dd4bf;
    --good:#34d399;
    --good-soft:rgba(52,211,153,.13);
    --warn:#fbbf24;
    --warn-soft:rgba(251,191,36,.13);
    --bad:#f87171;
    --bad-soft:rgba(248,113,113,.13);
    --gold:#fbbf24;
    --r:16px;
    --r-sm:11px;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --display:'Space Grotesk','Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:
      radial-gradient(80% 50% at 50% -20%,rgba(255,122,71,.045),transparent 60%),
      var(--bg);
    color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  ::selection{background:rgba(255,122,71,.32)}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--accent)}

  .shell{display:flex;min-height:100vh}
  .rail{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;padding:20px 13px;position:sticky;top:0;height:100vh}
  .brand{padding:6px 10px 20px;display:flex;flex-direction:column;gap:4px}
  .brand .logo{display:flex;align-items:center;gap:9px}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 12px rgba(255,122,71,.35);flex:0 0 32px}
  .brand input{background:none;border:none;font-size:17px;font-weight:700;color:var(--text);padding:0;width:100%;letter-spacing:-.01em}
  .brand input:focus{outline:none}
  .brand .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding-left:1px}
  .navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:var(--muted);cursor:pointer;padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:500;transition:.15s;position:relative}
  .navbtn svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .navbtn:hover{color:var(--text);background:rgba(255,255,255,.035)}
  .navbtn.active{color:var(--text);background:linear-gradient(90deg,var(--accent-soft),transparent 85%)}
  .navbtn.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .navbtn.active svg{stroke:var(--accent)}
  .rail-foot{margin-top:auto;padding:11px 13px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:8px}
  .rail-foot .dot{width:7px;height:7px;border-radius:99px;background:var(--faint)}
  .rail-foot .dot.live{background:var(--good);box-shadow:0 0 9px var(--good)}
  .rail-foot .dot.err{background:var(--bad)}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{border-bottom:1px solid var(--border);padding:18px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
  .topbar .hi{font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .hi .greet-hey{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .streak-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 10px;border-radius:99px;
    background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.06));
    border:1px solid rgba(251,191,36,.35);box-shadow:0 2px 10px rgba(251,191,36,.12)}
  .streak-badge svg{width:16px;height:16px;fill:var(--gold);stroke:none;filter:drop-shadow(0 0 5px rgba(251,191,36,.5))}
  .streak-badge b{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--gold);line-height:1}
  .streak-badge span{font-size:11px;color:var(--gold);opacity:.85;letter-spacing:.02em}
  .topbar .clock{font-size:21px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .topbar .date{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:2px;text-align:right}

  main{padding:26px 34px 90px;max-width:1240px;width:100%}
  .view{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view{animation:none}}

  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  h2.sec{font-size:25px;font-weight:700;margin:0;letter-spacing:-.02em;font-family:var(--display)}
  .sec-sub{color:var(--muted);font-size:13px;margin:3px 0 0}

  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g23{grid-template-columns:1.4fr 1fr}
  @media (max-width:960px){.g2,.g3,.g23{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
  .card.hover:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .card h3{margin:0 0 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card h3 .h3sub{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500;font-size:11px}

  .hero{background:
      radial-gradient(120% 120% at 100% 0,rgba(255,176,46,.12),transparent 55%),
      linear-gradient(150deg,var(--card-hi),var(--card));
    border:1px solid var(--border-2);display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .ring-wrap{position:relative;width:140px;height:140px;flex:0 0 140px}
  .ring-wrap .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-wrap .pct b{font-size:32px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
  .ring-wrap .pct span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .hero-info{flex:1;min-width:180px}
  .hero-info .big{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero-info .streak{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:4px 0 2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:11px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:99px;padding:5px 12px}
  .chip b{color:var(--text);font-family:var(--mono)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px}
  .tile{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:var(--r-sm);padding:16px 17px;transition:.15s;position:relative;overflow:hidden}
  .tile:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .tile.big{grid-column:span 2}
  @media (max-width:600px){.tile.big{grid-column:span 1}}
  .tile .n{font-size:27px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
  .tile .n.money{font-size:30px}
  .tile .n.accent{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile .n.gold{color:var(--gold)}
  .tile .n.good{color:var(--good)}
  .tile .n.teal{color:var(--teal)}
  .tile .n.bad{color:var(--bad)}
  .tile .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:500}
  .tile .sub{font-size:10.5px;color:var(--faint);margin-top:3px}

  .meter{margin-bottom:16px}.meter:last-child{margin-bottom:0}
  .track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

  .funnel{display:flex;flex-direction:column;gap:9px}
  .fstep{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:14px}
  .fstep .fl{font-size:12.5px;color:var(--muted)}
  .fbar-track{height:26px;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
  .fbar{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1);min-width:2px}
  .fstep .fv{font-family:var(--mono);font-size:13px;font-weight:600;min-width:78px;text-align:right}
  .fstep .fv small{color:var(--faint);font-weight:400;font-size:11px}

  .disc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .disc li{display:flex;align-items:center;gap:12px;padding:10px 9px;border-radius:9px;cursor:pointer;transition:background .12s}
  .disc li:hover{background:rgba(255,255,255,.035)}
  .box{width:20px;height:20px;flex:0 0 20px;border:1.5px solid var(--border-2);border-radius:7px;display:grid;place-items:center;transition:.14s}
  .box svg{width:11px;height:11px;stroke:#04121a;stroke-width:3.2;opacity:0;fill:none}
  .disc li.done .box,.ai.done .box,.box.done{background:linear-gradient(135deg,var(--good),#6ff0bd);border-color:var(--good)}
  .disc li.done .box svg,.box.done svg{opacity:1}
  .disc li.done .lbl{color:var(--muted)}
  .disc .lbl{flex:1;font-size:13.5px}

  .addrow{display:flex;gap:9px;margin-top:14px}
  .hb-addrow{border:1px dashed var(--border-2);border-radius:11px;padding:8px 8px 8px 12px}
  .hb-addrow input{background:transparent}
  .addrow input,.inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--text)}
  .addrow input:focus,.inp:focus{outline:none;border-color:var(--accent)}
  .btn{background:var(--card-2);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:10px 15px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.13s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.solid{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;box-shadow:0 4px 14px rgba(255,122,71,.3)}
  .btn.solid:hover{filter:brightness(1.1);color:#fff}
  a.track-btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  a.track-btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
  .rm{opacity:0;background:none;border:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
  li:hover .rm,.ai:hover .rm{opacity:.7}.rm:hover{color:var(--bad);opacity:1}
  .pill{font-size:11px;font-weight:500;padding:4px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
  .pill .d{width:7px;height:7px;border-radius:99px;background:currentColor}
  .pill.live{color:var(--good);background:var(--good-soft)}
  .pill.off{color:var(--muted);background:rgba(255,255,255,.05)}
  .pill.err{color:var(--bad);background:var(--bad-soft)}
  .pill .d.live{animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px}
  .seg button{background:none;border:none;color:var(--muted);padding:6px 13px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;transition:.12s}
  .seg button.on{background:var(--card-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}

  .bars{display:flex;align-items:stretch;gap:6px;height:150px;margin-top:8px}
  .bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;min-width:0}
  .bar-col{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar{width:100%;max-width:30px;min-height:3px;background:var(--border-2);border-radius:5px 5px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1);position:relative}
  .bar.on{background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .bar.hit{background:linear-gradient(180deg,var(--good),#6ff0bd)}
  .bar-lbl{font-size:9.5px;color:var(--muted);margin-top:7px;white-space:nowrap}
  .bar-val{font-size:9px;color:var(--faint);margin-bottom:4px;white-space:nowrap}

  .seth-quote{margin:2px 0 20px;padding:11px 0 11px 16px;border-left:2px solid var(--border-2);color:var(--muted);font-size:13px;font-style:italic;line-height:1.5;max-width:640px}
  .seth-quote b{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:600}

  .hb-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}
  @media(max-width:600px){.hb-summary{grid-template-columns:1fr}}
  .hbcard{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow)}
  .hbcard .mini-ring{position:relative;width:56px;height:56px;flex:0 0 56px}
  .hbcard .mini-ring .mp{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);z-index:1}
  .hbcard .hbc-info .hbc-n{font-size:22px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
  .hbcard .hbc-info .hbc-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  .hb-hero{background:radial-gradient(120% 120% at 100% 0,rgba(251,191,36,.1),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2);display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .hb-hero-info{flex:1;min-width:200px}
  .hb-streak-row{display:flex;align-items:baseline;gap:12px}
  .hb-streak-num{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,var(--gold),#f5915e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hb-streak-lbl{font-size:13px;color:var(--muted);font-weight:600}
  .chip.hb-chip-lg{font-size:12.5px;padding:7px 15px}
  .chip.hb-chip-lg b{font-size:15px;margin-right:5px}
  .chip.hb-chip-lg b.good{color:var(--good)}.chip.hb-chip-lg b.accent{color:var(--accent)}.chip.hb-chip-lg b.warn{color:var(--warn)}
  .bar-lbl.today{color:var(--accent);font-weight:700}

  .hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .hcard2{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);transition:border-color .15s}
  .hcard2:hover{border-color:var(--border-2)}
  .hc2-top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .hlabel2{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:7px;color:var(--text);font-family:var(--sans);font-size:14.5px;font-weight:600;padding:5px 7px;transition:.12s}
  .hlabel2:hover{border-color:var(--border)}
  .hlabel2:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  .hc2-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--border)}
  .hc2-stat{text-align:center}
  .hc2-pct{font-size:19px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em}
  .hc2-pct.good{color:var(--good)}.hc2-pct.accent{color:var(--accent)}.hc2-pct.warn{color:var(--warn)}.hc2-pct.faint{color:var(--faint);font-weight:500}
  .hc2-stat-lbl{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .hs-dots{display:flex;flex-wrap:wrap;gap:6px}
  .hs-col{display:flex;flex-direction:column;align-items:center;gap:5px}
  .hs-dot{width:17px;height:17px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:.13s}
  .hs-dot:hover{border-color:var(--border-2);transform:scale(1.15)}
  .hs-dot.on{border-color:transparent}
  .hs-dot.today{box-shadow:0 0 0 2px var(--accent)}
  .hs-dot-lbl{font-size:8.5px;color:var(--faint);text-transform:uppercase;font-weight:600}
  .hs-dots-lbl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}

  .today-row{display:flex;gap:11px;flex-wrap:wrap}
  .today-tile{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:11px;padding:20px 12px;background:var(--bg);border:1px solid var(--border);border-radius:13px;cursor:pointer;transition:.15s;font-family:inherit}
  .today-tile:hover{border-color:var(--dc,var(--accent));transform:translateY(-2px)}
  .today-tile.on{background:var(--good-soft);border-color:var(--good)}
  .today-tile .box{width:30px;height:30px;pointer-events:none;border-color:var(--dc,var(--border-2))}
  .today-tile-lbl{font-size:12.5px;font-weight:600;color:var(--text);text-align:center;line-height:1.3}
  .today-tile.on .today-tile-lbl{color:var(--good)}
  @media(max-width:700px){.today-tile{min-width:calc(50% - 6px)}}

  .hboard{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .hboard::-webkit-scrollbar{height:8px}.hboard::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .hgrid{border-collapse:separate;border-spacing:0;width:100%}
  .hgrid th{padding:0}
  .col-h{text-align:center;padding:0 0 10px;min-width:34px}
  .col-h .cd{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
  .col-h .cn{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
  .col-h.istoday .cn{color:var(--accent);font-weight:700}
  .hname{padding:5px 12px 5px 2px;min-width:170px;position:sticky;left:0;background:var(--bg-2);z-index:2;display:flex;align-items:center;gap:9px}
  .hname input{background:none;border:1px solid transparent;border-radius:7px;color:var(--text);font-family:var(--sans);font-size:13.5px;padding:6px 8px;width:100%;transition:.12s}

  .goal-hero{display:flex;gap:28px;align-items:stretch;flex-wrap:wrap;background:
      radial-gradient(120% 120% at 100% 0,rgba(255,122,71,.1),transparent 55%),

  .goal-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}

  .goal-date-row{margin-top:14px}
  .goal-date{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .goal-date input{align-self:flex-start}

  .goal-countdown .cd-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .goal-countdown .cd-date{font-size:11px;color:var(--faint);margin-top:6px}
  @media(max-width:720px){.goal-countdown{flex:1;border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:20px}}
  input[type=date].datepick{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-family:var(--mono);font-size:12px;cursor:pointer}
  input[type=date].datepick:focus{outline:none;border-color:var(--accent)}
  input[type=date]{cursor:pointer}
  input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;filter:invert(0.7);opacity:.8}
  input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1}
  .list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
  .list li{display:flex;gap:12px;align-items:center;padding:9px 7px;border-radius:9px;cursor:pointer}
  .list li:hover{background:rgba(255,255,255,.035)}
  .list li.done .txt{color:var(--muted);text-decoration:line-through}
  .list .txt{flex:1;font-size:13.5px}
  .empty{color:var(--faint);font-size:13px;padding:10px 0}
  .scroll{max-height:340px;overflow-y:auto;padding-right:6px}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .saved{font-size:10px;color:var(--good);letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}

  .co-wrap{display:grid;grid-template-columns:272px 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.co-wrap{grid-template-columns:1fr}}
  .co-timeline{display:flex;flex-direction:column;gap:7px;max-height:72vh;overflow-y:auto;padding-right:4px}
  .co-timeline::-webkit-scrollbar{width:8px}.co-timeline::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .sess-item{display:flex;align-items:flex-start;gap:12px;text-align:left;background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.14s;width:100%}
  .sess-item:hover{border-color:var(--border-2);transform:translateX(2px)}
  .sess-item.active{border-color:var(--accent);background:linear-gradient(100deg,var(--accent-soft),transparent)}
  .sess-datebox{flex:0 0 42px;width:42px;background:var(--card-2);border:1px solid var(--border);border-radius:9px;text-align:center;padding:6px 0;transition:.14s}
  .sess-item.active .sess-datebox{border-color:var(--accent);background:var(--accent-soft)}
  .sess-datebox .ddow{font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint)}
  .sess-datebox .dnum{font-size:16.5px;font-weight:700;color:var(--text);font-family:var(--mono);line-height:1.2}
  .sess-body{flex:1;min-width:0}
  .sess-item .st{font-size:15px;font-weight:700;margin-bottom:5px;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:8px;color:var(--text)}
  .sess-item .st span:first-child{overflow:hidden;text-overflow:ellipsis}
  .sess-item .sd{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:500}
  .sbadge{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--muted);white-space:nowrap}
  .sbadge.open{color:var(--warn);background:var(--warn-soft)}
  .sbadge.over{color:var(--bad);background:var(--bad-soft)}
  .sbadge.clear{color:var(--good);background:var(--good-soft)}
  .co-empty{color:var(--faint);font-size:13px;padding:22px;text-align:center;border:1px dashed var(--border-2);border-radius:11px}
  .ai{display:flex;align-items:flex-start;gap:12px;padding:12px 11px;border-radius:10px;transition:background .12s;border:1px solid transparent}
  .ai:hover{background:rgba(255,255,255,.035)}
  .ai.overdue{border-color:rgba(248,113,113,.28)}
  .ai .box{margin-top:1px}
  .ai.done .box svg{opacity:1}
  .ai.done .ai-txt{color:var(--muted);text-decoration:line-through}
  .ai-main{flex:1;min-width:0}
  .ai-txt{font-size:13.5px;line-height:1.45}
  .ai-meta{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .ai-due{font-size:11px;font-family:var(--mono);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .ai-due.soon{color:var(--warn)}.ai-due.past{color:var(--bad)}
  .ai-due input{background:none;border:none;color:inherit;font-family:var(--mono);font-size:11px;padding:0;cursor:pointer}
  .ai-due input:focus{outline:none}
  .ai-date{font-size:10px;font-family:var(--mono);color:var(--muted);display:inline-flex;align-items:center;gap:5px;background:var(--card-2);border:1px solid var(--border);border-radius:7px;padding:3px 8px}
  .ai-date.soon{color:var(--warn);border-color:rgba(251,191,36,.3)}.ai-date.past{color:var(--bad);border-color:rgba(248,113,113,.3)}
  .ai-date-lbl{text-transform:uppercase;letter-spacing:.05em;font-size:9px;color:var(--faint);font-family:var(--sans)}
  .ai-date input{background:none;border:none;color:inherit;font-family:var(--mono);font-size:11px;padding:0;cursor:pointer;width:86px}
  .ai-date input:focus{outline:none}
  .ai-due-badge{font-size:10px;font-family:var(--mono);color:var(--faint);white-space:nowrap}
  .ai-due-badge.soon{color:var(--warn)}.ai-due-badge.past{color:var(--bad);font-weight:700}
  .co-link{font-size:12px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .co-link:hover{text-decoration:underline}
  .co-notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.co-notes-grid{grid-template-columns:1fr}}
  .co-notes-lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px}
  .co-notes-lbl .h3sub{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400;font-size:11px;margin-left:4px}
  .titlerow{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .titlerow input.ttl{flex:1;min-width:170px;background:none;border:none;border-bottom:1px solid transparent;color:var(--text);font-size:19px;font-weight:700;letter-spacing:-.01em;padding:4px 0}
  .titlerow input.ttl:hover{border-bottom-color:var(--border)}
  .titlerow input.ttl:focus{outline:none;border-bottom-color:var(--accent)}
  .co-del{color:var(--muted);padding:8px 12px;font-size:12px}
  .co-del:hover{border-color:var(--bad);color:var(--bad)}

  .due-list{display:flex;flex-direction:column;gap:3px}
  .due-item{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
  .due-item:hover{background:rgba(255,255,255,.035)}
  .due-item .dtxt{flex:1;font-size:13px}
  .due-item .dwhen{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .due-item .dwhen.past{color:var(--bad)}.due-item .dwhen.soon{color:var(--warn)}
  .due-dot{width:7px;height:7px;border-radius:99px;flex:0 0 7px;background:var(--muted)}
  .due-dot.past{background:var(--bad)}.due-dot.soon{background:var(--warn)}

  /* MORNING FORMULA */
  .mo-vision{background:
      radial-gradient(120% 120% at 0 0,rgba(251,191,36,.08),transparent 55%),
      linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2)}
  .vboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .vcard{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .18s,box-shadow .18s}
  .vcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .vcard .vimg-wrap{position:relative;width:100%;aspect-ratio:4/5;background:var(--card-2);overflow:hidden}
  .vcard .vimg-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .vcard:hover .vimg-wrap img{transform:scale(1.04)}
  .vcard .vimg-wrap .vscrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.78) 100%);pointer-events:none}
  .vcard .vimg-wrap .vcap-over{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 12px;font-size:13.5px;font-weight:600;line-height:1.4;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .vcard .vimg.noimg{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,var(--card),var(--card-2));padding:16px;text-align:center}
  .vcard .vimg.noimg svg{width:30px;height:30px;stroke:var(--faint);fill:none;stroke-width:1.5}
  .vcard .vimg.noimg .vcap{padding:0;color:var(--muted)}
  .vcard .vimg.broken{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bad-soft);padding:16px;text-align:center}
  .vcard .vimg.broken svg{width:26px;height:26px;stroke:var(--bad);fill:none;stroke-width:1.6}
  .vcard .vimg.broken span{font-size:11.5px;color:var(--bad)}
  .vcard .vcap{padding:12px 14px;font-size:13.5px;line-height:1.45;color:var(--text)}
  .vcard textarea.vcap-edit{width:100%;border:none;border-top:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 12px;resize:none;line-height:1.4}
  .vcard textarea.vcap-edit:focus{outline:none;background:var(--card)}
  .vcard .vdel{position:absolute;top:9px;right:9px;z-index:2;opacity:1;background:rgba(10,11,15,.75);border-radius:7px;width:26px;height:26px;color:#fff;backdrop-filter:blur(4px)}
  .vcard .vdel:hover{color:var(--bad);background:rgba(10,11,15,.9)}
  .vcard .vphoto{position:absolute;top:9px;right:41px;z-index:2;background:rgba(10,11,15,.75);border:none;border-radius:7px;width:26px;height:26px;color:#fff;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}
  .vcard .vphoto:hover{background:rgba(10,11,15,.9)}
  .mo-list{display:flex;flex-direction:column;gap:4px}
  .mo-line{display:flex;align-items:flex-start;gap:12px;padding:11px 10px;border-radius:10px;transition:background .12s}
  .mo-line:hover{background:rgba(255,255,255,.03)}
  .mo-dot{width:7px;height:7px;border-radius:99px;background:var(--dot,var(--accent));flex:0 0 7px;margin-top:8px;box-shadow:0 0 8px var(--dot,var(--accent))}
  .mo-text{flex:1;font-size:14.5px;line-height:1.55}
  .mo-line textarea.mo-edit-line{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;padding:8px 11px;resize:none;overflow:hidden}
  .mo-line textarea.mo-edit-line:focus{outline:none;border-color:var(--accent)}
  .mo-line .mo-del{margin-top:4px}
  .mo-line .mo-del-quick{opacity:0;flex:0 0 auto;align-self:center;transition:opacity .12s}
  .mo-line:hover .mo-del-quick{opacity:.55}
  .mo-line .mo-del-quick:hover{opacity:1}
  .mo-line .mo-text{flex:1}
  @media (hover:none){.mo-line .mo-del-quick{opacity:.4}}

  /* DAILY SCORE */
  .ring-wrap .pct b{font-size:34px}
  .ring-wrap .pct span{font-size:9px}
  .score-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .score-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .score-row .sr-check{width:15px;color:var(--faint);font-size:12px}
  .score-row.on .sr-check{color:var(--good)}
  .score-row .sr-label{flex:1;color:var(--muted)}
  .score-row.on .sr-label{color:var(--text)}
  .score-row .sr-pts{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--good)}
  .score-row:not(.on) .sr-pts{color:var(--faint);font-weight:400}

  /* DO NOW tasks under disciplines */
  .do-now-tasks{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .dnt-hdr{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
  .dnt-item{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;transition:background .12s}
  .dnt-item:hover{background:rgba(255,255,255,.035)}
  .dnt-item .box{width:18px;height:18px;flex:0 0 18px}

  /* PRIORITY CARD */
  .priority-card{background:radial-gradient(120% 120% at 0 0,rgba(251,191,36,.09),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2)}
  .pc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);font-weight:600;margin-bottom:8px}
  .pc-main{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
  .pc-sub{font-size:12px;color:var(--muted);margin-top:8px;display:inline-block}
  .pc-link{font-size:12px;color:var(--accent);cursor:pointer;margin-top:10px;display:inline-block}
  .pc-link:hover{text-decoration:underline}

  /* NET WORTH mini on home */
  .money-mini{}
  .nw-big{font-size:34px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em;margin-bottom:14px}
  .nw-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nw-field{display:flex;flex-direction:column;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;transition:border-color .13s}

  .nw-inp input:focus{outline:none}
  .nw-k{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .nw-v{font-family:var(--mono);font-size:14px;font-weight:600}

  /* MONEY page */
  .money-hero{background:radial-gradient(120% 120% at 100% 0,rgba(52,211,153,.1),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2)}
  .mh-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .mh-big{font-size:46px;font-weight:800;font-family:var(--mono);letter-spacing:-.03em;line-height:1;margin-bottom:22px}
  .mh-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:720px){.mh-fields{grid-template-columns:1fr 1fr}}
  .mh-field{display:flex;flex-direction:column;gap:7px}
  .mh-k{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;position:relative;padding-left:12px}
  .mh-k::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:99px;background:var(--c,var(--accent))}
  .mh-input{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-family:var(--mono);color:var(--muted)}

  .mh-input input{background:none;border:none;color:var(--text);font-family:var(--mono);font-size:15px;font-weight:600;width:100%;padding:0}
  .mh-input input:focus{outline:none}

  /* TASKS page — execution engine */
  .current-focus-card{background:radial-gradient(120% 120% at 0 0,rgba(255,122,71,.12),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2);padding:24px}
  .cf-top{display:flex;justify-content:space-between;align-items:center}
  .cf-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .cf-name{font-size:23px;font-weight:800;letter-spacing:-.015em;margin:10px 0 12px;line-height:1.3}
  .cf-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .cf-actions{display:flex;gap:10px}
  .cf-timer{font-family:var(--mono);font-weight:700;color:var(--accent);background:var(--accent-soft)}
  .cf-empty .cf-empty-txt{color:var(--faint);font-size:14px;margin:12px 0 16px}
  .focus-mode-wrap{max-width:560px;margin:0 auto}
  .focus-mode-wrap .current-focus-card{padding:36px}
  .focus-mode-wrap .cf-name{font-size:30px}

  .et-list{display:flex;flex-direction:column;gap:2px}
  .et-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--border)}
  .et-row:last-child{border-bottom:none}
  .et-row.completed .et-name{color:var(--muted);text-decoration:line-through}
  .et-main{flex:1;min-width:0}
  .et-name{font-size:14px;font-weight:500}
  .et-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .et-chip{font-size:10.5px;font-family:var(--mono);background:var(--card-2);border:1px solid var(--border);border-radius:99px;padding:2px 9px;color:var(--muted)}
  .et-chip.et-est{color:var(--faint)}
  .et-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .et-iconbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;width:26px;height:26px;font-size:12px;cursor:pointer;transition:.13s;display:inline-flex;align-items:center;justify-content:center}
  .et-iconbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .et-iconbtn:disabled{opacity:.25;cursor:default}
  .et-projsel{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px;padding:4px 6px;max-width:120px}
  .et-status-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px;font-weight:600}

  .qa-panel{position:relative;width:min(440px,92vw);background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:22px}
  .qa-title{font-size:16px;font-weight:700;margin-bottom:14px}
  .qa-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .qa-est-row{display:flex;gap:8px;margin-bottom:18px}
  .qa-est-chip{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;transition:.13s}
  .qa-est-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .qa-actions{display:flex;justify-content:flex-end;gap:10px}

  /* habit weight input */
  .hname{display:flex;align-items:center;gap:8px}
  .hwt{display:inline-flex;align-items:center;gap:3px;margin-left:auto;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px 6px}
  .hwt input.hweight{width:26px;background:none;border:none;color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:700;text-align:right;padding:0}
  .hwt input.hweight:focus{outline:none}
  .hwt .hwt-lbl{font-size:9px;color:var(--faint);text-transform:uppercase}
  .hname input.hlabel{flex:1;min-width:60px}
  .disc-w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600}
  .disc li.done .disc-w{color:var(--good)}

  /* DISCREET DAY NOTE */
  .day-note{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:0 2px}
  .day-note input{flex:1;background:none;border:none;border-bottom:1px solid var(--border);color:var(--muted);font-size:12.5px;padding:7px 2px;transition:.15s}
  .day-note input::placeholder{color:var(--faint)}
  .day-note input:hover{border-bottom-color:var(--border-2)}
  .day-note input:focus{outline:none;border-bottom-color:var(--accent);color:var(--text)}
  .day-note.has-note input{color:var(--text)}
  .dn-saved{flex-shrink:0}

  /* WEEKLY REVIEW */
  .wk-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
  .wk-title{text-align:center;font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:2px}
  .wk-title span{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.02em}
  .wk-disc{display:flex;flex-direction:column;gap:11px}
  .wk-disc-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:12px}
  .wk-disc-label{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk-disc-track{height:8px;background:var(--bg);border:1px solid var(--border);border-radius:99px;overflow:hidden}
  .wk-disc-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .5s}
  .wk-disc-val{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
  .wk-notes{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .wk-notes-hdr{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:2px}
  .wk-note{display:flex;gap:10px;font-size:12.5px;line-height:1.45}
  .wk-note-day{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--muted);width:42px}
  .wk-note-txt{color:var(--text)}
  .wk-journal .wk-j-field{margin-bottom:14px}
  .wk-journal .wk-j-field:last-child{margin-bottom:0}
  .wk-journal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
  .wk-journal textarea.write{min-height:70px}

  /* HEAD TRASH — launcher */
  .headtrash-launch{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:border-color .18s,transform .18s;background:linear-gradient(115deg,rgba(226,75,74,.07),transparent 42%),var(--card)}
  .headtrash-launch:hover{border-color:rgba(255,122,71,.4);transform:translateY(-2px)}
  .htl-left{display:flex;align-items:center;gap:15px;z-index:1}
  .htl-icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:linear-gradient(135deg,rgba(226,75,74,.2),rgba(255,122,71,.12));display:grid;place-items:center}
  .htl-icon svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.7}
  .htl-title{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  .htl-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .htl-cta{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap;border:1px solid rgba(255,122,71,.3);border-radius:99px;padding:8px 15px;transition:.15s}
  .headtrash-launch:hover .htl-cta{background:var(--accent-soft);border-color:var(--accent)}
  /* HEAD TRASH — immersive journal */
  #ht-modal{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,4,6,.82);backdrop-filter:blur(12px);animation:htFade .3s ease}
  @keyframes htFade{from{opacity:0}to{opacity:1}}
  .ht-book{width:min(650px,100%);max-height:90vh;display:flex;flex-direction:column;background:radial-gradient(130% 70% at 50% -8%,rgba(226,75,74,.09),transparent 58%),#0d0c0e;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 40px 130px rgba(0,0,0,.66)}
  .ht-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 24px 16px}
  .ht-head-l{display:flex;align-items:center;gap:14px;min-width:0}
  .ht-badge{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(135deg,rgba(226,75,74,.22),rgba(255,122,71,.12));display:grid;place-items:center}
  .ht-badge svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ht-title{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .ht-sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .ht-sect{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:8px 2px 11px;display:flex;align-items:center;gap:11px}
  .ht-sect::after{content:"";flex:1;height:1px;background:var(--border)}
  .ht-sect.reframed{color:var(--accent);margin-top:20px}
  .ht-sect.reframed::after{background:linear-gradient(90deg,rgba(255,122,71,.3),transparent)}
  .ht-x{background:none;border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto;transition:.13s}
  .ht-x:hover{color:var(--text);border-color:var(--border-2)}
  .ht-compose{padding:2px 24px 18px}
  .ht-compose-inner{position:relative;background:repeating-linear-gradient(transparent,transparent 33px,rgba(255,255,255,.05) 34px),rgba(255,255,255,.015);border:1px solid var(--border);border-left:3px solid rgba(226,75,74,.55);border-radius:12px;padding:12px 16px}
  .ht-compose textarea{width:100%;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:34px;resize:none;overflow:hidden;min-height:34px;display:block}
  .ht-compose textarea:focus{outline:none}
  .ht-compose textarea::placeholder{color:var(--faint)}
  .ht-compose-foot{display:flex;justify-content:flex-end;margin-top:11px}
  .ht-dump{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a0f0a;border:none;font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer;transition:.13s}
  .ht-dump:hover{filter:brightness(1.08)}
  .ht-dump:disabled{opacity:.4;cursor:default;filter:none}
  .ht-scroll{overflow-y:auto;padding:2px 24px 24px;flex:1}
  .ht-scroll::-webkit-scrollbar{width:8px}.ht-scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .ht-empty{text-align:center;color:var(--faint);font-size:13.5px;padding:26px 0 16px;line-height:1.5}
  .htc{margin-bottom:12px}
  .htc-dirty{position:relative;background:linear-gradient(180deg,rgba(226,75,74,.055),rgba(255,255,255,.006));border:1px solid rgba(226,75,74,.16);border-radius:14px;padding:15px 16px;display:flex;align-items:flex-start;gap:12px}
  .htc-dirty .htc-txt{font-size:14.5px;line-height:1.5;color:#cdc6c6}
  .htc-body{flex:1;min-width:0}
  .htc-time{font-size:10px;color:var(--faint);margin-top:6px;font-family:var(--mono)}
  .htc-acts{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .htc-invert{background:none;border:1px solid rgba(255,122,71,.35);color:var(--accent);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.13s}
  .htc-invert:hover{background:var(--accent-soft)}
  .htc-del{align-self:center;opacity:.4;transition:.13s}.htc-dirty:hover .htc-del{opacity:.75}.htc-del:hover{opacity:1}
  .htc-edit{background:#111013;border:1px solid rgba(255,122,71,.32);border-radius:16px;padding:16px 18px}
  .htc-edit-orig{font-size:13px;color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(226,75,74,.5);margin-bottom:12px;line-height:1.5}
  .htc-edit-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .htc-ai-status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);letter-spacing:.06em}
  .htc-ai-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:htcAiPulse 1s ease-in-out infinite}
  @keyframes htcAiPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .htc-ai-btn{background:none;border:1px solid rgba(255,122,71,.3);color:var(--accent);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;transition:.13s}
  .htc-ai-btn:hover{background:var(--accent-soft)}
  .htc-ai-btn:disabled{opacity:.5;cursor:default}
  .htc-edit textarea{width:100%;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;padding:12px 14px;resize:none;overflow:hidden;min-height:56px}
  .htc-edit textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .htc-edit-acts{display:flex;gap:9px;margin-top:12px}
  .htc-flipbtn{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a0f0a;border:none;font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer;transition:.13s}
  .htc-flipbtn:hover{filter:brightness(1.08)}
  .htc-cancel{background:none;border:1px solid var(--border);color:var(--muted);font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer}
  .htc-done{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 122%,rgba(255,122,71,.16),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.006));border:1px solid rgba(255,122,71,.24);padding:16px 18px}
  .htc-done .htc-old{font-size:12.5px;color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(226,75,74,.45);line-height:1.5}
  .htc-arrow{display:flex;align-items:center;gap:9px;margin:11px 0;color:var(--accent);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .htc-arrow::before,.htc-arrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,122,71,.3),transparent)}
  .htc-new{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.35;color:#fff;letter-spacing:-.01em}
  .htc-done-foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
  .htc-done-time{font-size:10px;color:var(--faint);font-family:var(--mono)}
  .htc-done-acts{display:flex;gap:6px}
  .htc-mini{background:none;border:1px solid var(--border);color:var(--faint);font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer;transition:.13s}
  .htc-mini:hover{color:var(--text);border-color:var(--border-2)}
  .htc-done.flipping{animation:htcPop .7s cubic-bezier(.2,.9,.2,1)}
  .htc-done.flipping .htc-new{animation:htcRise .8s .1s cubic-bezier(.2,.8,.2,1) both}
  .htc-done.flipping::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;background:radial-gradient(62% 60% at 50% 108%,rgba(255,122,71,.55),transparent 70%);opacity:0;animation:htcGlow .95s ease}
  @keyframes htcPop{0%{transform:scale(.955) rotateX(9deg);opacity:.5}58%{transform:scale(1.015)}100%{transform:none;opacity:1}}
  @keyframes htcRise{from{opacity:0;transform:translateY(16px);filter:blur(9px)}to{opacity:1;transform:none;filter:none}}
  @keyframes htcGlow{0%{opacity:0}38%{opacity:1}100%{opacity:0}}

  /* COACHING EXPAND + MODAL */
  .co-expand{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.13s}
  .co-expand svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
  .co-expand:hover{border-color:var(--accent);color:var(--accent)}
  .co-notes-lbl{display:flex;align-items:center}
  textarea.co-note-area{min-height:200px;max-height:340px}
  .note-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:28px}
  .nm-backdrop{position:absolute;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(4px)}
  .nm-panel{position:relative;width:min(860px,100%);height:min(80vh,760px);background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
  .nm-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--border)}
  .nm-title{font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:2px}
  .nm-title .nm-sub{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.02em}
  .nm-actions{display:flex;align-items:center;gap:12px}
  .nm-area{flex:1;width:100%;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;padding:22px;resize:none}
  .nm-area:focus{outline:none}

  /* ===== TOPBAR GOAL CHIP ===== */
  .goal-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;
    background:linear-gradient(135deg,var(--accent-soft),rgba(255,176,46,.08));border:1px solid rgba(255,122,71,.35)}
  .goal-chip b{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);line-height:1}
  .goal-chip span{font-size:11px;color:var(--muted);letter-spacing:.02em;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== MORNING GOAL ===== */
  .mo-goal{background:radial-gradient(120% 140% at 0 0,rgba(255,122,71,.12),transparent 58%),radial-gradient(80% 100% at 100% 100%,rgba(255,176,46,.06),transparent 60%),var(--card);border-color:var(--border-2);padding:26px 28px}
  .mo-goal-row{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
  .mo-goal-cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .mo-goal-live{cursor:pointer}
  .mo-goal-live:hover{border-color:rgba(255,122,71,.4)}
  .mo-goal-tap{font-size:9px;letter-spacing:.14em;color:var(--faint);opacity:0;transition:.2s;margin-left:6px}
  .mo-goal-live:hover .mo-goal-tap{opacity:1}

  /* GOAL TRANCE */
  #trance{position:fixed;inset:0;z-index:6200;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(90% 60% at 50% 118%,rgba(255,122,71,.2),transparent 60%),
      radial-gradient(60% 45% at 12% 8%,rgba(255,176,46,.08),transparent 65%),
      radial-gradient(120% 90% at 50% -20%,#141416,#040405 72%);
    animation:vmIn .5s ease both;cursor:pointer}
  .tr-halo{position:fixed;left:50%;top:48%;width:min(1000px,120vw);height:80vh;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(45% 45% at 50% 50%,rgba(255,122,71,.13),transparent 70%);
    animation:haloBreathe 8s ease-in-out infinite alternate}
  .tr-x{position:absolute;top:22px;right:26px}
  .tr-core{position:relative;z-index:2;text-align:center;max-width:min(860px,90vw);padding:0 24px}
  .tr-cap{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,122,71,.9);font-weight:700;animation:vmRise .8s ease both}
  .tr-goal{font-family:var(--display);font-size:clamp(30px,6vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:16px 0 40px;
    background:linear-gradient(100deg,#fff,rgba(255,176,46,.92));-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:vmRise 1.1s .2s ease both;text-shadow:0 0 60px rgba(255,122,71,.2)}
  .tr-line{min-height:2.4em;font-size:clamp(19px,2.8vw,30px);font-weight:500;line-height:1.4;color:rgba(255,255,255,.92);letter-spacing:-.01em}
  .tr-line span{opacity:0;display:inline-block;animation:vmWord .7s cubic-bezier(.2,.8,.2,1) both}
  .tr-progress{position:absolute;bottom:0;left:0;width:100%;height:3px;background:rgba(255,255,255,.06);z-index:2}
  .tr-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width 1.2s ease;box-shadow:0 0 12px rgba(255,122,71,.6)}
  .mo-goal-big{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.25;
    background:linear-gradient(95deg,var(--text),rgba(255,176,46,.85));-webkit-background-clip:text;background-clip:text;color:transparent}
  .mo-goal-cd{text-align:center;flex:0 0 auto;min-width:132px;padding:14px 22px;border-radius:14px;background:rgba(255,122,71,.09);border:1px solid rgba(255,122,71,.28)}
  .mo-goal-cd b{display:block;font-family:var(--mono);font-size:38px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
  .mo-goal-cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .mo-goal-track{margin-top:10px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .mo-goal-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease}
  .gl-label-in{background:none;border:none;color:var(--accent);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;font-family:inherit;padding:0;min-width:160px;flex:1}
  .gl-label-in:focus{outline:none;color:var(--text)}
  .gl-card{margin-bottom:12px;padding:18px 20px}

  textarea.gl-text-in{border:1px solid transparent;background:none;padding:2px 4px;min-height:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3;resize:none;overflow:hidden;border-radius:6px;width:100%;color:var(--text)}

  .mo-goal-minis{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:7px}
  .mo-goal-mini{display:flex;align-items:center;gap:12px;font-size:13px}
  .mgm-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;flex:0 0 auto;min-width:74px}
  .mgm-text{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mgm-days{font-family:var(--mono);font-size:12px;color:var(--accent);flex:0 0 auto}
  .mo-goal-edit{display:flex;flex-direction:column;gap:12px}
  .mo-goal-date{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}

  /* ===== JOURNAL & NOTES ===== */
  .btn-sm{padding:5px 11px;font-size:11.5px;text-transform:none;letter-spacing:0}
  textarea.jr-write{min-height:170px;font-size:15px;overflow:hidden}
  .jr-meta{margin-top:8px;font-size:11px;color:var(--faint);font-family:var(--mono);min-height:14px}
  .jr-list{display:flex;flex-direction:column;gap:4px}
  .jr-row{border:1px solid transparent;border-radius:10px;transition:.13s}
  .jr-row.open{border-color:var(--border);background:rgba(255,255,255,.02);padding:0 12px 12px}
  .jr-row-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;padding:11px 12px;border-radius:10px;font-size:13px}
  .jr-row.open .jr-row-head{padding-left:0;padding-right:0}
  .jr-row-head:hover{background:rgba(255,255,255,.03)}
  .jr-row.open .jr-row-head:hover{background:none}
  .jr-row-date{font-weight:600;flex:0 0 auto;white-space:nowrap}
  .jr-row-snip{color:var(--faint);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr-row-arrow{color:var(--faint);flex:0 0 auto}
  .jr-past-edit{min-height:100px}
  .jr-row2{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);cursor:pointer;padding:12px 14px;border-radius:11px;font-family:inherit;transition:.13s}
  .jr-row2:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
  .jr2-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr2-date{font-size:12px;color:var(--faint);flex:0 0 auto}
  .jr-month{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:26px 0 10px;padding-left:2px}
  .jr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .jr-card{display:flex;flex-direction:column;gap:7px;text-align:left;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:13px;padding:15px 16px;cursor:pointer;font-family:inherit;color:var(--text);transition:.14s}
  .jr-card:hover{border-color:rgba(255,122,71,.35);background:rgba(255,255,255,.04);transform:translateY(-2px)}
  .jr-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%}
  .jr-card-title{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr-card-day{font-family:var(--mono);font-size:10.5px;color:var(--accent);flex:0 0 auto;opacity:.85}
  .jr-card-prev{font-size:12px;color:var(--faint);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .jr-notes .inp{width:100%;margin-top:2px}
  .note-list{display:flex;flex-direction:column;gap:4px;margin-top:12px}
  .note-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);cursor:pointer;padding:10px 11px;border-radius:10px;transition:.13s}
  .note-row:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
  .note-pin{flex:0 0 auto;font-size:15px;color:var(--faint);cursor:pointer;line-height:1;padding:2px}
  .note-pin.on{color:var(--gold)}
  .note-pin:hover{color:var(--gold)}
  .note-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .note-title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-snip{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-date{flex:0 0 auto;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  .note-panel{padding:0}
  .note-title-in{flex:1;background:none;border:none;color:var(--text);font-size:17px;font-weight:700;padding:0;letter-spacing:-.01em}
  .note-title-in:focus{outline:none}
  .note-body{flex:1;border:none;border-radius:0;background:none;padding:22px 26px;min-height:0;resize:none;overflow-y:auto!important;font-size:15.5px;line-height:1.75;color:var(--text)}
  .note-body:focus{outline:none}
  .note-foot{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;border-top:1px solid var(--border);font-size:11px;color:var(--faint)}
  .danger-ghost{border-color:rgba(248,113,113,.4);color:var(--bad);background:none}
  .danger-ghost:hover{background:var(--bad-soft)}
  .jr-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px}
  .jr-tab{background:none;border:none;color:var(--muted);cursor:pointer;padding:7px 16px;border-radius:7px;font-size:12.5px;font-weight:600;transition:.13s}
  .jr-tab.active{background:var(--card-hi);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .gl-meta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .gl-countdown{font-size:12.5px;color:var(--muted)}
  .gl-countdown b{font-family:var(--mono);font-size:16px;color:var(--accent)}
  .big-goal{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;transition:.13s}
  .big-goal:hover{background:rgba(255,255,255,.02);border-color:var(--border)}
  .big-goal.done .bg-text{color:var(--faint);text-decoration:line-through}
  .bg-check{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1.5px solid var(--border-2);background:none;color:var(--good);font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:.13s;padding:0}
  .big-goal.done .bg-check{background:var(--good-soft);border-color:var(--good)}
  .bg-check:hover{border-color:var(--good)}
  .bg-text{flex:1;font-size:13.5px}
  .bg-del{opacity:0}
  .big-goal:hover .bg-del{opacity:1}
  .gl-log{padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.015)}
  .gl-log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .gl-log-date{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .gl-log-del{opacity:0}
  .gl-log:hover .gl-log-del{opacity:1}
  .gl-log-text{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  /* North Star + telescope goals */
  .ns-card{margin-bottom:18px;padding:18px 20px;border:1px solid rgba(255,122,71,.28);background:linear-gradient(180deg,rgba(255,122,71,.05),rgba(255,122,71,.015))}
  .ns-cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  textarea.ns-in{width:100%;border:1px solid transparent;background:none;padding:2px 4px;border-radius:6px;resize:none;overflow:hidden;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.4;color:var(--text)}
  textarea.ns-in::placeholder{color:var(--faint)}
  textarea.ns-in:hover{background:rgba(255,255,255,.02)}
  textarea.ns-in:focus{outline:none;background:rgba(255,255,255,.03)}
  .gl-sixcap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:12px 0 4px}
  .gl-ms{margin-top:14px}
  .gl-ms-cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:8px}
  .gl-ms-row{display:flex;align-items:center;gap:10px;padding:4px 0}
  .gl-ms-check{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:1.5px solid var(--border-2);background:none;color:var(--accent);font-size:11px;cursor:pointer;display:grid;place-items:center;padding:0;transition:.13s}
  .gl-ms-check:hover{border-color:var(--accent)}
  .gl-ms-check.on{background:var(--accent-soft);border-color:var(--accent)}
  .gl-ms-in{flex:1;background:none;border:1px solid transparent;border-radius:6px;padding:5px 7px;font-size:13.5px;color:var(--text);font-family:inherit}
  .gl-ms-in:hover{background:rgba(255,255,255,.02)}
  .gl-ms-in:focus{outline:none;background:rgba(255,255,255,.03)}
  .gl-ms-row.done .gl-ms-in{color:var(--faint);text-decoration:line-through}
  .gl-ms-del{opacity:0;transition:.13s}
  .gl-ms-row:hover .gl-ms-del{opacity:.5}
  .gl-ms-del:hover{opacity:1}
  .gl-ms-add input{background:none;border:1px dashed transparent;font-size:13px;padding:6px 8px;border-radius:8px;color:var(--text);width:100%}
  .gl-ms-add input::placeholder{color:var(--faint)}
  .gl-ms-add input:hover{background:rgba(255,255,255,.02)}
  .gl-ms-add input:focus{outline:none;background:rgba(255,255,255,.03)}
  .gl-first{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .gl-first-cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .gl-first-cap .gl-bottleneck{margin-left:auto;font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:600;transition:.13s}
  .gl-first-cap .gl-bottleneck:hover{border-color:var(--accent);color:var(--accent)}
  .gl-first-row{display:flex;gap:10px;align-items:center}
  .gl-first-in{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:14px;color:var(--text)}
  .gl-first-in:focus{outline:none;border-color:var(--accent)}
  .gl-when-in{flex:0 0 120px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--text)}
  .gl-when-in:focus{outline:none;border-color:var(--accent)}
  /* Morning next-step strip */
  .mo-next{margin-top:16px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;align-items:center;gap:14px}
  .mo-next-arrow{color:var(--accent);font-size:18px;flex:0 0 auto}
  .mo-next-body{flex:1;min-width:0}
  .mo-next-cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .mo-next-text{font-size:14.5px;color:var(--text);margin-top:2px;line-height:1.35}
  .mo-next-when{flex:0 0 auto;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:5px 12px;white-space:nowrap}
  .mo-ns{font-size:12.5px;color:var(--muted);line-height:1.45;margin-bottom:12px;max-width:640px}
  /* Bottleneck modal */
  #bn-modal{position:fixed;inset:0;z-index:120;background:rgba(6,6,8,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px}
  .bn-box{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 28px 24px;max-height:88vh;overflow:auto}
  .bn-title{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
  .bn-sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px}
  .bn-step{margin-bottom:16px}
  .bn-q{font-size:12px;letter-spacing:.02em;color:var(--accent);font-weight:600;margin-bottom:7px;display:flex;gap:8px;align-items:baseline}
  .bn-q b{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .bn-ta{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:14px;color:var(--text);line-height:1.5;resize:none;overflow:hidden;min-height:44px;font-family:inherit}
  .bn-ta:focus{outline:none;border-color:var(--accent)}
  .bn-deeper{background:none;border:1px dashed var(--border-2);color:var(--muted);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.13s;width:100%}
  .bn-deeper:hover{border-color:var(--accent);color:var(--accent)}
  .bn-result{margin-top:18px;padding:14px 16px;border-radius:13px;background:var(--accent-soft);border:1px solid rgba(255,122,71,.3)}
  .bn-result-cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  .bn-result input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--text);margin-bottom:8px}
  .bn-result input:focus{outline:none;border-color:var(--accent)}
  .bn-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  /* Lens columns (telescope) */
  .gl-lenses{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:6px}
  @media(min-width:860px){.gl-lenses{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .lens{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--lc);border-radius:14px;padding:15px 16px 16px;display:flex;flex-direction:column}
  .lens.done{opacity:.5}
  .lens-head{display:flex;align-items:center;gap:6px;margin-bottom:12px;min-height:22px}
  .lens-name{flex:1;min-width:0;background:none;border:none;color:var(--lc);font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;font-family:inherit;padding:0}
  .lens-name::placeholder{color:var(--faint)}
  .lens-name:focus{outline:none}
  .lens-acts{display:flex;gap:3px;opacity:0;transition:.13s;flex:0 0 auto}
  .lens:hover .lens-acts{opacity:1}
  .lens-ico{background:none;border:none;color:var(--faint);font-size:14px;cursor:pointer;padding:2px 5px;border-radius:6px;line-height:1;transition:.12s}
  .lens-ico:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .lens-ico.on{color:var(--accent)}
  .lens-cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:5px}
  .lens-cap.spaced{margin-top:14px}
  .lens-cap-h{display:flex;align-items:center;gap:4px}
  .lens-horizon{background:none;border:1px solid transparent;border-radius:5px;color:var(--faint);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;font-family:inherit;padding:1px 3px;min-width:3ch}
  .lens-horizon:hover{background:rgba(255,255,255,.04);color:var(--muted)}
  .lens-horizon:focus{outline:none;border-color:var(--lc);color:var(--text);background:var(--bg)}
  textarea.lens-goal{width:100%;border:1px solid transparent;background:none;padding:3px 5px;border-radius:7px;resize:none;overflow:hidden;font-family:var(--display);font-size:16px;font-weight:700;line-height:1.32;color:var(--text)}
  textarea.lens-goal::placeholder{color:var(--faint);font-weight:400;font-family:var(--sans)}
  textarea.lens-goal:hover{background:rgba(255,255,255,.02)}
  textarea.lens-goal:focus{outline:none;background:rgba(255,255,255,.03)}
  .lens-target{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .lens-target input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 9px;color:var(--text);font-size:12px;color-scheme:dark}
  .lens-cd b{font-family:var(--mono);color:var(--lc)}
  .lens-foot{margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
  .lens-first-in,.lens-when-in{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--text);margin-bottom:7px}
  .lens-first-in:focus,.lens-when-in:focus{outline:none;border-color:var(--lc)}
  .lens-bn{width:100%;margin-top:3px;background:none;border:1px dashed var(--border-2);color:var(--muted);border-radius:9px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.13s}
  .lens-bn:hover{border-color:var(--lc);color:var(--lc)}
  .gl-add-lens{display:flex;align-items:center;justify-content:center;min-height:120px;border:1.5px dashed var(--border-2);border-radius:14px;background:none;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:.13s}
  .gl-add-lens:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,122,71,.03)}
  /* Morning: this week's moves, one per lens */
  .mo-moves{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.07)}
  .mo-moves-cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .mo-move{display:flex;align-items:center;gap:13px;padding:9px 4px}
  .mo-move+.mo-move{border-top:1px solid rgba(255,255,255,.05)}
  .mo-move-dot{width:8px;height:8px;border-radius:50%;background:var(--lc);flex:0 0 auto}
  .mo-move-lens{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:0 0 auto;min-width:74px}
  .mo-move-step{flex:1;min-width:0;font-size:14.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mo-move-step.empty{color:var(--faint);font-size:13px}
  .mo-move-when{flex:0 0 auto;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:4px 11px;white-space:nowrap}

  /* ===== TASKS POLISH ===== */
  .et-addbar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
  .et-addbar input{flex:1;background:none;border:none;color:var(--text);font-size:14.5px;padding:8px 10px}
  .et-addbar input:focus{outline:none}
  .et-addbar select{background:var(--card-2);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12.5px;padding:9px 10px;cursor:pointer}
  .et-addbar:focus-within{border-color:var(--border-2)}
  .et-lblbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.13s;white-space:nowrap}
  .et-lblbtn:hover{border-color:var(--border-2);color:var(--text);background:rgba(255,255,255,.04)}
  .et-lblbtn.act-focus:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .et-lblbtn.act-next:hover{border-color:var(--teal);color:var(--teal)}
  .et-lblbtn.on{border-color:rgba(255,122,71,.4);color:var(--accent);background:var(--accent-soft)}
  .et-row{border-bottom:none!important;border-radius:11px;padding:11px 10px!important;transition:background .13s}
  .et-row:hover{background:rgba(255,255,255,.025)}
  .et-row .et-actions{opacity:0;transition:opacity .13s}
  .et-row:hover .et-actions,.et-row .et-actions:focus-within{opacity:1}
  .et-row .et-actions .et-status-tag{opacity:1}
  .et-row .drag-grip{opacity:0;transition:opacity .13s}
  .et-row:hover .drag-grip{opacity:.6}

  .tk-top3-card{display:flex;align-items:center;gap:11px;background:radial-gradient(130% 100% at 0 0,rgba(255,122,71,.1),transparent 70%),var(--card);border:1px solid rgba(255,122,71,.3);border-radius:14px;padding:15px 15px;min-height:62px}

  .tk-top3-num{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1px dashed var(--border-2);display:grid;place-items:center;font-size:12px;font-family:var(--mono)}
  .tk-top3-hint{font-size:12.5px}
  .tk-top3-name{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3;cursor:text}
  .tk-top3-x{background:none;border:none;color:var(--faint);font-size:17px;cursor:pointer;flex:0 0 auto;opacity:.5;transition:.13s;padding:0 2px}
  .tk-top3-card:hover .tk-top3-x{opacity:1}
  .tk-area{margin-bottom:22px}
  .tk-area-h{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text)}
  .tk-area-ic{font-size:15px}
  .tk-area-n{color:var(--faint);font-family:var(--mono);font-size:12px;font-weight:400}
  .tk-area-edit{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .tk-area-iconbtn{width:38px;height:38px;flex:0 0 38px;font-size:18px}
  .tk-area-rename{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:15px;font-weight:600;padding:9px 12px}
  .tk-area-rename:focus{outline:none;border-color:var(--accent)}
  .tk-area-delete{color:var(--muted)}
  .tk-area-delete:hover{border-color:var(--bad)!important;color:var(--bad)!important;background:none!important}
  .tk-row .et-main{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0;min-width:0}
  .tk-acts{opacity:1!important;display:flex;align-items:center;gap:4px}
  .tk-star{background:none;border:none;color:var(--faint);font-size:17px;cursor:pointer;padding:2px 4px;opacity:.45;transition:.13s;line-height:1}

  .tk-acts .rm{opacity:0}
  .et-row:hover .tk-acts .rm{opacity:.6}
