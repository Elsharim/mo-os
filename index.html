// AI reframe via the serverless function; returns a string or null (falls back to invertSuggest).
async function aiReframe(text){
  try{
    const r=await fetch('/api/reframe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(text||'')})});
    if(!r.ok)return null;
    const j=await r.json();
    const out=(j&&j.reframe&&String(j.reframe).trim())||'';
    return out||null;
  }catch(e){return null;}
}
// Rewrites a self-limiting thought into its fuller, present-tense opposite (offline fallback).
function invertSuggest(text){
  let t=(text||'').trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
  if(!t) return '';
  let s=' '+t+' ';
  const rules=[
    [/ i'?m not good enough /gi,' I am more than good enough '],
    [/ (i'?m|i am) never good enough /gi,' I am more than good enough '],
    [/ not good enough /gi,' more than enough '],
    [/ i'?m a failure /gi,' I am capable, and I grow with every rep '],
    [/ i'?m a fraud /gi,' I have earned my place, and I keep earning it '],
    [/ i'?m a loser /gi,' I am building what most people never will '],
    [/ i'?m worthless /gi,' I am worth more than I give myself credit for '],
    [/ i'?m (so |such )?(stupid|dumb) /gi,' I am sharp, and I learn fast '],
    [/ i'?m not smart enough /gi,' I am sharp enough, and I get sharper every day '],
    [/ i'?ll never /gi,' I will '],
    [/ i can'?t ever /gi,' I can '],
    [/ i never /gi,' I consistently '],
    [/ i always (fail|mess up|screw up|lose|choke|fall short) /gi,' I learn and get sharper every time '],
    [/ (no one|nobody) (likes|respects|believes in|wants|values) me /gi,' the right people respect and back me '],
    [/ everyone (is|seems|feels) better than me /gi,' I run my own race, and I am enough '],
    [/ i'?m falling behind /gi,' I am on my own timeline and moving fast '],
    [/ i'?m behind /gi,' I am exactly where I need to be, and moving fast '],
    [/ i'?m too (slow|weak|old|young|late|far behind) /gi,' I am right on time '],
    [/ i'?m afraid to /gi,' I am ready to '],
    [/ i'?m scared to /gi,' I am ready to '],
    [/ i'?m (afraid|scared|terrified) of /gi,' I am at peace with '],
    [/ i'?m (nervous|worried|anxious) about /gi,' I am calm and prepared for '],
    [/ i'?m (afraid|scared|terrified|nervous|worried|anxious|panicking) /gi,' I am calm and in control '],
    [/ i can'?t /gi,' I can '],
    [/ i cannot /gi,' I can '],
    [/ i could ?n'?t /gi,' I can '],
    [/ i won'?t /gi,' I will '],
    [/ i'?m not /gi,' I am '],
    [/ i am not /gi,' I am '],
    [/ i'?m /gi,' I am '],
    [/ i don'?t /gi,' I do '],
    [/ i do not /gi,' I do '],
    [/ i (hate|dread|can'?t stand) /gi,' I embrace '],
    [/ i suck at /gi,' I am getting better at '],
    [/ i'?m bad at /gi,' I am improving at '],
    [/ i keep failing /gi,' I keep learning and closing the gap '],
    [/ i give up /gi,' I keep going '],
    [/ i'?m done /gi,' I am just getting started '],
    [/ what if i fail /gi,' I am built to figure this out '],
    [/ i'?ll fail /gi,' I will figure it out '],
    [/ too hard /gi,' within reach '],
    [/ (it'?s |is )?impossible /gi,'$1 possible '],
    [/ not possible /gi,' possible '],
    [/ i have no (money|time|energy|discipline|clue) /gi,' I create the $1 I need '],
  ];
  let changed=false;
  for(const [re,rep] of rules){ if(re.test(s)){ s=s.replace(re,rep); changed=true; } }
  if(!changed) return '';
  s=s.replace(/\s+/g,' ').trim();
  s=s.replace(/\bi\b/g,'I');
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s)) s+='.';
  return s;
}

let tranceTimer=null,tranceIdx=0;
function openGoalTrance(){
  const g=featuredGoal();if(!g)return;
  const old=document.getElementById('trance');if(old)old.remove();
  const cd=goalDays(g);
  const pool=MANIFEST_QUOTES.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const picked=pool.slice(0,8);
  const lines=['Breathe.',...picked];
  if(cd!==null&&cd>=0)lines.push(`${cd} days. You already have it.`);
  lines.push('Now go take it.');
  const el=document.createElement('div');
  el.id='trance';
  el.innerHTML=`
    <div class="wr-amb">${[1,2,3,4,5,6].map(i=>`<span class="wr-ember e${i}"></span>`).join('')}</div>
    <div class="tr-halo"></div>
    <button class="vm-x tr-x" title="Come back">×</button>
    <div class="tr-core">
      <div class="tr-cap">${esc(g.label||'Goal')}</div>
      <div class="tr-goal">${esc(g.text)}</div>
      <div class="tr-line" id="tr-line"></div>
    </div>
    <div class="tr-progress"><div class="tr-progress-fill" id="tr-fill"></div></div>`;
  document.body.appendChild(el);
  try{if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}
  // start manifest track softly if nothing is playing
  if(!musicOn){musicIdx=0;playTrack(0);setMusicVol(Math.min(musicVol,40));}
  tranceIdx=0;
  const lineEl=el.querySelector('#tr-line'),fill=el.querySelector('#tr-fill');
  const show=()=>{
    if(tranceIdx>=lines.length){closeTrance();return;}
    const words=lines[tranceIdx].split(' ');
    lineEl.innerHTML=words.map((w,i)=>`<span style="animation-delay:${120+i*90}ms">${esc(w)}</span>`).join(' ');
    fill.style.width=Math.round((tranceIdx+1)/lines.length*100)+'%';
    tranceIdx++;
    const dwell=Math.max(4200,1600+words.length*520);
    clearTimeout(tranceTimer);tranceTimer=setTimeout(show,dwell);
  };
  show();
  el.querySelector('.tr-x').onclick=closeTrance;
  el.querySelector('.tr-core').onclick=()=>{clearTimeout(tranceTimer);show();};
  document.addEventListener('keydown',trKeys);
}
function trKeys(e){if(e.key==='Escape')closeTrance();if(e.key==='ArrowRight'||e.key===' '){clearTimeout(tranceTimer);const el=document.getElementById('trance');if(el)el.querySelector('.tr-core').click();}}
function closeTrance(){
  clearTimeout(tranceTimer);tranceTimer=null;
  document.removeEventListener('keydown',trKeys);
  const el=document.getElementById('trance');if(el)el.remove();
  if(document.fullscreenElement){try{document.exitFullscreen().catch(()=>{});}catch(e){}}
}

const MO_LIST_META={

function vmKeys(e){
  if(e.key==='Escape')closeVision();
  if(e.key==='ArrowRight'||e.key===' ')slideGo(1);

function slideGo(d){if(!slideDeck.length){closeVision();return;}slideIdx=(slideIdx+d+slideDeck.length)%slideDeck.length;slideShow();}
function slideShow(){
  const el=document.getElementById('vision-modal');if(!el)return;
  const s=slideDeck[slideIdx];if(!s){closeVision();return;}
  const stage=el.querySelector('.vm-stage');
  const cap=el.querySelector('.vm-cap');
  let dwell=8000;
  if(s.vidItem){
    const myIdx=slideIdx;
    stage.innerHTML=`<video class="vm-img vm-vid kb${slideIdx%2}" muted playsinline autoplay loop></video>`;
    cap.style.animation='none';void cap.offsetWidth;cap.style.animation='';
    cap.textContent=s.text||'';
    videoURL(s.vidItem).then(u=>{
      if(slideIdx!==myIdx||!u)return;
      const ve=stage.querySelector('video');if(!ve)return;
      ve.onloadedmetadata=()=>{if(slideIdx!==myIdx)return;clearTimeout(slideTimer);slideTimer=setTimeout(()=>slideGo(1),Math.min(45000,Math.max(8000,(ve.duration||8)*1000)));};
      ve.src=u;ve.play().catch(()=>{});
    }).catch(()=>{});

    stage.innerHTML=`<img src="${esc(s.img)}" class="vm-bg" alt="" draggable="false" referrerpolicy="no-referrer"><img src="${esc(s.img)}" referrerpolicy="no-referrer" class="vm-img kb${slideIdx%2}" alt="" draggable="false">`;
    cap.style.animation='none';void cap.offsetWidth;cap.style.animation='';
    cap.textContent=s.text||'';

    stage.innerHTML=`<div class="vm-textslide" style="--sc:${s.color}">
      <span class="vm-slide-label">${esc(s.label)}</span>

  el.querySelector('.vm-goal').innerHTML=fg?(esc(fg.text)+(cd!==null&&cd>=0?` <span class="vm-goal-d">${cd} days</span>`:'')):'';

  if(nxt&&nxt.vidItem)videoURL(nxt.vidItem).catch(()=>{});
  clearTimeout(slideTimer);
  slideTimer=setTimeout(()=>slideGo(1),dwell);
}

/* lock screen */
async function pinHash(pin){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mo-os:'+pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function showLock(mode,onUnlock){
  // mode: 'enter' | 'set'
  let stage=mode,firstPin='',buf='';
  const el=document.createElement('div');
  el.id='lock-screen';
  el.innerHTML=`
    <div class="lk-mark">M</div>
    <div class="lk-title" id="lk-title"></div>
    <div class="lk-dots" id="lk-dots">${'<span></span>'.repeat(4)}</div>
    <div class="lk-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <span></span><button data-k="0">0</button><button data-k="del">⌫</button>
    </div>`;
  document.body.appendChild(el);
  const title=el.querySelector('#lk-title');
  const dots=el.querySelectorAll('#lk-dots span');
  const setTitle=()=>{title.textContent=stage==='enter'?'Enter your code':stage==='set'?'Set a 4-digit code':'Enter it again';};
  const paint=()=>{dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length));};
  const shake=()=>{
    const w=el.querySelector('#lk-dots');
    w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
    buf='';setTimeout(paint,250);
  };
  const done=()=>{el.remove();document.removeEventListener('keydown',keys);onUnlock();};
  const submit=async()=>{
    const h=await pinHash(buf);
    if(stage==='enter'){
      const entered=buf;
      title.textContent='Checking…';
      try{
        const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:entered})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){title.textContent=d.error==='Too many attempts. Wait 15 minutes.'?d.error:'Enter your code';shake();return;}
        cryptoKey=await deriveKey(entered,d.pepper);
        await stashKey();
        await stashMediaSecret(d.pepper);
        try{localStorage.setItem('os:unlock',h);}catch(_){}
        if(!S){await load();if(!S){title.textContent='Could not read your data';return;}}
        done();
      }catch(e){
        // offline or local dev: fall back to local check while data is unencrypted
        if(S&&S.pinHash&&h===S.pinHash){try{localStorage.setItem('os:unlock',h);}catch(_){}done();}
        else{title.textContent='Cannot verify right now';shake();}
      }
    }else if(stage==='set'){
      firstPin=buf;buf='';stage='confirm';setTitle();paint();
    }else{
      if(buf===firstPin){
        S.pinHash=h;save();
        try{localStorage.setItem('os:unlock',h);}catch(_){}
        done();
      }else{stage='set';firstPin='';setTitle();shake();}
    }
  };
  const press=k=>{
    if(k==='del'){buf=buf.slice(0,-1);paint();return;}
    if(buf.length>=4)return;
    buf+=k;paint();
    if(buf.length===4)setTimeout(submit,140);
  };
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  function keys(e){
    if(/^[0-9]$/.test(e.key))press(e.key);
    if(e.key==='Backspace')press('del');
  }
  document.addEventListener('keydown',keys);
  setTitle();paint();
}

/* LIFE DATA: Whoop, Hevy, calendar and food from /api/life (server reads them; the

const _life={};
async function lifeData(view,force){
  const c=_life[view];
  if(!force&&c&&Date.now()-c.at<5*60e3)return c.data;
  const sec=mediaSecret();
  if(!sec)return {needsUnlock:true};
  try{
    const r=await fetch('/api/life?view='+view,{headers:{'x-moos-secret':sec}});
    if(r.status===401){try{localStorage.removeItem('os:media');}catch(_){}return {needsUnlock:true};}

}

function todaySay(d){
  const out=[];

  if(sl&&sl.hours!=null){
    const h=sl.hours;
    const night=h<5?`Rough night, only <b>${h} hours</b>`:h<6.5?`Short night, <b>${h} hours</b>`:h<7.5?`Decent night, <b>${h} hours</b>`:`Solid night, <b>${h} hours</b>`;
    out.push(rec!=null?`${night}, and recovery's at <b>${rec}%</b>. ${rec<34?'Keep today light and get to bed early.':rec<67?'Treat it as a normal day, not a max day.':'Your body is ready, so go hard today.'}`:night+'.');
  }
  if(cal){
    const up=cal.events.filter(e=>!e.past);
    if(!cal.events.length)out.push('Nothing on the calendar today, so it\'s all deep work.');
    else if(!up.length)out.push(`All ${cal.events.length} of today's calls are done.`);
    else{
      const first=up[0];
      const fed=f&&f.calories>=600;
      out.push(`You've got <b>${up.length} call${up.length>1?'s':''}</b> left, next at <b>${fmt12(first.start)}</b>${fed?'.':', so eat something real before then.'}`);
    }
  }
  if(f){
    const tc=(f.targets&&f.targets.calories)||3000,tp=(f.targets&&f.targets.protein)||150;
    if(!f.calories)out.push('No food logged yet. Send Grok a photo of your first meal.');
    else if(f.calories<tc)out.push(`You're at ${nf(f.calories)} calories, ${nf(tc-f.calories)} to go, and ${Math.max(0,tp-(f.protein||0))}g of protein left.`);
    else out.push(`Calories done for the day${(f.protein||0)<tp?`, just ${tp-f.protein}g of protein left`:', protein too'}. Nice.`);
  }
  return out.join(' ');
}

const trackedDays=()=>Math.max(1,Math.round((new Date(todayKey()+'T12:00')-new Date(trackFrom()+'T12:00'))/864e5)+1);
const trackedWeeks=()=>Math.max(1,trackedDays()/7);
const sinceNote=()=>_trackFrom>since(rangeDays())?'since '+dateLbl(_trackFrom):RANGES[bodyRange].label;
function rangeDays(){return RANGES[bodyRange].days;}
function bodyData(){return lifeData('body&days='+rangeDays());}

/* buckets for the current range: day / week / month */
function buckets(startKey){
  const R=RANGES[bodyRange],out=[],t=todayKey();
  const lo=startKey&&startKey>since(R.days)?startKey:since(R.days);
  if(R.by==='day'){
    const hi=addD(lo,6)>t?addD(lo,6):t;
    const n=Math.round((new Date(hi+'T12:00')-new Date(lo+'T12:00'))/864e5)+1;
    for(let k=lo;k<=hi;k=addD(k,1))out.push({from:k,to:k,label:n<=14?dayLbl(k)+' '+(+k.slice(8)):dateLbl(k),tip:dayLbl(k)+' '+dateLbl(k),today:k===t,future:k>t});
  }else if(R.by==='week'){
    for(let i=12;i>=-3;i--){const to=addD(t,-i*7),from=addD(to,-6);if(to<lo)continue;if(from>t&&out.filter(x=>x.future).length>=2)break;out.push({from,to,label:dateLbl(from),tip:'Week of '+dateLbl(from),today:from<=t&&t<=to,future:from>t});}
  }else{
    for(let i=11;i>=-2;i--){const n=new Date();n.setDate(1);n.setMonth(n.getMonth()-i);const from=isoDay(n);const e=new Date(n);e.setMonth(e.getMonth()+1);e.setDate(0);if(isoDay(e)<lo)continue;if(from>t&&out.filter(x=>x.future).length>=1)break;out.push({from,to:isoDay(e),label:monLbl(from),tip:new Date(from+'T12:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}),today:from<=t&&t<=isoDay(e),future:from>t});}
  }
  return out;
}
const inB=(k,b)=>k>=b.from&&k<=b.to;
function bucketAvg(list,key,val,startKey){return buckets(startKey).map(b=>{const xs=list.filter(x=>inB(x[key],b)).map(val).filter(v=>v!=null);return {b,v:xs.length?avg(xs):null,n:xs.length};});}
function bucketCount(list,key,startKey){return buckets(startKey).map(b=>({b,v:list.filter(x=>inB(x[key],b)).length}));}

/* chart with axis, target line, average line, tooltips */
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function chart(o){
  const pts=o.pts,n=pts.length;if(!n)return '<div class="bd-empty">Nothing here yet.</div>';
  const W=380,h=o.h||124,L=44,Rr=46,T=16;
  const vals=pts.map(p=>p.v).filter(v=>v!=null);
  const isLine=o.kind==='line';
  const hi=(Math.max(o.max||0,(o.target||0)*1.12,...vals)||1)*1.04;
  const lo=isLine?Math.min(o.min??Infinity,o.target??Infinity,...vals)-(o.pad||1):0;
  const y=v=>T+(h-T)-((v-lo)/(hi-lo))*(h-T);
  const step=niceStep((hi-lo)/3);
  const ticks=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)ticks.push(v);
  const fmt=o.fmt||(v=>nf(Math.round(v)));const vf=o.vfmt||fmt;
  const slots=Math.max(n,isLine?n:6);
  const bw=(W-L-Rr)/slots,x=i=>L+i*bw+bw/2;
  const every=n<=14?1:Math.ceil(n/7);
  const showVals=!isLine&&n<=10;
  let body='';
  if(isLine){
    const have=pts.map((p,i)=>p.v==null?null:[x(i),y(p.v)]).filter(Boolean);
    body=`<polyline points="${have.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${o.color||'var(--accent)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`+
      pts.map((p,i)=>p.v==null?'':(o.dots===false
        ?`<circle class="p" data-tip="${esc(p.tip||'')}" cx="${x(i)}" cy="${y(p.v)}" r="7" fill="transparent"/>${i===n-1?`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="${o.color||'var(--accent)'}"/><text class="val" x="${x(i)}" y="${y(p.v)-9}" text-anchor="end">${vf(p.v)}</text>`:''}`
        :`<circle class="p" data-tip="${esc(p.tip||'')}" cx="${x(i)}" cy="${y(p.v)}" r="${p.today?4.2:3.2}" fill="${o.color||'var(--accent)'}"/>${showVals||n<=8?`<text class="val" x="${x(i)}" y="${y(p.v)-8}" text-anchor="middle">${vf(p.v)}</text>`:''}`)).join('');
  }else{
    body=pts.map((p,i)=>{
      if(p.v==null)return p.future?`<rect x="${x(i)-bw*.3}" y="${T}" width="${bw*.6}" height="${h-T}" rx="4" fill="rgba(255,255,255,.025)"/>`:'';
      const c=typeof o.color==='function'?o.color(p.v):(o.color||'var(--accent)');
      return `<rect class="b" data-tip="${esc(p.tip||'')}" x="${x(i)-bw*.3}" y="${y(p.v)}" width="${bw*.6}" height="${Math.max(2,h-y(p.v))}" rx="4" fill="${c}"${p.today?' stroke="rgba(255,255,255,.45)" stroke-width="1"':''}/>`+
        (showVals?`<text class="val" x="${x(i)}" y="${y(p.v)-5}" text-anchor="middle">${vf(p.v)}</text>`:'');
    }).join('');
  }
  const a=o.avg!=null?o.avg:(o.showAvg&&vals.length>1?avg(vals):null);
  return `<div class="ch"><svg viewBox="0 0 ${W} ${h+20}">
    <g class="grid">${ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join('')}</g>
    ${o.target!=null?`<line class="tgt" x1="${L}" x2="${W-Rr}" y1="${y(o.target)}" y2="${y(o.target)}"/><text class="lbl" x="${W-Rr+5}" y="${y(o.target)+3}">goal ${fmt(o.target)}</text>`:''}
    ${a!=null?`<line class="avgl" x1="${L}" x2="${W-Rr}" y1="${y(a)}" y2="${y(a)}"/><text class="lbl avg" x="${W-Rr+5}" y="${y(a)+(o.target!=null&&Math.abs(y(a)-y(o.target))<10?12:3)}">avg ${vf(Math.round(a*10)/10)}</text>`:''}
    ${body}
    ${pts.map((p,i)=>i%every===0||p.today?`<text class="${p.today?'now':p.future?'fut':''}" x="${x(i)}" y="${h+14}" text-anchor="middle">${p.label}</text>`:'').join('')}
  </svg><div class="ch-tip"></div></div>`;
}
function wireCharts(root){
  root.querySelectorAll('.ch').forEach(ch=>{
    const tip=ch.querySelector('.ch-tip');
    ch.querySelectorAll('[data-tip]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{const r=el.getBoundingClientRect(),c=ch.getBoundingClientRect();tip.innerHTML=el.dataset.tip;tip.style.display='block';tip.style.left=(r.left+r.width/2-c.left)+'px';tip.style.top=(r.top-c.top)+'px';});
      el.addEventListener('mouseleave',()=>{tip.style.display='none';});
    });
  });
}
function spark(vals,{w=92,h=34,color='var(--accent)'}={}){
  const v=vals.filter(x=>x!=null);if(v.length<2)return '';
  const lo=Math.min(...v),hi=Math.max(...v),rg=hi-lo||1;
  const pts=v.map((x,i)=>`${(i/(v.length-1))*w},${h-3-((x-lo)/rg)*(h-6)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const since=n=>addD(todayKey(),-n+1);
const inRange=(k)=>k>=since(rangeDays());
function weekStart(){const t=new Date();const d=(t.getDay()+6)%7;return addD(todayKey(),-d);}

/* series builders */
function sleepPts(d){const sl=(d.sleep||[]).filter(x=>x.date);return bucketAvg(sl,'date',x=>x.hours).map(({b,v,n})=>({label:b.label,today:b.today,future:b.future,v:v==null?null:r1(v),tip:`<b>${r1(v)}h</b><small>${b.tip}${n>1?' · avg of '+n+' nights':''}</small>`}));}
function calPts(d,key,unit){const fd=(d.food||[]);return bucketAvg(fd,'date',x=>x[key],trackFrom()).map(({b,v,n})=>({label:b.label,today:b.today,future:b.future,v:v==null?null:Math.round(v),tip:`<b>${nf(Math.round(v))}${unit}</b><small>${b.tip}${n>1?' · avg of '+n+' days':''}</small>`}));}
function workoutPts(d){
  const ws=d.workouts||[];
  if(RANGES[bodyRange].by==='day'){
    // sessions per week, only weeks since tracking started
    const out=[];const t=todayKey();const weeks=bodyRange==='week'?1:5;
    for(let i=weeks-1;i>=0;i--){const to=addD(t,-i*7),from=addD(to,-6);if(to<trackFrom())continue;const n=ws.filter(w=>w.date>=from&&w.date<=to).length;out.push({label:'Wk of '+dateLbl(from),today:i===0,v:n,tip:`<b>${n} session${n===1?'':'s'}</b><small>Week of ${dateLbl(from)}</small>`});}
    return out;
  }
  return bucketCount(ws,'date',trackFrom()).map(({b,v})=>{const weeks=RANGES[bodyRange].by==='month'?4.33:1;return {label:b.label,v:RANGES[bodyRange].by==='month'?r1(v/weeks):v,tip:`<b>${v} session${v===1?'':'s'}</b><small>${b.tip}${RANGES[bodyRange].by==='month'?' · '+r1(v/weeks)+' a week':''}</small>`};});
}
function weightPts(d){const w=(d.weights||[]).filter(x=>inRange(x.date));
  if(RANGES[bodyRange].by==='day')return w.map(x=>({label:dateLbl(x.date),v:x.lb,tip:`<b>${x.lb} lbs</b><small>${dayLbl(x.date)} ${dateLbl(x.date)}</small>`}));
  return bucketAvg(w,'date',x=>x.lb,trackFrom()).filter(x=>x.v!=null).map(({b,v,n})=>({label:b.label,today:b.today,future:b.future,v:r1(v),tip:`<b>${r1(v)} lbs</b><small>${b.tip} · avg of ${n}</small>`}));}

/* OVERVIEW */

      ${goalCard(bodyRange==='today'?'Calories today':'Calories, avg per day '+sinceNote(),fd.length?avg(fd.map(x=>x.calories)):null,T.calories,'',fd.length?`${fd.length} day${fd.length===1?'':'s'} logged ${sinceNote()}`:'Nothing logged yet','var(--accent)')}
      ${goalCard(bodyRange==='today'?'Protein today':'Protein, avg per day',fd.length?avg(fd.map(x=>x.protein)):null,T.protein,'g','','var(--teal)')}
      ${goalCard(bodyRange==='today'?'Last night':'Sleep, avg per night',sl.length?r1(avg(sl.map(x=>x.hours))):null,8,'h',sl.length?'In bed around '+fmt12(avgClock(sl.slice(-7).map(x=>x.bed),12*60)):'','var(--gold)')}
    </div>
    ${ifCharts(`    <div class="bd-mini">
      <div class="card"><h4>Sleep <b>${sl.length?r1(avg(sl.map(x=>x.hours)))+'h avg':''}</b></h4>${chart({pts:sleepPts(d),target:8,color:sleepColor,h:90,fmt:v=>r1(v)+'h'})}</div>
      <div class="card"><h4>Calories <b>${fd.length?nf(Math.round(avg(fd.map(x=>x.calories)))):''}</b></h4>${chart({pts:calPts(d,'calories',' cal'),target:T.calories,color:v=>v>=T.calories*.9?'var(--good)':'var(--accent)',h:90,fmt:v=>nf(Math.round(v))})}</div>
      <div class="card"><h4>Workouts per week <b>${thisWeek}/${T.workouts_per_week} this week</b></h4>${chart({pts:workoutPts(d),target:T.workouts_per_week,max:T.workouts_per_week+1,color:v=>v>=T.workouts_per_week?'var(--good)':v>0?'var(--warn)':'rgba(255,255,255,.12)',h:90,fmt:v=>Math.round(v)})}</div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>Bodyweight <span class="h3sub">${wNow!=null?wNow+' lbs now, goal '+T.goal_weight_lb:'goal '+T.goal_weight_lb+' lbs'}</span></h3>${weightPts(d).length>1?chart({kind:'line',pts:weightPts(d),target:T.goal_weight_lb,pad:2,fmt:v=>Math.round(v),vfmt:v=>r1(v)}):'<div class="bd-empty">Weigh in each morning and send Grok the number. The trend shows up after a few days.</div>'}</div>
      <div class="card"><h3>Recovery <span class="h3sub">Whoop</span></h3>${chart({pts:bucketAvg((d.recovery||[]),'date',x=>x.score).map(({b,v,n})=>({label:b.label,today:b.today,future:b.future,v:v==null?null:Math.round(v),tip:`<b>${Math.round(v)}%</b><small>${b.tip}</small>`})),target:67,max:100,color:recColor,fmt:v=>v+'%'})}</div>
    </div>`)}`;
}
/* SLEEP */
function bodySleep(d){
  const sl=(d.sleep||[]).filter(x=>inRange(x.date)),rc=(d.recovery||[]).filter(x=>inRange(x.date));
  if(!sl.length)return '<div class="card"><div class="bd-empty">No sleep data from Whoop for this range.</div></div>';
  const bed=avgClock(sl.map(x=>x.bed),12*60),wake=avgClock(sl.map(x=>x.woke),0);
  const latePts=bucketAvg(sl,'date',x=>{const m=clockMins(x.bed,12*60);return m==null?null:(m-21*60)/60;}).map(({b,v})=>({label:b.label,today:b.today,future:b.future,v:v==null?null:r1(v),tip:v==null?'':`<b>In bed ${fmt12(avgClock([sl.find(x=>inB(x.date,b))?.bed].filter(Boolean),12*60)||'')}</b><small>${b.tip}</small>`}));
  const hrvPts=bucketAvg(rc,'date',x=>x.hrv).filter(x=>x.v!=null).map(({b,v})=>({label:b.label,today:b.today,future:b.future,v:Math.round(v),tip:`<b>HRV ${Math.round(v)}</b><small>${b.tip}</small>`}));
  return `<div class="bd-stats">
      ${stat(bodyRange==='today'?'Last night':'Sleep, avg per night '+per(),r1(avg(sl.map(x=>x.hours)))+'<small>h</small>',bodyRange==='today'?fmt12(sl[sl.length-1].bed)+' to '+fmt12(sl[sl.length-1].woke):sl.filter(x=>x.hours>=7).length+' of '+sl.length+' nights over 7h')}
      ${stat(bodyRange==='today'?'Bedtime':'Bedtime, avg '+per(),bed?fmt12(bed):'·','Up '+(bodyRange==='today'?'at ':'around ')+(wake?fmt12(wake):'·'))}
      ${stat('Deep + REM, '+(bodyRange==='today'?'last night':'avg per night '+per()),r1(avg(sl.map(x=>(x.deep||0)+(x.rem||0))))+'<small>h</small>','Deep '+r1(avg(sl.map(x=>x.deep)))+'h · REM '+r1(avg(sl.map(x=>x.rem)))+'h')}
      ${stat('Recovery, '+(bodyRange==='today'?'today':'avg per day '+per()),rc.length?Math.round(avg(rc.map(x=>x.score)))+'<small>%</small>':'·',rc.length?'HRV '+Math.round(avg(rc.map(x=>x.hrv)))+' · resting HR '+Math.round(avg(rc.map(x=>x.rhr))):'',recClass(rc.length?avg(rc.map(x=>x.score)):null))}
    </div>
    ${ifCharts(`    <div class="grid g2" style="margin-bottom:16px">
      <div class="card"><h3>Hours asleep</h3>${chart({pts:sleepPts(d),target:8,color:sleepColor,showAvg:true,fmt:v=>r1(v)+'h'})}</div>
      <div class="card"><h3>Bedtime <span class="h3sub">hours after 9pm</span></h3>${chart({pts:latePts,target:3,max:9,color:v=>v<=3?'var(--good)':v<=4.5?'var(--warn)':'#f87171',fmt:v=>fmt12(String(Math.floor((21*60+v*60)/60)%24).padStart(2,'0')+':'+String(Math.round((v*60)%60)).padStart(2,'0'))})}</div>
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card"><h3>Recovery</h3>${chart({pts:bucketAvg(rc,'date',x=>x.score).map(({b,v})=>({label:b.label,today:b.today,future:b.future,v:v==null?null:Math.round(v),tip:`<b>${Math.round(v)}%</b><small>${b.tip}</small>`})),target:67,max:100,color:recColor,fmt:v=>v+'%'})}</div>
      <div class="card"><h3>HRV <span class="h3sub">higher is more recovered</span></h3>${hrvPts.length>1?chart({kind:'line',pts:hrvPts,color:'var(--teal)',pad:4,fmt:v=>Math.round(v)}):'<div class="bd-empty">Not enough data yet.</div>'}</div>
    </div>
`)}
    <div class="card"><h3>${bodyRange==='today'?'Last night':'Nights'}</h3><div class="bd-rows">${sl.slice().reverse().slice(0,bodyRange==='week'?7:14).map(x=>`<div class="r"><span class="d">${dayLbl(x.date)} ${dateLbl(x.date)}</span><span>${fmt12(x.bed)} to ${fmt12(x.woke)}</span><span class="m">${x.hours}h · deep ${x.deep}h · REM ${x.rem}h</span></div>`).join('')}</div></div>`;
}
/* TRAINING */
function bodyTraining(d){

      ${bodyRange==='today'?stat('Gym today',ws.some(w=>w.date===todayKey())?'Done':'Not yet',ws.some(w=>w.date===todayKey())?ws.filter(w=>w.date===todayKey()).map(w=>esc(w.title)+' · '+w.minutes+' min').join(', '):thisWeek+' of '+T.workouts_per_week+' this week so far'):goalCard('This week',thisWeek,T.workouts_per_week,'',thisWeek>=T.workouts_per_week?'Done for the week':(T.workouts_per_week-thisWeek)+' more to hit it','var(--good)')}
      ${bodyRange==='today'?goalCard('This week',thisWeek,T.workouts_per_week,'',(T.workouts_per_week-thisWeek)>0?(T.workouts_per_week-thisWeek)+' more to hit it':'Done for the week','var(--good)'):stat('Per week, '+sinceNote(),trackedDays()<7?'·':r1(inR.length/trackedWeeks())+'<small>avg</small>',inR.length+' session'+(inR.length===1?'':'s')+(trackedDays()<7?' so far, avg shows after a week':' total'))}
      ${stat('Weeks hitting '+T.workouts_per_week,weeksHit.split(' of ')[0]+'<small>of '+weeksHit.split(' of ')[1]+'</small>',sinceNote())}
      ${stat('Last workout',ws[0]?esc(ws[0].title):'·',ws[0]?(()=>{const n=Math.round((Date.now()-new Date(ws[0].date+'T12:00'))/864e5);return (n===0?'Today':n===1?'Yesterday':n+' days ago')+' · '+ws[0].minutes+' min';})():'')}
    </div>
    ${ifCharts(`    <div class="grid g2" style="margin-bottom:16px">
      <div class="card"><h3>Sessions per week <span class="h3sub">target ${T.workouts_per_week}</span></h3>${chart({pts:workoutPts(d),target:T.workouts_per_week,max:T.workouts_per_week+1,color:v=>v>=T.workouts_per_week?'var(--good)':v>0?'var(--warn)':'rgba(255,255,255,.12)',fmt:v=>Math.round(v)})}</div>
      <div class="card"><h3>Days trained <span class="h3sub">${sinceNote()}</span></h3><div class="cgrid">${cells.join('')}</div><div class="cgrid-cap"><span>${dateLbl(addD(todayKey(),-days+1))}</span><span>${inR.length} sessions</span><span>today</span></div></div>
    </div>
    <div class="card" style="margin-bottom:16px"><h3>Lifts <span class="h3sub">pick one, estimated max over time</span></h3>
      ${lifts.length?`<div class="lift-pick">${lifts.map(l=>`<button data-lift="${esc(l.exercise)}" class="${l.exercise===liftSel?'on':''}">${esc(shortLift(l.exercise))}</button>`).join('')}</div>
      ${L?`<div class="bd-stats" style="grid-template-columns:repeat(3,1fr)">
        ${(()=>{const h=(L.history||[])[L.history.length-1]||{};return stat('Last session',h.top_lb?h.top_lb+'<small>lbs × '+h.top_reps+'</small>':esc(L.last),esc(L.last)+' · '+dateLbl(L.last_date));})()}

/* DAY TIMELINE on Tasks: today's calendar, drag a task onto a time to put it on Google Calendar */
const TL_START=7,TL_END=26,TL_HPX=52; // 7am to 2am, 52px per hour
let tlPick=null,_tlTimer=null;
const tlMins=d=>{const x=new Date(d);let m=x.getHours()*60+x.getMinutes();if(m<TL_START*60)m+=1440;return m;};
const tlTop=d=>(tlMins(d)-TL_START*60)/60*TL_HPX;
const tlFmt=d=>{const x=new Date(d);return fmt12(String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'));};
const sameEvent=(t,e)=>e&&t.when&&Math.abs(Date.parse(e.start_iso)-Date.parse(t.when))<120e3&&(e.title||'').trim().toLowerCase()===t.name.trim().toLowerCase();
function slotDate(mins){const d=new Date();d.setHours(0,0,0,0);if(mins>=1440){d.setDate(d.getDate()+1);mins-=1440;}d.setHours(Math.floor(mins/60),mins%60,0,0);return d;}
/* "call clinton tomorrow 3pm @sales !" -> name, time, day offset, area, top3 */
function parseCapture(text){
  let t=' '+text.trim(),out={name:'',mins:null,dayOff:0,area:null,top3:false};
  const tm=/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i.exec(t);
  if(tm){let h=+tm[1]%12;if(tm[3].toLowerCase()==='pm')h+=12;out.mins=h*60+(+tm[2]||0);t=t.slice(0,tm.index)+' '+t.slice(tm.index+tm[0].length);}
  if(/\s(tomorrow|tmrw|tmr)\b/i.test(t)){out.dayOff=1;t=t.replace(/\s(tomorrow|tmrw|tmr)\b/i,' ');}
  const ar=/\s[@#]([a-z]+)\b/i.exec(t);
  if(ar){const E=execData();const p=E.projects.find(x=>(x.name||'').toLowerCase().startsWith(ar[1].toLowerCase()));if(p){out.area=p.id;t=t.slice(0,ar.index)+' '+t.slice(ar.index+ar[0].length);}}
  if(/\s!$/.test(t)||/^\s!/.test(t)){out.top3=true;t=t.replace(/\s!$/,'').replace(/^\s!/,' ');}
  out.name=t.replace(/\s+/g,' ').trim();
  if(out.mins!=null&&!/\s(today)\b/i.test(' '+text))out.name=out.name.replace(/\s(today)\b/i,'');
  return out;
}
function parseTimeTail(text){const p=parseCapture(text);return p.mins==null?null:{name:p.name,mins:p.mins+p.dayOff*1440};}

    ${tlPick?`<div class="tl-pick">Tap a time for <b>${esc(pickName)}</b> <button class="btn btn-sm" id="tl-pick-cancel">Cancel</button></div>`:`<div class="tl-hint">Drag a task onto a time, or tap ⏱ on a task. It goes on your Google Calendar.</div>`}
    <div class="tl-scroll ${tlPick?'picking':''}" id="tl-scroll"><div class="tl-body" style="height:${H}px">${hours.join('')}${slots.join('')}${blocks}${showNow?`<div class="tl-now" style="top:${(nowM-TL_START*60)/60*TL_HPX}px"><span>${tlFmt(new Date())}</span></div>`:''}</div></div>
  </div>`;
}

  // keep the calendar side fresh while this page is open

  _tlTimer=setInterval(async()=>{if(currentView!=='tasks'){clearInterval(_tlTimer);return;}const d=await lifeData('today',true);if(currentView==='tasks'&&d&&!d.needsUnlock){const el=document.getElementById('tl-wrap');if(el){el.innerHTML=timelineHTML();wireTimeline();}}},60e3);
  if(!_life.today)lifeData('today').then(()=>{if(currentView==='tasks'){const el=document.getElementById('tl-wrap');if(el){el.innerHTML=timelineHTML();wireTimeline();}}});
}


/* MONEY page: balances Grok logs from Plaid, net worth over time, month, runway */
const cad=n=>n==null?'·':(n<0?'-':'')+'$'+nf(Math.round(Math.abs(n)));
const TYPE_LBL={cash:'Cash',savings:'Savings',investment:'Investments',crypto:'Crypto',tax:'Tax reserve',credit:'Credit cards',loan:'Loans',other:'Other'};
const TYPE_COL={cash:'var(--teal)',savings:'var(--good)',investment:'var(--accent)',crypto:'var(--gold)',tax:'var(--warn)',other:'rgba(255,255,255,.3)'};
let mnTab=(()=>{try{return localStorage.getItem('os:mnTab')||'overview';}catch(_){return 'overview';}})();
function mnParts(d){
  const tx=d.tax||{},est=tx.estimate||{},bt=d.by_type_cad||{};
  const invested=(bt.investment||0)+(bt.crypto||0),owed=(bt.credit||0)+(bt.loan||0);
  const byInst={};(d.accounts||[]).filter(a=>Math.abs(a.balance)>=1).forEach(a=>{const k=a.institution||'Other';(byInst[k]=byInst[k]||[]).push(a);});
  const instSum=k=>byInst[k].reduce((t,x)=>t+(['credit','loan'].includes(x.type)?-x.cad:x.cad),0);
  const instOrder=Object.keys(byInst).sort((a,b)=>instSum(b)-instSum(a));
  const gap=tx.gap_cad||0,ok=gap>=0;
  return {tx,est,bt,invested,owed,byInst,instSum,instOrder,gap,ok};
}
const monthName=m=>new Date(m+'-15T12:00').toLocaleDateString('en-US',{month:'short'});
function mnOverview(d){
  const {tx,est,bt,invested,owed,byInst,instSum,instOrder,gap,ok}=mnParts(d);
  const assets=[['cash',bt.cash||0],['savings',bt.savings||0],['investment',bt.investment||0],['crypto',bt.crypto||0],['tax',bt.tax||0]].filter(([,v])=>v>0);
  const tot=assets.reduce((a,[,v])=>a+v,0)||1;
  const last=(tx.payouts||[]).slice(-1)[0];
  return `
    ${d.as_of?`<div class="card mn-hero">
      <div><div class="bd-cap">Net worth, everything in CAD</div><div class="mn-big">${cad(d.net_worth_cad)}</div>
        <div class="mn-delta ${d.change_30d_cad>=0?'up':'down'}">${d.change_30d_cad!=null?(d.change_30d_cad>=0?'▲ +':'▼ ')+cad(d.change_30d_cad)+' in the last 30 days':'As of '+dateLbl(d.as_of)}</div></div>
      <div class="mn-hero-side">
        <div><span>Cash</span><b>${cad(d.liquid_cad)}</b></div>
        <div><span>Invested</span><b>${cad(invested)}</b></div>
        ${bt.tax?`<div><span>Tax reserve</span><b>${cad(bt.tax)}</b></div>`:''}
        ${owed?`<div><span>Owed</span><b style="color:#f87171">-${cad(owed)}</b></div>`:''}
      </div>
    </div>`:`<div class="card" style="margin-bottom:16px"><div class="mn-empty">No balances yet. Tell Grok <b>"log my balances"</b>.</div></div>`}
    <div class="bd-stats" style="grid-template-columns:repeat(3,1fr)">
      ${stat('Earned this year',cad(tx.ytd_income_cad)+'<small>CAD</small>',(tx.payouts_count||0)+' payouts')}
      ${stat('Last payout',last?cad(last.cad):'·',last?dateLbl(last.date):'None logged')}
      <div class="card mn-link" data-mntab="tax"><div class="bd-cap">Tax</div><div class="bd-big" style="color:${ok?'var(--good)':'#f87171'}">${ok?'Ahead':'Behind'}<small>by ${cad(Math.abs(gap))}</small></div><div class="bd-sub">${cad(tx.reserve_cad)} of ${cad(tx.should_have_set_aside_cad)} saved</div></div>
    </div>
    ${d.as_of?`<div class="grid g2">
      <div class="card"><h3>Where it sits</h3>
        <div class="mn-split">${assets.map(([t,v])=>`<b style="width:${v/tot*100}%;background:${TYPE_COL[t]||TYPE_COL.other}"></b>`).join('')}</div>
        <div class="bd-rows">${assets.map(([t,v])=>`<div class="r"><span class="d" style="color:${TYPE_COL[t]||TYPE_COL.other}">●</span><span>${TYPE_LBL[t]||t}</span><span class="m">${cad(v)} · ${Math.round(v/tot*100)}%</span></div>`).join('')}
        ${owed?`<div class="r"><span class="d" style="color:#f87171">●</span><span>Owed</span><span class="m" style="color:#f87171">-${cad(owed)}</span></div>`:''}</div></div>
      <div class="card mn-link" data-mntab="accounts"><h3>By bank <span class="h3sub">see all →</span></h3><div class="bd-rows">${instOrder.map(k=>`<div class="r"><span class="d"></span><span>${esc(k)}</span><span class="m">${cad(instSum(k))}</span></div>`).join('')}</div></div>
    </div>`:''}`;
}
function mnTax(d){
  const {tx,est,gap,ok}=mnParts(d);
  const pct=tx.should_have_set_aside_cad?Math.min(100,Math.round((tx.reserve_cad||0)/tx.should_have_set_aside_cad*100)):0;
  const payRows=(tx.payouts||[]).slice().reverse().map(p=>`<div class="r"><span class="d">${dateLbl(p.date)}</span><span>${p.period?esc(p.period):monthName(p.date.slice(0,7))+' payout'}</span><span class="m">${p.currency!=='CAD'?p.currency+' '+nf(Math.round(p.amount))+' · ':''}<b style="color:var(--text)">${cad(p.cad)}</b></span></div>`).join('');
  const missing=(tx.missing_months||[]).map(monthName);
  return `
    <div class="card mn-tax">
      <div class="mn-tax-top">
        <div><div class="bd-cap">Should be set aside by today</div><div class="mn-big2">${cad(tx.should_have_set_aside_cad)}</div></div>
        <div><div class="bd-cap">In your tax reserve</div><div class="mn-big2" style="color:${ok?'var(--good)':'#f87171'}">${cad(tx.reserve_cad)}</div></div>
        <div><div class="bd-cap">${ok?'Ahead by':'Behind by'}</div><div class="mn-big2" style="color:${ok?'var(--good)':'#f87171'}">${cad(Math.abs(gap))}</div></div>
      </div>
      <div class="mn-bar"><b style="width:${pct}%;background:${ok?'var(--good)':'#f87171'}"></b></div>
      <div class="bd-cap" style="margin-top:8px">${pct}% there${tx.set_aside_pct?` · save <b style="color:var(--text)">${tx.set_aside_pct}%</b> of each payout, about ${cad(tx.set_aside_next_payout_cad)}`:''}</div>
    </div>
    <div class="bd-stats" style="grid-template-columns:repeat(4,1fr)">
      ${stat('Earned so far',cad(tx.ytd_income_cad)+'<small>CAD</small>',(tx.payouts_count||0)+' payouts'+(missing.length?', '+missing.join(', ')+' missing':''))}
      ${stat('Likely for the year',cad(tx.projected_income_cad),tx.months_left?tx.months_left+' payouts to go':'All in')}
      ${stat('Tax you\'ll owe',cad(est.total),est.effective_rate?est.effective_rate+'% of income':'')}
      ${stat('Due',dateLbl((tx.deadlines||{}).payment||'2027-04-30')+'<small>2027</small>','Filing deadline Jun 15')}
    </div>
    <div class="grid g2">
      <div class="card"><h3>Where the ${cad(est.total)} goes</h3><div class="bd-rows">
        <div class="r"><span class="d"></span><span>Federal income tax</span><span class="m">${cad(est.federal)}</span></div>
        <div class="r"><span class="d"></span><span>Ontario income tax${est.surtax?' (incl. surtax)':''}</span><span class="m">${cad(est.ontario)}</span></div>
        <div class="r"><span class="d"></span><span>Ontario health premium</span><span class="m">${cad(est.ohp)}</span></div>
        <div class="r"><span class="d"></span><span>CPP (self-employed, both halves)</span><span class="m">${cad(est.cpp)}</span></div>
        ${tx.deductions_cad?`<div class="r"><span class="d"></span><span>After ${cad(tx.deductions_cad)} in business expenses</span><span class="m"></span></div>`:`<div class="r"><span class="d"></span><span style="color:var(--faint)">No expenses deducted yet. Tell Grok what to deduct.</span><span class="m"></span></div>`}
      </div>
      <div class="bd-cap" style="margin-top:14px">2026 rates, Ontario, self-employed. Estimate.</div></div>
      <div class="card"><h3>Payouts <span class="h3sub">gross, converted on the day</span></h3><div class="bd-rows">${payRows||'<div class="bd-empty">None logged yet.</div>'}</div></div>
    </div>`;
}
function mnAccounts(d){
  const {byInst,instSum,instOrder}=mnParts(d);
  if(!d.as_of)return '<div class="card"><div class="mn-empty">No balances yet. Tell Grok <b>"log my balances"</b>.</div></div>';
  return `<div class="bd-cap" style="margin:-6px 0 14px">As of ${dateLbl(d.as_of)}</div>
    <div class="mn-cols">${instOrder.map(inst=>`<div class="card" style="margin-bottom:16px"><h3>${esc(inst)} <span class="h3sub">${cad(instSum(inst))}</span></h3>${byInst[inst].sort((a,b)=>b.cad-a.cad).map(a=>`<div class="mn-acc ${['credit','loan'].includes(a.type)?'neg':''}"><div><div class="n">${esc(a.name)}</div><div class="i">${TYPE_LBL[a.type]||a.type}</div></div><div class="b">${['credit','loan'].includes(a.type)?'-':''}${a.currency!=='CAD'?a.currency+' '+nf(Math.round(a.balance)):cad(a.balance)}${a.currency!=='CAD'?`<small>${cad(a.cad)} CAD</small>`:''}</div></div>`).join('')}</div>`).join('')}</div>`;
}
function moneyHTML(d){
  if(!d||d.error)return '<div class="bd-empty">Could not load right now.</div>';
  return ({overview:mnOverview,tax:mnTax,accounts:mnAccounts}[mnTab]||mnOverview)(d);
}
function renderMoney(){
  const tabs=[['overview','Overview'],['tax','Tax'],['accounts','Accounts']];
  main.innerHTML=`<div class="view"><div class="head"><div><h2 class="sec">Money</h2><p class="sec-sub">${mnTab==='tax'?'2026 estimate':'Updated every morning'}</p></div></div>
    <div class="bd-tabs" style="margin-bottom:18px">${tabs.map(([k,l])=>`<button class="bd-tab ${mnTab===k?'on':''}" data-mt="${k}">${l}</button>`).join('')}</div>
    <div id="mn"><div class="bd-empty">Loading…</div></div></div>`;
  main.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{mnTab=b.dataset.mt;try{localStorage.setItem('os:mnTab',mnTab);}catch(_){}renderMoney();});
  const paint=(d)=>{const el=document.getElementById('mn');if(!el||currentView!=='money')return;
    if(d&&d.needsUnlock){el.innerHTML=`<div class="tday-connect" style="margin:0"><span>Confirm your PIN once on this device to see your money.</span><button class="btn btn-sm" id="mn-connect">Connect</button></div>`;el.querySelector('#mn-connect').onclick=async()=>{await ensureMediaSecret();renderMoney();};return;}
    el.innerHTML=moneyHTML(d);
    el.querySelectorAll('[data-mntab]').forEach(c=>c.onclick=()=>{mnTab=c.dataset.mntab;try{localStorage.setItem('os:mnTab',mnTab);}catch(_){}renderMoney();});};
  if(_life.money)paint(_life.money.data);
  lifeData('money').then(paint);
}
/* boot */
/* INBOX: Grok Bot (via /api/mcp) drops tasks here, sealed to this app's public key.
   Only this app holds the private key (inside the encrypted state), so nothing else can read them. */
const INBOX_DOC='osinbox:Mo';
async function ensureInboxKey(){
  if(!cryptoKey||!S)return;
  try{
    if(!S.inboxPriv){
      const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
      S.inboxPriv=await crypto.subtle.exportKey('jwk',kp.privateKey);
      clearTimeout(saveTimer);await store.set(STORE_KEY,JSON.stringify(S));
    }
    const p=S.inboxPriv;
    const db=await fbInit();
    await db.collection('poppy').doc(INBOX_DOC).set({pub:JSON.stringify({kty:p.kty,crv:p.crv,x:p.x,y:p.y})},{merge:true});
  }catch(e){console.warn('inbox key',e);}
}
let _draining=false;
async function drainInbox(){
  if(_draining||!cryptoKey||!S||!S.inboxPriv)return;
  _draining=true;
  try{
    const db=await fbInit();
    const snap=await db.collection('poppy').doc(INBOX_DOC).get();
    if(!snap.exists)return;
    const data=snap.data()||{};
    const ids=Object.keys(data).filter(k=>/^i\d/.test(k));
    if(!ids.length)return;
    const priv=await crypto.subtle.importKey('jwk',S.inboxPriv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
    const items=[];
    for(const id of ids){
      try{
        const env=JSON.parse(data[id]);
        const epk=await crypto.subtle.importKey('jwk',{...env.e,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[]);
        const k=await crypto.subtle.deriveKey({name:'ECDH',public:epk},priv,{name:'AES-GCM',length:256},false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},k,b64d(env.ct));
        items.push(JSON.parse(new TextDecoder().decode(pt)));
      }catch(_){/* unreadable or junk: dropped below */}
    }
    items.sort((a,b)=>(a.ts||0)-(b.ts||0));
    const E=execData();
    let added=0,checked=0,journaled=0;
    for(const it of items){
      if(it.kind==='workout'){
        // a workout saved in Hevy checks off today's gym-type tasks
        const re=/\b(gym|lift|lifting|work ?out|(leg|push|pull|chest|back|arm|upper|lower) day)\b/i;
        openTasks().filter(t=>re.test(t.name)).forEach(t=>{completeTask(t.id);checked++;});
        if(!checked)etToast('Workout logged: '+(it.text||'gym'));
        continue;
      }
      if(it.kind==='journal'){
        const body=String(it.text||'').trim();if(!body)continue;
        const day=/^\d{4}-\d{2}-\d{2}$/.test(it.date||'')?it.date:today();
        const J=jrData();
        const k=Object.keys(J).filter(x=>jrBase(x)===day&&!J[x].done).sort().pop()||(J[day]?null:day)||(()=>{let n=2;while(J[day+'#'+n])n++;return day+'#'+n;})();
        const e=J[k]||(J[k]={title:it.title||'',text:'',ts:Date.now(),done:day<today()});
        e.text=(String(e.text||'').trim()?String(e.text).trim()+'\n\n':'')+body;
        if(!e.title&&it.title)e.title=it.title;
        e.ts=Date.now();journaled++;
        continue;
      }
      const text=String(it.text||'').trim();if(!text)continue;
      const area=String(it.area||'').trim().toLowerCase();
      const p=area?E.projects.find(x=>(x.name||'').trim().toLowerCase()===area):null;
      const t=addTask(text,{projectId:p?p.id:null});
      if(it.today&&top3Ids().length<3)toggleTop3(t.id);
      added++;
    }
    // persist the merged tasks before clearing the inbox so nothing can get lost
    if(added||checked||journaled){clearTimeout(saveTimer);await store.set(STORE_KEY,JSON.stringify(S));}
    const del={};ids.forEach(id=>{del[id]=firebase.firestore.FieldValue.delete();});
    await db.collection('poppy').doc(INBOX_DOC).update(del);
    if(checked)etToast('Workout done, '+checked+' gym task'+(checked>1?'s':'')+' checked off');
    if(journaled)etToast('Journal updated from '+((items.find(x=>x.kind==='journal')||{}).src||'your inbox'));
    if(added||checked||journaled){
      const typing=['INPUT','TEXTAREA'].includes(document.activeElement&&document.activeElement.tagName);
      if(!typing&&(currentView==='tasks'||currentView==='morning'||currentView==='journal'))render();
      if(added)etToast(added+' task'+(added>1?'s':'')+' added from '+((items[0]&&items[0].src)||'your inbox'));
    }
  }catch(e){console.warn('inbox drain',e);}
  finally{_draining=false;}
}
function finishBoot(){
  ensureInboxKey().then(drainInbox);
  if(!window.__inboxTimer){
    window.__inboxTimer=setInterval(drainInbox,45000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){drainInbox();if(currentView==='morning')paintToday();}});
  }
  const wn=document.getElementById('ws-name');wn.value=S.wsName||'OS';
  wn.oninput=()=>{S.wsName=wn.value;save();document.title=wn.value||'MO OS';document.getElementById('brandmark').textContent=(S.name||wn.value||'M').trim().charAt(0).toUpperCase()||'M';};
  document.title=S.wsName||'MO OS';
  document.getElementById('brandmark').textContent=(S.name||S.wsName||'M').trim().charAt(0).toUpperCase()||'M';
  render();
}
(async function(){
  tick();setInterval(tick,20000);
  await restoreKey();
  await load();
  if(!S){
    // data is encrypted and this device has no (or a stale) key
    if(window.__LOCKED==='__BADKEY__'){try{localStorage.removeItem('os:key');}catch(_){}cryptoKey=null;}
    showLock('enter',finishBoot);
    return;
  }
  let stored=null;try{stored=localStorage.getItem('os:unlock');}catch(_){}
  if(!S.pinHash)showLock('set',finishBoot);
  else if(stored!==S.pinHash&&!cryptoKey)showLock('enter',finishBoot);
  else finishBoot();
})();
</script>
