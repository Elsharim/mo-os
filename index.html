  /* ===== HOME v2 ===== */
  .home2{display:flex;flex-direction:column;gap:14px}
  .hm-greet{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:2px}
  .hm-hello{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:0}
  .hm-date{font-size:12.5px;color:var(--muted);margin-top:4px}
  .hm-greet-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hm-streak{font-size:12px;color:var(--gold);background:rgba(251,191,36,.12);
    border:1px solid rgba(251,191,36,.3);padding:6px 13px;border-radius:99px}
  .hm-streak b{font-family:var(--mono);font-size:14px;font-weight:800}

  .hm-top{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}

  .hm-today{display:flex;gap:22px;align-items:center;padding:22px;border-radius:16px;
    border:1px solid var(--border-2);

  .hm-today.is-good{background:radial-gradient(120% 130% at 100% 0,rgba(52,211,153,.11),transparent 58%),linear-gradient(150deg,var(--card-hi),var(--card))}
  .hm-ring{position:relative;width:124px;height:124px;flex:0 0 124px}
  .hm-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hm-ring .pct b{font-size:34px;font-weight:800;font-family:var(--mono);letter-spacing:-.03em}
  .hm-ring .pct span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .hm-today-body{flex:1;min-width:0}
  .hm-today-hd{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:12px}
  .hm-chips{display:flex;flex-wrap:wrap;gap:7px}
  .hm-chip{display:inline-flex;align-items:center;gap:8px;font-family:inherit;cursor:pointer;
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;
    font-size:12.5px;color:var(--text);transition:.14s}
  .hm-chip:hover{border-color:var(--hc);transform:translateY(-2px)}
  .hm-chip-i{font-size:14px;filter:grayscale(.5);opacity:.7}
  .hm-chip b{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:700}
  .hm-chip.on{background:var(--good-soft);border-color:rgba(52,211,153,.4)}
  .hm-chip.on .hm-chip-i{filter:none;opacity:1}
  .hm-chip.on .hm-chip-l{color:var(--good)}
  .hm-chip.on b{color:var(--good)}

  .hm-focus{padding:22px;border-radius:16px;border:1px solid var(--border-2);cursor:pointer;
    background:radial-gradient(120% 130% at 0 0,rgba(251,191,36,.1),transparent 58%),linear-gradient(150deg,var(--card-hi),var(--card));
    display:flex;flex-direction:column;transition:.15s}
  .hm-focus:hover{transform:translateY(-2px);border-color:var(--warn)}
  .hm-focus.empty{background:linear-gradient(150deg,var(--card),var(--bg-2));border-style:dashed}
  .hm-focus-cap{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:700}
  .hm-focus-name{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.32;margin-top:12px}
  .hm-focus-none{font-size:16px;color:var(--faint);margin-top:12px;font-weight:600}
  .hm-focus-cta{font-size:12px;color:var(--accent);margin-top:8px}
  .hm-focus-next{margin-top:auto;padding-top:14px}
  .hm-fn{font-size:12px;color:var(--muted);padding:5px 0;border-top:1px solid var(--border)}

  .hm-week{display:block;padding:18px 22px;border-radius:16px;cursor:pointer;
    border:1px solid var(--border);background:linear-gradient(150deg,var(--card),var(--bg-2));
    position:relative;overflow:hidden;transition:.15s}
  .hm-week:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .hm-week::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
  .hm-week.ahead::before,.hm-week.secured::before{background:var(--good)}
  .hm-week.behind::before{background:var(--warn)}
  .hm-week.lost::before{background:var(--bad)}
  .hm-week-hd{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:13px}
  .hm-week-lead{display:flex;align-items:baseline;gap:12px;min-width:0}
  .hm-week-cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
  .hm-week-val{font-family:var(--mono);font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .hm-week-val i{font-style:normal;font-size:14px;color:var(--faint);font-weight:600;margin-left:4px}
  .hm-week.ahead .hm-week-val,.hm-week.secured .hm-week-val{color:var(--good)}
  .hm-week.behind .hm-week-val{color:var(--warn)}
  .hm-week.lost .hm-week-val{color:var(--bad)}
  .hm-week-tag{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;flex-shrink:0}
  .hm-week-tag.up{color:var(--good);background:var(--good-soft)}
  .hm-week-tag.down{color:var(--warn);background:var(--warn-soft)}
  .hm-week.lost .hm-week-tag{color:var(--bad);background:var(--bad-soft)}
  .hm-week-bar{height:8px;background:var(--bg);border:1px solid var(--border);border-radius:99px;overflow:hidden}
  .hm-week-bar-f{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .hm-week.ahead .hm-week-bar-f,.hm-week.secured .hm-week-bar-f{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .hm-week.behind .hm-week-bar-f{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .hm-week.lost .hm-week-bar-f{background:linear-gradient(90deg,var(--bad),#f5915e)}
  .hm-week-ft{display:flex;justify-content:space-between;gap:12px;margin-top:10px;
    font-size:11px;color:var(--faint);font-family:var(--mono)}

  /* net worth modal */
  .nw-panel{height:auto;max-height:none;padding-bottom:22px}

    padding:22px 22px 6px;color:var(--good)}
  .nw-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:14px 22px 0}
  @media(max-width:560px){.nw-grid{grid-template-columns:1fr}}
  .nw-row{display:flex;flex-direction:column;gap:7px;background:var(--bg);border:1px solid var(--border);
    border-radius:11px;padding:12px 14px;transition:border-color .13s;cursor:text}
  .nw-row:focus-within{border-color:var(--c)}
  .nw-row-l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:600;position:relative;padding-left:12px}
  .nw-row-l::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:99px;background:var(--c)}
  .nw-row-in{display:flex;align-items:center;gap:2px;font-family:var(--mono);color:var(--muted);font-size:17px}
  .nw-row-in input{background:none;border:none;color:var(--text);font-family:var(--mono);
    font-size:17px;font-weight:700;width:100%;padding:0}
  .nw-row-in input:focus{outline:none}
  .nw-note{font-size:11px;color:var(--faint);padding:16px 22px 0;line-height:1.5}
  .hm-edit{text-transform:none;letter-spacing:0;color:var(--accent);font-size:10px;
    opacity:0;transition:opacity .13s;margin-left:6px}
  .hm-m-card:hover .hm-edit{opacity:1}
  #hm-nw{cursor:pointer}
  #hm-nw:hover{border-color:var(--border-2);transform:translateY(-2px)}

  .hm-money{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}
  @media(max-width:900px){.hm-money{grid-template-columns:1fr 1fr}.hm-m-card.wide{grid-column:span 2}}
  @media(max-width:560px){.hm-money{grid-template-columns:1fr}.hm-m-card.wide{grid-column:span 1}}
  .hm-m-card{padding:18px 20px;border-radius:15px;border:1px solid var(--border);
    background:linear-gradient(160deg,var(--card),var(--bg-2));transition:.15s}
  .hm-m-card[data-goto]{cursor:pointer}
  .hm-m-card[data-goto]:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .hm-m-card.urgent{border-color:rgba(251,191,36,.35)}
  .hm-m-cap{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
  .hm-m-row{display:flex;gap:26px}
  .hm-m-item b{display:block;font-family:var(--mono);font-size:25px;font-weight:800;letter-spacing:-.03em;color:var(--good)}
  .hm-m-item span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .hm-m-big{font-family:var(--mono);font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .hm-m-big span{font-size:13px;color:var(--faint);margin-left:5px;font-weight:600}
  .hm-m-big.muted{color:var(--faint)}
  .hm-m-foot{font-size:10.5px;color:var(--faint);margin-top:11px;line-height:1.4}

  .hm-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.hm-bottom{grid-template-columns:1fr}}
  .hm-card{padding:18px 20px;border-radius:15px;border:1px solid var(--border);
    background:linear-gradient(160deg,var(--card),var(--bg-2))}
  .hm-card-hd{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:13px}
  .hm-card-hd span{font-family:var(--mono);font-size:10.5px;color:var(--faint);
    background:rgba(255,255,255,.05);padding:2px 8px;border-radius:99px;letter-spacing:0}
  .hm-card-hd span.over{color:var(--bad);background:var(--bad-soft)}
  .hm-list{display:flex;flex-direction:column;gap:2px}

    cursor:pointer;transition:background .12s}

  .hm-li-box{width:16px;height:16px;flex:0 0 16px;border:1.5px solid var(--border-2);border-radius:5px;transition:.13s}
  .hm-li:hover .hm-li-box{border-color:var(--good);background:var(--good-soft)}
  .hm-li-dot{width:7px;height:7px;flex:0 0 7px;border-radius:99px;background:var(--muted)}
  .hm-li-dot.past{background:var(--bad)}
  .hm-li em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);flex-shrink:0}
  .hm-li em.past{color:var(--bad)}
  .hm-empty{font-size:12.5px;color:var(--faint);padding:8px 2px}

  /* ===== WEEK: PACE ===== */
  .h2-pace{border:1px solid var(--border-2);padding:24px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-pace::before{content:"";position:absolute;inset:0 0 auto;height:3px}
  .h2-pace.ahead::before,.h2-pace.secured::before{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .h2-pace.behind::before{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .h2-pace.lost::before{background:linear-gradient(90deg,var(--bad),#f5915e)}

  .h2-wk-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:20px}
  .h2-wk-cap{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .h2-wk-pace{display:flex;align-items:baseline;gap:9px;margin:9px 0 8px;line-height:1}
  .h2-wk-n{font-size:58px;font-weight:800;font-family:var(--mono);letter-spacing:-.05em}
  .h2-pace.ahead .h2-wk-n,.h2-pace.secured .h2-wk-n{color:var(--good)}
  .h2-pace.behind .h2-wk-n{color:var(--warn)}
  .h2-pace.lost .h2-wk-n{color:var(--bad)}
  .h2-wk-of{font-size:21px;font-family:var(--mono);color:var(--faint);font-weight:600}
  .h2-wk-delta{font-size:12.5px;font-weight:700;font-family:var(--mono)}
  .h2-wk-delta.up{color:var(--good)}
  .h2-wk-delta.down{color:var(--warn)}
  .h2-pace.lost .h2-wk-delta.down{color:var(--bad)}

  .h2-wk-right{text-align:right;flex-shrink:0}
  .h2-wk-earned b{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--text)}
  .h2-wk-earned span{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:3px}
  .h2-wk-need{margin-top:13px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.045);
    border:1px solid var(--border-2);display:inline-block}
  .h2-wk-need b{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em}
  .h2-wk-need span{font-size:10.5px;color:var(--muted);margin-left:4px}
  .h2-wk-need.done{color:var(--good);background:var(--good-soft);border-color:rgba(52,211,153,.35);
    font-size:13px;font-weight:700;padding:12px 16px}
  .h2-wk-need.lost{color:var(--bad);background:var(--bad-soft);border-color:rgba(248,113,113,.3);
    font-size:12.5px;font-weight:600}

  .h2-wk-meter{position:relative;height:10px;background:var(--bg);border:1px solid var(--border);
    border-radius:99px;margin-bottom:22px}
  .h2-wk-meter-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .h2-pace.ahead .h2-wk-meter-fill,.h2-pace.secured .h2-wk-meter-fill{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .h2-pace.behind .h2-wk-meter-fill{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .h2-pace.lost .h2-wk-meter-fill{background:linear-gradient(90deg,var(--bad),#f5915e)}
  .h2-wk-meter-goal{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text);opacity:.45;border-radius:2px}
  .h2-wk-meter-goal span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);
    font-size:9px;font-family:var(--mono);color:var(--muted);white-space:nowrap}

  .h2-wk-track{display:flex;gap:8px}
  .h2-wk-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .h2-wk-bar{width:100%;height:56px;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
  .h2-wk-bar-fill{width:100%;transition:height .6s cubic-bezier(.2,.8,.2,1)}
  .h2-wk-day.strong .h2-wk-bar-fill{background:linear-gradient(180deg,var(--good),#2fb87d)}
  .h2-wk-day.weak .h2-wk-bar-fill{background:linear-gradient(180deg,var(--warn),#d99a2e)}
  .h2-wk-day.zero .h2-wk-bar-fill{background:var(--border-2)}
  .h2-wk-day.today .h2-wk-bar{border-color:var(--accent);border-width:1.5px}
  .h2-wk-day.today .h2-wk-bar-fill{background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .h2-wk-day.future .h2-wk-bar{border-style:dashed;opacity:.4}
  .h2-wk-dv{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:600;min-height:13px}
  .h2-wk-dl{font-size:10px;font-weight:700;color:var(--faint)}

  @media (max-width:600px){

    .h2-wk-hero{flex-direction:column;gap:16px}
    .h2-wk-right{text-align:left}
    .h2-wk-n{font-size:46px}

/* end-to-end encryption: data is AES-encrypted before it leaves the browser */
let cryptoKey=null,encAtRest=false;
const ENC='enc1:';
function b64e(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64d(str){const s=atob(str);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function deriveKey(pin,pepper){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin+':'+pepper),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('mo-os-v1'),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function restoreKey(){
  try{
    const raw=localStorage.getItem('os:key');
    if(!raw)return null;
    cryptoKey=await crypto.subtle.importKey('raw',b64d(raw),{name:'AES-GCM'},true,['encrypt','decrypt']);
    return cryptoKey;
  }catch(e){return null;}
}
async function stashKey(){try{localStorage.setItem('os:key',b64e(await crypto.subtle.exportKey('raw',cryptoKey)));}catch(e){}}
async function encStr(str){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(str));
  return ENC+b64e(iv)+':'+b64e(ct);
}
async function decStr(v){
  const p=v.slice(ENC.length).split(':');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[0])},cryptoKey,b64d(p[1]));
  return new TextDecoder().decode(pt);
}
const store={
  async get(k){
    try{
      const db=await fbInit();
      const doc=await db.collection(OS_DOC.collection).doc(OS_DOC.doc).get();
      setSyncStatus('live');
      if(doc.exists){
        const v=doc.data()[OS_DOC.field];
        if(v!=null){
          if(String(v).startsWith(ENC)){
            encAtRest=true;
            if(!cryptoKey)return '__LOCKED__';
            try{const pt=await decStr(v);_mem[k]=pt;return pt;}
            catch(e){return '__BADKEY__';}
          }
          _mem[k]=v;return v;
        }
      }
    }catch(e){console.warn('store.get failed',e);setSyncStatus('error');}
    return _mem[k]??null;
  },
  async set(k,v){
    _mem[k]=v;
    try{
      let out=v;
      if(cryptoKey)out=await encStr(v);
      else if(encAtRest){console.warn('locked, write skipped');return;}
      const db=await fbInit();
      await db.collection(OS_DOC.collection).doc(OS_DOC.doc).set({[OS_DOC.field]:out});
      setSyncStatus('live');
    }catch(e){console.warn('store.set failed',e);setSyncStatus('error');}
  }
};

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>keyOf(new Date());
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);const x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return keyOf(x);}
const dow=k=>{const [y,m,d]=k.split('-').map(Number);return ['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(y,m-1,d).getDay()];};
const shortDate=k=>{const p=k.split('-');return Number(p[1])+'/'+Number(p[2]);};
function longDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}
function daysUntil(s){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function goalsList(){
  if(!Array.isArray(S.goalsList)){
    S.goalsList=[];
    const g=S.goals||{};
    if((g.ninetyDay||'').trim())S.goalsList.push({id:'g'+Date.now(),label:g.label||'90-day goal',text:g.ninetyDay,targetDate:g.targetDate||'',setAt:g.setAt||'',done:false});
    (g.big||[]).forEach((b,i)=>{if((b.text||'').trim())S.goalsList.push({id:'g'+Date.now()+'b'+i,label:'Big goal',text:b.text,targetDate:'',setAt:'',done:!!b.done});});
    save();

  return S.goalsList;
}
function featuredGoal(){return goalsList().find(x=>!x.done)||null;}
function goalDays(gl){return gl&&gl.targetDate?daysUntil(gl.targetDate):null;}
function goalPct(gl){
  if(!gl||!gl.targetDate||!gl.setAt)return null;
  const total=daysUntil(gl.targetDate)-daysUntil(gl.setAt);
  if(total<=0)return null;
  return Math.max(0,Math.min(100,Math.round(-daysUntil(gl.setAt)/total*100)));
}
function fmt(n){return Number(n||0).toLocaleString();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clip(s,n){s=(s||'').trim();return s.length>n?s.slice(0,n)+'…':s;}

function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{await store.set(STORE_KEY,JSON.stringify(S));},250);}
async function load(){
  const raw=await store.get(STORE_KEY);
  if(raw==='__LOCKED__'||raw==='__BADKEY__'){S=null;window.__LOCKED=raw;return;}
  window.__LOCKED=null;
  if(raw){try{S=Object.assign(structuredClone(DEFAULT),JSON.parse(raw));}catch(e){S=structuredClone(DEFAULT);}}
  else S=structuredClone(DEFAULT);
  for(const k in DEFAULT)if(!(k in S))S[k]=structuredClone(DEFAULT[k]);
  // migrations
  if(!Array.isArray(S.tasks))S.tasks=[];
  if(!S.money||typeof S.money!=='object')S.money={cash:0,investments:0,crypto:0,taxReserve:0};
  ['cash','investments','crypto','taxReserve'].forEach(f=>{if(typeof S.money[f]!=='number')S.money[f]=Number(S.money[f])||0;});
  if(Array.isArray(S.disciplines))S.disciplines.forEach(d=>{if(typeof d.weight!=='number')d.weight=10;});
  if(!Array.isArray(S.headTrash))S.headTrash=[];
  if(!S.weeklyJournals||typeof S.weeklyJournals!=='object')S.weeklyJournals={};
  if(!S.journal||typeof S.journal!=='object')S.journal={};
  if(!Array.isArray(S.notes))S.notes=[];
  if(!Array.isArray(S.goalLog))S.goalLog=[];
  if(!S.jrV2){
    Object.keys(S.journal).forEach(k=>{
      const e=S.journal[k];
      if(!e||typeof e!=='object'||e.title!==undefined)return;
      const blocks=String(e.text||'').split(/\n\n---\n\n(?=# )/);
      const parsed=blocks.map(b=>{
        const m=b.match(/^#\s+(.+)\n\n?([\s\S]*)$/);
        return m?{title:m[1].trim(),body:m[2]}:{title:'',body:b};
      });
      e.title=parsed[0].title||'';
      e.text=parsed.map((p,i)=>i===0?p.body:(p.title?p.title.toUpperCase()+'\n\n':'')+p.body).join('\n\n---\n\n').trim();
    });
    S.jrV2=true;save();
  }
  if(!S.jrV3){

    Object.entries(S.journal).forEach(([k,e])=>{
      if(!e||typeof e!=='object')return;
      if(e.done===undefined)e.done=k.split('#')[0]<tk;
    });
    S.jrV3=true;save();
  }
  if(!S.goals||typeof S.goals!=='object')S.goals={ninetyDay:"",targetDate:"",buyBox:"",big:[]};
  if(!S.goals.label)S.goals.label='90-day goal';
}

function dayRatio(k){const r=S.days[k];if(!r||!r.disc||!S.disciplines.length)return 0;return S.disciplines.filter(d=>r.disc[d.id]).length/S.disciplines.length;}
function dayDone(k){const r=S.days[k];if(!r||!r.disc)return 0;return S.disciplines.filter(d=>r.disc[d.id]).length;}
function streak(){let n=0,k=today();if(dayScore(k)<60)k=addDays(k,-1);while(dayScore(k)>=60){n++;k=addDays(k,-1);}return n;}
function habitStreak(id){let n=0,k=today();const has=x=>S.days[x]&&S.days[x].disc&&S.days[x].disc[id];if(!has(k))k=addDays(k,-1);while(has(k)){n++;k=addDays(k,-1);}return n;}
function bestStreak(id){
  const hit=Object.keys(S.days).filter(k=>S.days[k].disc&&S.days[k].disc[id]).sort();
  if(!hit.length)return 0;
  let best=1,cur=1;
  for(let i=1;i<hit.length;i++){cur=addDays(hit[i-1],1)===hit[i]?cur+1:1;if(cur>best)best=cur;}
  return best;
}
function rangeDates(n){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(today(),-i));return a;}
function avgRatio(dates){if(!dates.length)return 0;let s=0;dates.forEach(k=>s+=dayRatio(k));return s/dates.length;}
function avgScore(dates){if(!dates.length)return 0;let s=0;dates.forEach(k=>s+=dayScore(k));return s/dates.length;}
function habitPct(id,dates){if(!dates.length)return 0;let c=0;dates.forEach(k=>{if(S.days[k]&&S.days[k].disc&&S.days[k].disc[id])c++;});return c/dates.length;}
function discWeight(d){return Number(d.weight)||0;}
function totalWeight(){return S.disciplines.reduce((s,d)=>s+discWeight(d),0);}
function dayScore(k){
  // weighted score 0-100 for a given day
  const tw=totalWeight();if(!tw)return 0;
  const r=S.days[k];const disc=(r&&r.disc)||{};
  const earned=S.disciplines.reduce((s,d)=>s+(disc[d.id]?discWeight(d):0),0);
  return Math.round(earned/tw*100);
}
function scoreBreakdown(k){
  const r=S.days[k];const disc=(r&&r.disc)||{};
  return S.disciplines.slice().sort((a,b)=>discWeight(b)-discWeight(a)).map(d=>({
    id:d.id,label:d.label,weight:discWeight(d),done:!!disc[d.id]
  }));
}

// Monday-anchored week helpers
function weekStartOf(k){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);const off=(dt.getDay()+6)%7;return addDays(k,-off);}
function weekKey(k){return weekStartOf(k);} // key a week by its Monday
function weekDays(startK){const a=[];for(let i=0;i<7;i++)a.push(addDays(startK,i));return a;}
function weekLabel(startK){const end=addDays(startK,6);const s=startK.split('-'),e=end.split('-');return `${Number(s[1])}/${Number(s[2])} – ${Number(e[1])}/${Number(e[2])}`;}
function htTime(ts){const d=new Date(ts);const now=new Date();const sameDay=d.toDateString()===now.toDateString();const t=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return sameDay?('Today · '+t):d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+t;}

let _ringSeq=0;
function ring(pct,size,stroke,idSuffix){
  pct=Math.max(0,Math.min(1,Number(pct)||0));
  const r=(size/2)-stroke, C=2*Math.PI*r, off=C*(1-pct), c=size/2, gid='rg_'+(idSuffix||'x')+'_'+(++_ringSeq);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" stroke="var(--border)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${c}" cy="${c}" r="${r}" stroke="url(#${gid})" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${c} ${c})" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)"/>
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
  </svg>`;
}

function execData(){
  if(!S.exec)S.exec={tasks:{},projects:[]};
  if(!S.exec.tasks)S.exec.tasks={};
  if(!S.exec.projects)S.exec.projects=[];
  if(!S.exec.v2){
    const order=[...(S.exec.focusId?[S.exec.focusId]:[]),...(S.exec.nextOrder||[])];
    Object.values(S.exec.tasks).forEach(t=>{
      t.today=t.status==='current'||t.status==='next';
      if(t.status!=='completed')t.status='inbox';
    });
    S.exec.todayOrder=order;
    S.exec.v2=true;save();
  }
  if(!Array.isArray(S.exec.todayOrder))S.exec.todayOrder=[];
  return S.exec;
}
function taskProject(t){if(!t||!t.projectId)return null;return execData().projects.find(p=>p.id===t.projectId)||null;}
function openTasks(){return Object.values(execData().tasks).filter(t=>t.status!=='completed');}
function todayTasks(){
  const E=execData();
  const pos=id=>{const i=E.todayOrder.indexOf(id);return i===-1?1e9:i;};
  return openTasks().filter(t=>t.today).sort((a,b)=>pos(a.id)-pos(b.id)||a.ts-b.ts);
}
function laterTasks(){return openTasks().filter(t=>!t.today&&!t.projectId).sort((a,b)=>b.ts-a.ts);}
function doneToday(){
  const start=new Date();start.setHours(0,0,0,0);
  return Object.values(execData().tasks).filter(t=>t.status==='completed'&&t.completedAt>=start.getTime()).sort((a,b)=>b.completedAt-a.completedAt);
}
function projectTasks(pid){return Object.values(execData().tasks).filter(t=>t.projectId===pid);}
function projectProgress(pid){const ts=projectTasks(pid);const done=ts.filter(t=>t.status==='completed').length;return {done,total:ts.length,pct:ts.length?Math.round(done/ts.length*100):0};}
function openProjCount(){return Object.values(execData().tasks).filter(t=>t.projectId&&t.status!=='completed').length;}
function addTask(name,opts){
  opts=opts||{};
  const E=execData();
  const id='t'+Date.now()+Math.random().toString(36).slice(2,7);
  E.tasks[id]={id,name:name.trim(),projectId:opts.projectId||null,status:'inbox',today:!!opts.today,ts:Date.now(),completedAt:null};
  if(opts.today)E.todayOrder.push(id);
  return E.tasks[id];
}
function completeTask(id){
  const E=execData();const t=E.tasks[id];if(!t)return;
  t.status='completed';t.completedAt=Date.now();
  E.todayOrder=E.todayOrder.filter(x=>x!==id);
}
function uncompleteTask(id){const t=execData().tasks[id];if(!t)return;t.status='inbox';t.completedAt=null;}
function deleteTask(id){
  const E=execData();delete E.tasks[id];
  E.todayOrder=E.todayOrder.filter(x=>x!==id);
}
function setToday(id,on){
  const E=execData();const t=E.tasks[id];if(!t)return;
  t.today=!!on;
  E.todayOrder=E.todayOrder.filter(x=>x!==id);
  if(on)E.todayOrder.push(id);
}
const PROJ_COLORS=['var(--accent)','var(--accent-2)','var(--teal)','var(--gold)','var(--good)','var(--warn)'];
function execProjColor(pid){const E=execData();const i=E.projects.findIndex(p=>p.id===pid);return PROJ_COLORS[Math.max(0,i)%PROJ_COLORS.length];}

function etToast(msg,kind,undoFn){

function makeSortable(container,rowSel,onDrop){
  if(!container)return;
  let dragEl=null;
  container.querySelectorAll(rowSel).forEach(row=>{
    row.draggable=true;
    row.addEventListener('dragstart',e=>{dragEl=row;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','');}catch(_){}});
    row.addEventListener('dragend',()=>{
      row.classList.remove('dragging');
      const ids=[...container.querySelectorAll(rowSel)].map(r=>r.dataset.id);
      dragEl=null;onDrop(ids);
    });
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||dragEl===row)return;
      const r=row.getBoundingClientRect();
      const after=(e.clientY-r.top)/r.height>.5;
      container.insertBefore(dragEl,after?row.nextSibling:row);
    });
  });
}

function coData(){

  if(!S.coaching.v2){

        s.steps=(s.ai&&Array.isArray(s.ai.actions)?s.ai.actions:[]).map((t,i)=>({id:'st'+Date.now()+i,text:String(t),done:!!(s.aiDone&&s.aiDone[i])}));

function coExtractTakeaways(txt){
  const out=[];
  const lines=(txt||'').split(/\n/);
  // the high-level theme block comes first
  const hi=lines.findIndex(l=>/high-?level theme/i.test(l));
  if(hi>=0){
    let theme='';
    for(let i=hi+1;i<lines.length;i++){
      const t=lines[i].trim();
      if(!t){if(theme)break;continue;}
      if(/^\d+\./.test(t)||/^🔹/.test(t))break;
      theme+=(theme?' ':'')+t;
    }
    if(theme)out.push(theme);
  }
  // 📌 pinned lines
  lines.forEach(l=>{const t=l.trim();if(/^📌/.test(t)){const v=t.replace(/^📌\s*/,'').trim();if(v)out.push(v);}});
  // explicit takeaways section bullets
  const ki=lines.findIndex(l=>/key ?take ?aways|key points|main take ?aways/i.test(l));
  if(ki>=0){
    for(let i=ki+1;i<lines.length;i++){
      const t=lines[i].trim();
      if(!t)continue;
      if(/^[-•*]\s+/.test(t))out.push(t.replace(/^[-•*]\s+/,'').trim());
      else break;
    }
  }
  // fallback: numbered section titles
  if(!out.length){
    lines.forEach(l=>{const m=l.trim().match(/^\d+\.\s+(.{3,80})$/);if(m)out.push(m[1].trim());});
  }
  const seen=new Set();
  return out.filter(t=>{const k=t.toLowerCase();if(seen.has(k)||t.length<8)return false;seen.add(k);return true;}).slice(0,8);
}
async function pullFromFathom(s,attempt){
  attempt=attempt||0;
  if(!(s.link||'').trim()){coPull='Add the Fathom link first.';renderCoaching();return;}
  coPull=attempt?'Fathom is writing the notes… ('+attempt+')':'Pulling from Fathom…';renderCoaching();
  try{
    const r=await fetch('/api/pull?url='+encodeURIComponent(s.link.trim().split('?')[0]));
    let d={};try{d=await r.json();}catch(_){}
    if(d.pending){
      if(attempt<8){setTimeout(()=>{if(coSel===s.id)pullFromFathom(s,attempt+1);},12000);coPull='Fathom is writing the notes…';}
      else coPull=d.error;
      renderCoaching();return;
    }
    if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    const notes=(d.notes||'').trim();
    const actions=Array.isArray(d.actions)?d.actions.filter(x=>String(x).trim()):[];
    if(!notes&&!actions.length){coPull='Fathom has nothing for this link yet.';renderCoaching();return;}
    // a fresh pull replaces the previous pull, but never wipes with nothing
    if(notes){
      s.notes=notes;
      const tks=(Array.isArray(d.takeaways)&&d.takeaways.length)?d.takeaways.map(String):coExtractTakeaways(notes);
      const seen=new Set();
      s.takeaways=tks.filter(t=>{const k=t.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;}).map((t,i)=>({id:'tk'+Date.now()+i,text:t}));
    }
    if(actions.length)s.steps=actions.map((t,i)=>({id:'st'+Date.now()+i,text:String(t),done:false}));
    if((d.deep||'').trim())s.deep=d.deep.trim();
    save();coPull='Done. Notes updated.';renderCoaching();
  }catch(e){
    coPull='Pull failed: '+((e&&e.message)||'network error');renderCoaching();
  }
}

function mdInline(t){
  let h=esc(t);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/__([^_]+)__/g,'<b>$1</b>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
  h=h.replace(/`([^`]+)`/g,'<code class="mdc">$1</code>');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h;
}
function coNotesViewHtml(txt){
  return txt.split(/\n/).map(l=>{
    const t=l.trim();
    if(!t)return'';
    if(/^📌/.test(t))return `<div class="cnv-pin">${mdInline(t.replace(/^📌\s*/,''))}</div>`;
    if(/^#{1,2}\s/.test(t))return `<div class="cnv-h">${mdInline(t.replace(/^#+\s*/,''))}</div>`;
    if(/^#{3,5}\s/.test(t))return `<div class="cnv-sub">${mdInline(t.replace(/^#+\s*/,''))}</div>`;
    const chk=t.match(/^[-*]\s+\[([ xX])\]\s+(.*)/);
    if(chk)return `<div class="cnv-b"><span class="cnv-chk ${chk[1].trim()?'on':''}">${chk[1].trim()?'✓':''}</span><span class="${chk[1].trim()?'cnv-done':''}">${mdInline(chk[2])}</span></div>`;
    if(/^\d+\.\d+/.test(t))return `<div class="cnv-sub">${mdInline(t)}</div>`;
    const mNum=t.match(/^(\d+)\.\s+(.*)/);
    if(mNum){
      if(t.length<=60)return `<div class="cnv-h">${mdInline(t)}</div>`;
      return `<div class="cnv-b"><span class="cnv-num">${mNum[1]}</span><span>${mdInline(mNum[2])}</span></div>`;
    }
    if(/^>\s+/.test(t))return `<div class="cnv-pin">${mdInline(t.replace(/^>\s+/,''))}</div>`;
    if(/^[-—_]{3,}$/.test(t))return `<hr class="cnv-hr">`;
    if(/^[-•*]\s+/.test(t))return `<div class="cnv-b"><span class="cnv-dot"></span><span>${mdInline(t.replace(/^[-•*]\s+/,''))}</span></div>`;
    if(!/^[a-zA-Z0-9"'(<]/.test(t))return `<div class="cnv-h">${mdInline(t)}</div>`;
    if(t.length<60&&/[:：]$/.test(t))return `<div class="cnv-sub">${mdInline(t)}</div>`;
    return `<p class="cnv-p">${mdInline(t)}</p>`;
  }).join('');
}
function renderCoaching(){
  const C=coData();
  const list=C.sessions.filter(x=>(x.coach||'Seth')===coCoach).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(coSel&&!list.find(x=>x.id===coSel))coSel=null;
  if(!coSel&&list.length)coSel=list[0].id;
  const s=list.find(x=>x.id===coSel);
  main.innerHTML=`<div class="view">
    <div class="head">
      <div style="display:flex;align-items:center;gap:16px">
        <h2 class="sec">Coaching</h2>
        <div class="jr-tabs">
          ${['Seth','JJ'].map(c=>`<button class="jr-tab ${coCoach===c?'active':''}" data-cotab="${c}">${c}</button>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:8px">
        ${list.length?`<button class="btn" id="co-export">↓ ${esc(coCoach)} notes</button>`:''}
        <button class="btn solid" id="co-new">+ New session</button>
      </div>
    </div>
    <div class="grid g23">
      <div>${s?coDetailHTML(s):`<div class="card"><div class="empty">No ${esc(coCoach)} sessions yet.</div></div>`}</div>
      <div class="card co-list-card">
        <h3>${esc(coCoach)} sessions</h3>
        ${list.length?`<div class="note-list">${list.map(x=>`
          <button class="note-row ${x.id===coSel?'co-active':''}" data-sid="${x.id}">
            <span class="note-main">
              <span class="note-title">${esc(x.title||'Untitled')}</span>
              <span class="note-snip">${x.date?esc(longDate(x.date)):''}${(x.steps&&x.steps.length)?' · '+x.steps.filter(t=>!t.done).length+' steps open':''}</span>
            </span>
          </button>`).join('')}</div>`:'<div class="empty">None yet.</div>'}
      </div>
    </div>
  </div>`;

  main.querySelectorAll('[data-cotab]').forEach(b=>b.onclick=()=>{coCoach=b.dataset.cotab;coSel=null;coPull='';renderCoaching();});
  document.getElementById('co-new').onclick=()=>{
    const n={id:'s'+Date.now(),date:today(),coach:coCoach,title:'',link:'',notes:'',steps:[]};
    C.sessions.push(n);coSel=n.id;coPull='';save();renderCoaching();
  };
  const ex=document.getElementById('co-export');
  if(ex)ex.onclick=()=>exportCoaching(coCoach);
  main.querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>{coSel=b.dataset.sid;coPull='';coNotesEdit=false;coDeepOpen=false;renderCoaching();});
  if(!s)return;
  document.getElementById('co-date').onchange=e=>{s.date=e.target.value;save();renderCoaching();};
  const ti=document.getElementById('co-title');ti.oninput=()=>{s.title=ti.value;save();};
  ti.onblur=()=>renderCoaching();
  document.getElementById('co-del').onclick=()=>{
    if(!confirm('Delete this session?'))return;
    C.sessions=C.sessions.filter(x=>x.id!==s.id);coSel=null;save();renderCoaching();
  };
  const li=document.getElementById('co-link');
  li.oninput=()=>{s.link=li.value.trim();save();};
  li.onblur=()=>renderCoaching();
  document.getElementById('co-pull').onclick=()=>pullFromFathom(s);

  main.querySelectorAll('[data-step-check]').forEach(b=>b.onclick=()=>{
    const st=s.steps.find(x=>x.id===b.dataset.stepCheck);
    if(st){st.done=!st.done;save();renderCoaching();}
  });
  main.querySelectorAll('[data-step-del]').forEach(b=>b.onclick=()=>{
    s.steps=s.steps.filter(x=>x.id!==b.dataset.stepDel);save();renderCoaching();
  });
  const sa=document.getElementById('co-step-add');
  sa.onkeydown=e=>{
    if(e.key==='Enter'){
      const v=sa.value.trim();if(!v)return;
      s.steps.push({id:'st'+Date.now(),text:v,done:false});save();renderCoaching();
      const again=document.getElementById('co-step-add');if(again)again.focus();
    }
  };
  const tka=document.getElementById('co-tk-add');
  tka.onkeydown=e=>{
    if(e.key==='Enter'){
      const v=tka.value.trim();if(!v)return;
      s.takeaways.push({id:'tk'+Date.now(),text:v});save();renderCoaching();
      const again=document.getElementById('co-tk-add');if(again)again.focus();
    }
  };
  main.querySelectorAll('[data-tk-del]').forEach(b=>b.onclick=()=>{
    s.takeaways=s.takeaways.filter(x=>x.id!==b.dataset.tkDel);save();renderCoaching();
  });

  document.getElementById('co-notes-toggle').onclick=()=>{coNotesOpen=!coNotesOpen;renderCoaching();};
  const dt2=document.getElementById('co-deep-toggle');
  if(dt2)dt2.onclick=()=>{coDeepOpen=!coDeepOpen;renderCoaching();};
  const neb=document.getElementById('co-notes-editbtn');
  if(neb)neb.onclick=()=>{coNotesEdit=!coNotesEdit;renderCoaching();};
  const no=document.getElementById('co-notes');
  if(no){
    autosize(no);
    no.oninput=()=>{s.notes=no.value;save();flash('co-saved');autosize(no);};
  }
}

function coNotesDocHtml(txt){
  return txt.split(/\n/).map(l=>{
    const t=l.trim();
    if(!t)return '';
    if(/^[-•*]\s+/.test(t))return `<p class="bl">•&nbsp;&nbsp;${esc(t.replace(/^[-•*]\s+/,''))}</p>`;
    if(/^#{1,4}\s/.test(t))return `<p class="nh">${esc(t.replace(/^#+\s*/,''))}</p>`;
    if(t.length<70&&/[:：]$/.test(t))return `<p class="nh">${esc(t)}</p>`;
    return `<p>${esc(t)}</p>`;
  }).join('');
}

  const html=`<html><head><meta charset="utf-8"><title>Coaching Notes</title>

</style></head><body>
<div class="brand">MO OS</div>
<h1>Coaching with ${esc(coach)}</h1>
<div class="statline">${list.length} session${list.length===1?'':'s'} &nbsp;·&nbsp; ${openSteps} action step${openSteps===1?'':'s'} open &nbsp;·&nbsp; exported ${longDate(today())}</div>

${(s.notes||'').trim()?`<h3>Full notes</h3>${coNotesDocHtml(s.notes)}`:''}`).join('')}

  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='coaching-'+coach.toLowerCase()+'-'+today()+'.doc';

/* JOURNAL & NOTES */
let jrExpanded=null,noteQuery='',noteSel=null,jrTab='daily';
function goalLog(){if(!Array.isArray(S.goalLog))S.goalLog=[];return S.goalLog;}
function jrData(){if(!S.journal||typeof S.journal!=='object')S.journal={};return S.journal;}
function notesData(){if(!Array.isArray(S.notes))S.notes=[];return S.notes;}
function jrBase(k){return k.split('#')[0];}
function jrActiveKey(){
  const tk=today();
  const keys=Object.keys(jrData()).filter(k=>jrBase(k)===tk&&!jrData()[k].done).sort();
  return keys.length?keys[keys.length-1]:null;
}
function jrNewKey(){
  const tk=today();
  let k=tk,n=1;
  while(jrData()[k])k=tk+'#'+(++n);
  return k;
}
function jrEntryKeys(){
  const active=jrActiveKey();
  return Object.keys(jrData()).filter(k=>k!==active&&((jrData()[k]||{}).text||'').trim()).sort((a,b)=>b.localeCompare(a));
}
function noteIcon(n){
  try{if(/^\p{Extended_Pictographic}/u.test((n.title||'').trim()))return '';}catch(e){}
  const t=((n.title||'')+' '+(n.body||'').slice(0,80)).toLowerCase();
  const map=[[/money|sale|close|revenue|pay|cc\b/,'💰'],[/idea|insight/,'💡'],[/call|phone/,'📞'],[/gym|lift|workout|body|bulk/,'🏋️'],[/girl|date|love/,'❤️'],[/plan|goal|vision/,'🎯'],[/script|write|copy/,'📝'],[/book|read/,'📚'],[/ai|gpt|claude|poppy/,'🤖'],[/food|eat|meal/,'🍽️'],[/trip|travel|flight|spain|dubai/,'✈️']];
  for(const [re,ic] of map)if(re.test(t))return ic;
  const set=['🗒️','🧠','⚡','🌙','🔥','🧭','🌊','🪨'];
  let h=0;for(const c of String(n.id||''))h=(h*31+c.charCodeAt(0))>>>0;
  return set[h%set.length];
}
function noteSnippet(n){const b=(n.body||'').trim().replace(/\s+/g,' ');return b?clip(b,64):'No content yet';}
function noteTime(ts){const d=new Date(ts||Date.now());return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function sortedNotes(){
  const q=noteQuery.trim().toLowerCase();
  let arr=notesData().slice();
  if(q)arr=arr.filter(n=>((n.title||'')+' '+(n.body||'')).toLowerCase().includes(q));
  return arr.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updated||0)-(a.updated||0));
}
function renderJournal(){
  const J=jrData(),tk=today();
  const activeK=jrActiveKey();
  const entry=activeK?J[activeK]:{text:'',title:''};
  const words=(entry.text||'').trim()?entry.text.trim().split(/\s+/).length:0;
  const past=jrEntryKeys();
  const notes=sortedNotes();
  const g=S.goals||{};

  const niceDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});};
  const writePane=`
    <button class="jr-write-cta" id="jr-open-writer">
      <span class="jwc-cap">Today</span>
      <span class="jwc-date">${activeK?(entry.title?esc(entry.title):longDate(tk)):'Start a new entry'}</span>
      <span class="jwc-hint">${activeK?(words?words+' words · keep going →':'start writing →'):'open the page →'}</span>
    </button>
    <div class="sect" style="margin-top:26px">
      <div class="sect-head">Past entries <span>${past.length||''}</span>
        <span style="flex:1"></span>
        <button class="btn btn-sm" id="jr-dl">↓ Download all</button>
      </div>
      ${past.length?(()=>{
        const groups=[];let cur=null;
        past.forEach(k=>{
          const [y,m]=jrBase(k).split('-');
          const gk=y+'-'+m;
          if(!cur||cur.gk!==gk){cur={gk,label:new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}),items:[]};groups.push(cur);}
          cur.items.push(k);
        });
        return groups.map((g,gi)=>`
          <div class="jr-month" ${gi===0?'style="margin-top:4px"':''}>${g.label}</div>
          <div class="jr-cards">${g.items.map(k=>{
            const e=J[k];
            const [y,m,d]=jrBase(k).split('-').map(Number);
            const day=new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
            const title=e.title||clip((e.text||'').replace(/^#+\s*/gm,'').trim().split('\n')[0],42)||'Untitled';
            return `<button class="jr-card" data-open-day="${k}">
              <span class="jr-card-top"><span class="jr-card-title">${esc(title)}</span><span class="jr-card-day">${day}</span></span>
            </button>`;
          }).join('')}</div>`).join('');
      })():'<div class="empty sect-empty">No entries yet.</div>'}
    </div>`;

  const GL=goalsList();
  const feat=featuredGoal();
  const activeGoals=GL.filter(x=>!x.done),doneGoals=GL.filter(x=>x.done);
  const goalCard=gl=>{
    const gcd=goalDays(gl),gpct=goalPct(gl);
    return `<div class="card gl-card ${gl.done?'done':''}" data-gid="${gl.id}">
      <div class="gl-card-top">
        <input class="gl-label-in" data-glabel="${gl.id}" value="${esc(gl.label||'')}" placeholder="Goal name" spellcheck="false">
        <div class="gl-card-acts">
          ${!gl.done&&feat&&gl.id!==feat.id?`<button class="et-lblbtn" data-gfeat="${gl.id}" title="Show this one in Morning">★ Feature</button>`:''}
          ${feat&&gl.id===feat.id?'<span class="et-status-tag focus">featured</span>':''}
          <button class="et-lblbtn ${gl.done?'on':''}" data-gdone="${gl.id}">${gl.done?'Reopen':'Done'}</button>
          <button class="rm" data-gdel="${gl.id}">×</button>
        </div>
      </div>
      <textarea class="write gl-text-in" data-gtext="${gl.id}" rows="1" placeholder="What's the goal?">${esc(gl.text||'')}</textarea>
      <div class="gl-meta-row">
        <label class="mo-goal-date">Target <input type="date" data-gdate="${gl.id}" value="${esc(gl.targetDate||'')}"></label>
        ${gcd!==null?`<span class="gl-countdown">${gcd>=0?`<b>${gcd}</b> days left`:`<b>${-gcd}</b> days past`}</span>`:''}
        ${gpct!==null?`<div class="mo-goal-track" style="flex:1;max-width:160px"><div class="mo-goal-fill" style="width:${gpct}%"></div></div>`:''}
      </div>
    </div>`;
  };
  const log=goalLog().slice().sort((a,b)=>b.ts-a.ts);
  const goalsPane=`
    <div class="sect">
      <div class="sect-head">Goals <span>${activeGoals.length||''}</span></div>
      ${activeGoals.map(goalCard).join('')}
      <div class="addrow ghost-add"><input id="gl-new" placeholder="+ New goal"></div>
      ${doneGoals.length?`<div class="sect-head" style="margin-top:20px">Done <span>${doneGoals.length}</span></div>${doneGoals.map(goalCard).join('')}`:''}
    </div>
    <div class="sect">
      <div class="sect-head">Goal journal</div>
      <div class="gl-compose">
        <textarea id="gl-entry" class="jr-surface" style="min-height:64px" placeholder="Add an update"></textarea>
        <button class="btn solid btn-sm" id="gl-entry-add">Log</button>
      </div>
      ${log.length?`<div class="gl-timeline">${log.map(e=>`
        <div class="gl-log" data-id="${e.id}">
          <div class="gl-log-head"><span class="gl-log-date">${longDate(keyOf(new Date(e.ts)))}</span><button class="rm gl-log-del" data-id="${e.id}">×</button></div>
          <div class="gl-log-text">${esc(e.text)}</div>
        </div>`).join('')}</div>`:''}
    </div>`;

  const notesPane=`
    <div class="sect">
      <div class="sect-head">Notes <span>${notesData().length||''}</span>
        <span style="flex:1"></span>
        <button class="btn btn-sm" id="notes-dl">↓ Download</button>
        <button class="btn solid btn-sm" id="note-new">+ New</button>
      </div>
      <input id="note-search" class="inp note-search" placeholder="Search notes" value="${esc(noteQuery)}" autocomplete="off">
      ${notes.length?`<div class="note-grid">${notes.map(n=>`
        <button class="note-card" data-id="${n.id}">
          <span class="note-card-top">
            <span class="note-card-ico">${noteIcon(n)}</span>
            <span class="note-pin ${n.pinned?'on':''}" data-pin="${n.id}">${n.pinned?'★':'☆'}</span>
          </span>
          <span class="note-title">${esc(n.title||'Untitled')}</span>
          <span class="note-card-date">${new Date(n.updated||n.created||Date.now()).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>
        </button>`).join('')}</div>`
      :`<div class="empty sect-empty" style="margin-top:12px">${noteQuery?'No matches.':'No notes yet.'}</div>`}
    </div>`;

  main.innerHTML=`<div class="view">
    <div class="head">
      <div><h2 class="sec">Journal</h2></div>
      <div class="jr-tabs">
        ${[['daily','Write'],['goals','Goals'],['notes','Notes']].map(([k,l])=>`<button class="jr-tab ${jrTab===k?'active':''}" data-t="${k}">${l}</button>`).join('')}
      </div>
    </div>
    ${jrTab==='goals'?goalsPane:jrTab==='notes'?notesPane:writePane}
  </div>`;

  main.querySelectorAll('.jr-tab').forEach(b=>b.onclick=()=>{jrTab=b.dataset.t;renderJournal();});

  // write tab
  const cta=document.getElementById('jr-open-writer');
  if(cta)cta.onclick=()=>openWriter(activeK||jrNewKey());
  main.querySelectorAll('[data-open-day]').forEach(b=>b.onclick=()=>openWriter(b.dataset.openDay));
  const jd=document.getElementById('jr-dl');
  if(jd)jd.onclick=exportJournals;
  const nd=document.getElementById('notes-dl');
  if(nd)nd.onclick=exportNotes;

  // goals tab
  const glNew=document.getElementById('gl-new');
  if(glNew)glNew.onkeydown=e=>{
    if(e.key==='Enter'){
      const v=glNew.value.trim();if(!v)return;
      goalsList().push({id:'g'+Date.now(),label:'Goal',text:v,targetDate:'',setAt:'',done:false});
      save();renderJournal();topbar();
      const again=document.getElementById('gl-new');if(again)again.focus();
    }
  };
  const glFind=id=>goalsList().find(x=>x.id===id);
  main.querySelectorAll('[data-glabel]').forEach(inp=>inp.oninput=()=>{const gl=glFind(inp.dataset.glabel);if(gl){gl.label=inp.value;save();topbar();}});
  main.querySelectorAll('[data-gtext]').forEach(ta=>{
    autosize(ta);
    ta.oninput=()=>{const gl=glFind(ta.dataset.gtext);if(gl){gl.text=ta.value;save();autosize(ta);topbar();}};
  });
  main.querySelectorAll('[data-gdate]').forEach(inp=>inp.onchange=()=>{
    const gl=glFind(inp.dataset.gdate);if(gl){gl.targetDate=inp.value;gl.setAt=today();save();renderJournal();topbar();}
  });
  main.querySelectorAll('[data-gfeat]').forEach(b=>b.onclick=()=>{
    const L=goalsList();const i=L.findIndex(x=>x.id===b.dataset.gfeat);
    if(i>0){const [gl]=L.splice(i,1);L.unshift(gl);save();renderJournal();topbar();}
  });
  main.querySelectorAll('[data-gdone]').forEach(b=>b.onclick=()=>{
    const gl=glFind(b.dataset.gdone);if(gl){gl.done=!gl.done;save();renderJournal();topbar();}
  });
  main.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this goal?'))return;
    S.goalsList=goalsList().filter(x=>x.id!==b.dataset.gdel);save();renderJournal();topbar();
  });
  const glEntry=document.getElementById('gl-entry'),glAdd=document.getElementById('gl-entry-add');
  if(glEntry&&glAdd){
    autosize(glEntry);glEntry.oninput=()=>autosize(glEntry);
    glAdd.onclick=()=>{const v=glEntry.value.trim();if(!v)return;goalLog().push({id:'gl'+Date.now(),ts:Date.now(),text:v});save();renderJournal();};
  }
  main.querySelectorAll('.gl-log-del').forEach(b=>b.onclick=()=>{S.goalLog=goalLog().filter(x=>x.id!==b.dataset.id);save();renderJournal();});

  // notes tab
  const search=document.getElementById('note-search');
  if(search)search.oninput=()=>{
    noteQuery=search.value;
    const pos=search.selectionStart;renderJournal();
    const s2=document.getElementById('note-search');if(s2){s2.focus();s2.setSelectionRange(pos,pos);}
  };
  const nn=document.getElementById('note-new');
  if(nn)nn.onclick=()=>{
    const n={id:'n'+Date.now(),title:'',body:'',pinned:false,created:Date.now(),updated:Date.now()};
    notesData().unshift(n);save();openNote(n.id);
  };
  main.querySelectorAll('.note-card').forEach(r=>r.onclick=e=>{
    if(e.target.closest('[data-pin]'))return;
    openNote(r.dataset.id);
  });
  main.querySelectorAll('[data-pin]').forEach(p=>p.onclick=e=>{
    e.stopPropagation();
    const n=notesData().find(x=>x.id===p.dataset.pin);
    if(n){n.pinned=!n.pinned;save();renderJournal();}
  });
}

/* EXPORTS */
function fullDate(k){const [y,m,d]=jrBase(k).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});}
function docShell(title,body){return `<html><head><meta charset="utf-8"><title>${esc(title)}</title>
<style>body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;max-width:660px;margin:44px auto;color:#1a1a1a;line-height:1.6;font-size:14px;padding:0 20px}
.brand{font-size:11px;letter-spacing:4px;color:#ff7a47;font-weight:bold;text-transform:uppercase}
h1{font-size:32px;margin:6px 0 4px;letter-spacing:-1px}
.meta{color:#888;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:0 0 14px}
h2{font-size:20px;margin:0 0 2px}
.hr{border:none;border-top:1px solid #e8e8e8;margin:36px 0}
pre{white-space:pre-wrap;font-family:inherit;font-size:14.5px;margin:0;line-height:1.7}</style></head><body>${body}</body></html>`;}
function dlDoc(name,html){
  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);}
function jrEntryDocHtml(k){
  const e=jrData()[k];
  return `<h2>${esc(e.title||'Untitled')}</h2><div class="meta">${fullDate(k)}</div><pre>${esc((e.text||'').trim())}</pre>`;
}
function jrAllKeys(){return Object.keys(jrData()).filter(k=>((jrData()[k]||{}).text||'').trim()).sort();}
function exportJournals(){
  const keys=jrAllKeys();if(!keys.length)return;
  const body=`<div class="brand">MO OS</div><h1>Journal</h1><div class="meta">${keys.length} entries · exported ${fullDate(today())}</div>`+
    keys.map((k,i)=>(i?'<hr class="hr">':'<div style="margin-top:28px"></div>')+jrEntryDocHtml(k)).join('');
  dlDoc('journal-'+today()+'.doc',docShell('Journal',body));
}
function exportJournalOne(k){
  const e=jrData()[k];if(!e)return;
  dlDoc('journal-'+jrBase(k)+(e.title?'-'+slug(e.title):'')+'.doc',
    docShell(e.title||'Journal entry','<div class="brand">MO OS</div><div style="margin-top:22px"></div>'+jrEntryDocHtml(k)));
}
function noteDocHtml(n){
  return `<h2>${esc(n.title||'Untitled')}</h2><div class="meta">${new Date(n.updated||n.created||Date.now()).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div><pre>${esc((n.body||'').trim())}</pre>`;
}
function exportNotes(){
  const ns=notesData().filter(n=>(n.title||'').trim()||(n.body||'').trim());if(!ns.length)return;
  const body=`<div class="brand">MO OS</div><h1>Notes</h1><div class="meta">${ns.length} notes · exported ${fullDate(today())}</div>`+
    ns.map((n,i)=>(i?'<hr class="hr">':'<div style="margin-top:28px"></div>')+noteDocHtml(n)).join('');
  dlDoc('notes-'+today()+'.doc',docShell('Notes',body));
}
function exportNoteOne(id){
  const n=notesData().find(x=>x.id===id);if(!n)return;
  dlDoc('note-'+(slug(n.title)||id)+'.doc',docShell(n.title||'Note','<div class="brand">MO OS</div><div style="margin-top:22px"></div>'+noteDocHtml(n)));
}

function openWriter(k){
  const old=document.getElementById('writer-modal');if(old)old.remove();
  const J=jrData();
  const el=document.createElement('div');
  el.id='writer-modal';
  el.innerHTML=`
    <div class="wr-amb">${[1,2,3,4,5,6].map(i=>`<span class="wr-ember e${i}"></span>`).join('')}</div>
    <div class="wr-halo"></div>
    <div class="wr-chrome">
      <span class="wr-count" id="wr-count"></span>
      <button class="wr-icon" id="wr-copy" title="Copy this entry">⧉</button>
      <button class="wr-icon" id="wr-dl" title="Download this entry">↓</button>
      <button class="btn solid" id="wr-done" title="Finish this entry">Finish</button>
      <button class="wr-icon wr-x" id="wr-leave" title="Save and come back later">×</button>
    </div>
    <div class="wr-stage">
      <div class="wr-label">Journal</div>
      <div class="wr-page">
        <div class="wr-page-date">${(()=>{const [y,m,d]=jrBase(k).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});})()}</div>
        <input id="wr-title" class="wr-title" placeholder="Title" value="${esc((J[k]&&J[k].title)||'')}" spellcheck="false" autocomplete="off">
        <div class="wr-rule"></div>
        <textarea id="wr-ta">${esc((J[k]&&J[k].text)||'')}</textarea>
      </div>
    </div>`;
  document.body.appendChild(el);
  const ta=el.querySelector('#wr-ta');
  const ti=el.querySelector('#wr-title');
  const count=el.querySelector('#wr-count');
  const ensure=()=>{if(!J[k])J[k]={text:'',title:'',ts:Date.now()};return J[k];};
  const caretY=()=>{
    let mir=document.getElementById('wr-mirror');
    if(!mir){mir=document.createElement('div');mir.id='wr-mirror';document.body.appendChild(mir);}
    const cs=getComputedStyle(ta);
    ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textTransform','padding'].forEach(p=>mir.style[p]=cs[p]);
    Object.assign(mir.style,{position:'absolute',visibility:'hidden',whiteSpace:'pre-wrap',wordWrap:'break-word',left:'-9999px',top:'0',width:ta.clientWidth+'px',boxSizing:'border-box'});
    mir.textContent=ta.value.slice(0,ta.selectionStart);
    const mk=document.createElement('span');mk.textContent='​';mir.appendChild(mk);
    return mk.offsetTop;
  };
  const follow=()=>{
    const caretVP=ta.getBoundingClientRect().top+caretY();
    const lo=window.innerHeight*0.22, hi=window.innerHeight*0.72;
    if(caretVP>hi||caretVP<lo)el.scrollTop+=caretVP-window.innerHeight*0.45;
  };
  const upd=()=>{const w=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;count.textContent=w?w+' words':'';ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';};
  upd();
  ti.oninput=()=>{const e=ensure();e.title=ti.value;e.ts=Date.now();save();};
  ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ta.focus();}};
  ta.oninput=()=>{
    const e=ensure();
    e.text=ta.value;e.ts=Date.now();
    save();upd();follow();
  };
  ta.onkeyup=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))follow();};
  ta.onclick=follow;
  const close=()=>{
    document.removeEventListener('keydown',wrEsc);
    el.remove();
    if(currentView==='journal')renderJournal();
  };
  function wrEsc(e){if(e.key==='Escape')close();}
  el.querySelector('#wr-done').onclick=()=>{
    const e=J[k];
    if(e&&(e.text||'').trim()){e.done=true;save();}
    close();
  };
  el.querySelector('#wr-leave').onclick=close;
  el.querySelector('#wr-dl').onclick=()=>exportJournalOne(k);
  el.querySelector('#wr-copy').onclick=async()=>{
    const e=J[k]||{};
    const txt=(e.title?e.title+'\n':'')+fullDate(k)+'\n\n'+(e.text||'').trim();
    try{await navigator.clipboard.writeText(txt);const b=el.querySelector('#wr-copy');b.textContent='✓';setTimeout(()=>b.textContent='⧉',1200);}catch(_){}
  };
  document.addEventListener('keydown',wrEsc);
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);
}

  }

  el.querySelector('#ne-del').onclick=()=>{

    S.notes=notesData().filter(x=>x.id!==id);save();close();
  };
  el.querySelector('#ne-dl').onclick=()=>exportNoteOne(id);
  if(isEdit){if(!n.title)ti.focus();else if(bo)bo.focus();}
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){const m=document.getElementById('note-edit-modal');if(m){m.remove();if(currentView==='journal')renderJournal();}document.removeEventListener('keydown',esc);}
  });
}

  const render=()=>{
    const items=S.headTrash.slice().reverse();
    const list=items.length
      ? `<div class="ht-list">${items.map(h=>{
          if(h.id===invertingId){
            return `<div class="ht-item inverting" data-id="${h.id}">
              <div class="ht-invert">
                <div class="hti-original"><span class="hti-strike">${esc(h.text)}</span></div>
                <div class="hti-arrow">↓ flip it into who you're becoming</div>

            <div class="ht-actions">
              <button class="ht-flip" data-id="${h.id}">Invert →</button>
              <button class="rm ht-del" data-id="${h.id}">×</button>
            </div>
          </div>`;
        }).join('')}</div>`
      : `<div class="empty" style="padding:30px 0;text-align:center">Nothing here yet.</div>`;
    modal.innerHTML=`
      <div class="nm-backdrop"></div>
      <div class="nm-panel ht-panel">
        <div class="nm-head">
          <div class="nm-title">Head trash<span class="nm-sub">Dump it now. Invert it when you're ready.</span></div>
          <div class="nm-actions"><button class="btn nm-close">Close</button></div>
        </div>
        <div class="ht-add">
          <input id="ht-input" placeholder="What's the thought? Write it the moment it hits…" autocomplete="off">
          <button class="btn solid" id="ht-add-btn">Dump</button>

        <div class="ht-scroll">${list}</div>

  const wire=()=>{
    const htInput=modal.querySelector('#ht-input'),htBtn=modal.querySelector('#ht-add-btn');
    const add=()=>{const v=htInput.value.trim();if(!v)return;S.headTrash.push({id:'h'+Date.now(),text:v,ts:Date.now()});save();invertingId=null;render();const i=modal.querySelector('#ht-input');if(i)i.focus();};
    htBtn.onclick=add;htInput.onkeydown=e=>{if(e.key==='Enter')add();};
    modal.querySelectorAll('.ht-del').forEach(b=>b.onclick=()=>{S.headTrash=S.headTrash.filter(x=>x.id!==b.dataset.id);save();render();});
    modal.querySelectorAll('.ht-flip').forEach(b=>b.onclick=()=>{invertingId=b.dataset.id;render();const ta=modal.querySelector('#hti-input');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}});
    const cancel=modal.querySelector('.hti-cancel');if(cancel)cancel.onclick=()=>{invertingId=null;render();};
    const saveBtn=modal.querySelector('.hti-save');
    if(saveBtn)saveBtn.onclick=()=>{
      const ta=modal.querySelector('#hti-input');const v=(ta?ta.value:'').trim();if(!v)return;

      S.headTrash=S.headTrash.filter(x=>x.id!==invertingId);
      invertingId=null;save();render();
    };
    const ta=modal.querySelector('#hti-input');if(ta)ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();if(saveBtn)saveBtn.click();}};
    const close=()=>{modal.remove();if(currentView==='morning')renderMorning();};
    modal.querySelector('.nm-close').onclick=close;
    modal.querySelector('.nm-backdrop').onclick=close;
  };
  document.body.appendChild(modal);
  render();
  const first=modal.querySelector('#ht-input');if(first)first.focus();
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){const m=document.getElementById('ht-modal');if(m){m.remove();if(currentView==='morning')renderMorning();}document.removeEventListener('keydown',esc);}});
}
// Smart-ish starter for an inversion: strips common negative openers and gives a present-tense scaffold
function invertSuggest(text){
  let t=(text||'').trim().replace(/\.$/,'');
  const low=t.toLowerCase();
  const map=[
    [/^i (can'?t|cannot|could ?n'?t)\b/i,'I can'],
    [/^i'?m not\b/i,'I am'],
    [/^i am not\b/i,'I am'],
    [/^i don'?t\b/i,'I do'],
    [/^i'?m (afraid|scared|nervous|worried) (of|about|to)\b/i,'I am confident about'],
    [/^i (hate|dread)\b/i,'I love']
  ];
  for(const [re,rep] of map){ if(re.test(t)){ return t.replace(re,rep); } }
  // fallback: leave blank so he writes it fresh, but nudge with the frame
  return '';
}
function moData(){if(!S.morning)S.morning=structuredClone(DEFAULT.morning);const m=S.morning;
  m.vision=m.vision||[];
  ['affirmations','kickstarters','reminders'].forEach(key=>{
    m[key]=(m[key]||[]).map(item=>typeof item==='object'&&item?item:{id:key+'_'+Math.random().toString(36).slice(2,9),text:String(item)});
  });
  return m;}

/* SLIDESHOW (vision mode + morning flow) */
let slideDeck=[],slideIdx=0,slideTimer=null;
const MO_LIST_META={
  affirmations:{label:'Affirmation',color:'255,122,71'},
  kickstarters:{label:'Kickstarter',color:'45,212,191'},
  reminders:{label:'Reminder',color:'251,191,36'}
};
function visionSlides(){return moData().vision.map(v=>({img:v.img||null,text:v.text||'',label:'Vision',color:'255,122,71'}));}
function listSlides(key){
  const meta=MO_LIST_META[key];
  return moData()[key].map(it=>({img:null,text:it.text||'',label:meta.label,color:meta.color}));
}
function flowSlides(){
  return [...visionSlides(),...listSlides('affirmations'),...listSlides('kickstarters'),...listSlides('reminders')];
}
function openSlides(slides,i){
  if(!slides||!slides.length)return;
  slideDeck=slides;slideIdx=Math.max(0,Math.min(i||0,slides.length-1));
  const old=document.getElementById('vision-modal');if(old)old.remove();
  const el=document.createElement('div');
  el.id='vision-modal';
  el.innerHTML=`
    <div class="vm-stage"></div>
    <div class="vm-scrim"></div>
    <div class="vm-cap"></div>
    <div class="vm-goal"></div>
    <button class="vm-x" title="Close">×</button>
    <button class="vm-nav vm-prev">‹</button>
    <button class="vm-nav vm-next">›</button>
    <div class="vm-dots"></div>`;
  document.body.appendChild(el);
  try{if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}
  el.querySelector('.vm-x').onclick=closeVision;
  el.querySelector('.vm-prev').onclick=e=>{e.stopPropagation();slideGo(-1);};
  el.querySelector('.vm-next').onclick=e=>{e.stopPropagation();slideGo(1);};
  el.querySelector('.vm-stage').onclick=()=>slideGo(1);
  document.addEventListener('keydown',vmKeys);
  slideShow();
}
function vmKeys(e){
  if(e.key==='Escape')closeVision();
  if(e.key==='ArrowRight'||e.key===' ')slideGo(1);
  if(e.key==='ArrowLeft')slideGo(-1);
}
function slideGo(d){if(!slideDeck.length){closeVision();return;}slideIdx=(slideIdx+d+slideDeck.length)%slideDeck.length;slideShow();}
function slideShow(){
  const el=document.getElementById('vision-modal');if(!el)return;
  const s=slideDeck[slideIdx];if(!s){closeVision();return;}
  const stage=el.querySelector('.vm-stage');
  const cap=el.querySelector('.vm-cap');
  let dwell=8000;
  if(s.img){
    stage.innerHTML=`<img src="${esc(s.img)}" class="vm-bg" alt="" draggable="false"><img src="${esc(s.img)}" class="vm-img kb${slideIdx%2}" alt="" draggable="false">`;
    cap.style.animation='none';void cap.offsetWidth;cap.style.animation='';
    cap.textContent=s.text||'';
  }else{
    const words=(s.text||'').split(/\s+/).filter(Boolean);
    stage.innerHTML=`<div class="vm-textslide" style="--sc:${s.color}">
      <span class="vm-slide-label">${esc(s.label)}</span>
      <div class="vm-words">${words.map((w,i)=>`<span style="animation-delay:${120+i*80}ms">${esc(w)}</span>`).join(' ')}</div>
    </div>`;
    cap.textContent='';
    dwell=Math.min(14000,Math.max(5200,2800+words.length*380));
  }
  const fg=featuredGoal();
  const cd=goalDays(fg);
  el.querySelector('.vm-goal').textContent=fg?(fg.text+(cd!==null&&cd>=0?' · '+cd+' days':'')):'';
  el.querySelector('.vm-dots').innerHTML=slideDeck.map((x,i)=>`<span class="${i===slideIdx?'on':''}"></span>`).join('');
  const nxt=slideDeck[(slideIdx+1)%slideDeck.length];
  if(nxt&&nxt.img){const im=new Image();im.src=nxt.img;}
  clearTimeout(slideTimer);
  slideTimer=setTimeout(()=>slideGo(1),dwell);
}
function closeVision(){
  clearTimeout(slideTimer);slideTimer=null;
  document.removeEventListener('keydown',vmKeys);
  const el=document.getElementById('vision-modal');if(el)el.remove();
  if(document.fullscreenElement){try{document.exitFullscreen().catch(()=>{});}catch(e){}}
}

      ${moEdit?`<div class="addrow" style="margin-top:16px"><input id="mo-vtext" placeholder="Caption / the dream in words"><input id="mo-vimg" placeholder="Image URL (optional)" style="flex:1.2"><button class="btn solid" id="mo-vadd">Add tile</button></div>`:''}
    </div>

    <div class="grid g2" style="margin-bottom:16px">
      ${moListCard('Affirmations','affirmations','','var(--accent)')}
      ${moListCard('Kickstarters','kickstarters','','var(--teal)')}
    </div>

    <div class="card">
      ${moListBody('Reminders for life','reminders','','var(--gold)')}
    </div>

    <div class="card headtrash-launch" id="ht-open">
      <div class="htl-left">
        <div class="htl-icon"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M6 6l1 14a1 1 0 001 1h8a1 1 0 001-1l1-14"/></svg></div>
        <div>
          <div class="htl-title">Head trash</div>
          <div class="htl-sub">${(S.headTrash&&S.headTrash.length)?S.headTrash.length+' captured':'Dump a negative thought, invert it later'}</div>
        </div>
      </div>
      <span class="htl-open">Open →</span>
    </div>
  </div>`;

  document.getElementById('ht-open').onclick=()=>openHeadTrash();
  document.getElementById('mo-edit').onclick=()=>{moEdit=!moEdit;renderMorning();};
  document.getElementById('mo-start').onclick=()=>{currentView='tasks';setActiveNav('tasks');render();};

  if(moEdit){
    const vadd=document.getElementById('mo-vadd');
    if(vadd)vadd.onclick=()=>{
      const t=document.getElementById('mo-vtext').value.trim();
      const img=document.getElementById('mo-vimg').value.trim();
      if(!t&&!img)return;
      m.vision.push({id:'v'+Date.now(),text:t,img});save();renderMorning();
    };
  }
  // wire each editable list
  ['affirmations','kickstarters','reminders'].forEach(key=>moWireList(key));
  // vision tile edits/deletes
  main.querySelectorAll('.vcard').forEach(card=>{
    const id=card.dataset.id;const item=m.vision.find(x=>x.id===id);if(!item)return;
    const del=card.querySelector('.vdel');if(del)del.onclick=()=>{m.vision=m.vision.filter(x=>x.id!==id);save();renderMorning();};
    const cap=card.querySelector('.vcap-edit');if(cap)cap.oninput=()=>{item.text=cap.value;save();};
    if(!moEdit){card.style.cursor='zoom-in';card.onclick=()=>openSlides(visionSlides(),m.vision.indexOf(item));}
  });
  const vplay=document.getElementById('mo-vision-play');
  if(vplay)vplay.onclick=()=>openSlides(visionSlides(),0);
  const mus=document.getElementById('mo-music');
  if(mus)mus.onclick=()=>toggleMusic();
  const flow=document.getElementById('mo-flow');
  if(flow)flow.onclick=()=>openSlides(flowSlides(),0);
  main.querySelectorAll('[data-playlist]').forEach(b=>b.onclick=()=>openSlides(listSlides(b.dataset.playlist),0));
  const vb=main.querySelector('.vboard');
  if(vb)makeSortable(vb,'.vcard',ids=>{
    m.vision.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save();
  });
}
function moVisionCard(v){
  const hasImg=!!v.img;
  return `<div class="vcard" data-id="${v.id}">
    ${hasImg?`<div class="vimg-wrap">
        <img src="${esc(v.img)}" alt="" loading="lazy" onerror="handleVisionImgError(this)">
        <div class="vscrim"></div>
        ${!moEdit&&v.text?`<div class="vcap-over">${esc(v.text)}</div>`:''}
      </div>`:`<div class="vimg noimg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>${!moEdit&&v.text?`<div class="vcap">${esc(v.text)}</div>`:''}</div>`}
    ${moEdit?`<textarea class="vcap-edit" rows="2" placeholder="Caption">${esc(v.text||'')}</textarea><button class="rm vdel" title="Remove">×</button>`:''}
  </div>`;
}
function handleVisionImgError(img){
  const wrap=img.closest('.vimg-wrap');if(!wrap)return;
  wrap.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><span>Image link didn\'t load — check the URL</span>';
  wrap.classList.remove('vimg-wrap');wrap.classList.add('vimg','broken');
}
function moListCard(title,key,sub,accent){
  return `<div class="card">${moListBody(title,key,sub,accent)}</div>`;
}
function moListBody(title,key,sub,accent){
  const m=moData();const arr=m[key];
  return `<h3>${title}${sub?` <span class="h3sub">${sub}</span>`:''}${(!moEdit&&arr.length&&MO_LIST_META[key])?` <button class="btn btn-sm" data-playlist="${key}">▶ Play</button>`:''}</h3>
    <div class="mo-list" data-key="${key}">
      ${arr.length?arr.map(item=>{
        const id=typeof item==='object'?item.id:key+arr.indexOf(item);
        const text=typeof item==='object'?item.text:item;
        return `<div class="mo-line" data-id="${esc(String(id))}" style="--dot:${accent}">
          <span class="drag-grip">⠿</span>
          <span class="mo-dot"></span>
          ${moEdit?`<textarea class="mo-edit-line" rows="1">${esc(text)}</textarea><button class="rm mo-del">×</button>`:`<span class="mo-text">${esc(text)}</span>`}
        </div>`;
      }).join(''):`<div class="empty">${moEdit?'Add your first one below.':'Nothing here yet.'}</div>`}
    </div>
    ${moEdit?`<div class="addrow"><input class="mo-add-input" data-key="${key}" placeholder="Add to ${title.toLowerCase()}"><button class="btn mo-add-btn" data-key="${key}">Add</button></div>`:''}`;
}
function moWireList(key){
  const m=moData();
  const wrap=main.querySelector(`.mo-list[data-key="${key}"]`);
  if(wrap){
    wrap.querySelectorAll('.mo-line').forEach(line=>{
      const id=line.dataset.id;const item=m[key].find(x=>String(x.id)===id);
      const ta=line.querySelector('.mo-edit-line');
      if(ta){autosize(ta);ta.oninput=()=>{if(item){item.text=ta.value;save();}autosize(ta);};}
      const del=line.querySelector('.mo-del');
      if(del)del.onclick=()=>{m[key]=m[key].filter(x=>String(x.id)!==id);save();renderMorning();};
    });
  }
  if(wrap)makeSortable(wrap,'.mo-line',ids=>{
    m[key].sort((a,b)=>ids.indexOf(String(a.id))-ids.indexOf(String(b.id)));
    save();
  });
  const addInp=main.querySelector(`.mo-add-input[data-key="${key}"]`);
  const addBtn=main.querySelector(`.mo-add-btn[data-key="${key}"]`);
  if(addInp&&addBtn){
    const add=()=>{const v=addInp.value.trim();if(!v)return;m[key].push({id:key+'_'+Date.now(),text:v});save();renderMorning();};
    addBtn.onclick=add;addInp.onkeydown=e=>{if(e.key==='Enter')add();};
  }
}
function autosize(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}

/* helpers */
function bindText(id,apply,savedId){const el=document.getElementById(id);if(!el)return;el.oninput=()=>{apply(el.value);save();if(savedId)flash(savedId);};}
function flash(id){const s=document.getElementById(id);if(!s)return;s.classList.add('show');clearTimeout(window['__f'+id]);window['__f'+id]=setTimeout(()=>s.classList.remove('show'),900);}
function tick(){const d=new Date();document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();}
function setActiveNav(v){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===v));}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{setActiveNav(b.dataset.view);currentView=b.dataset.view;render();});

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script load failed'));document.head.appendChild(s);});}
function setSyncStatus(state){

/* lock screen */
async function pinHash(pin){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mo-os:'+pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function showLock(mode,onUnlock){
  // mode: 'enter' | 'set'
  let stage=mode,firstPin='',buf='';
  const el=document.createElement('div');
  el.id='lock-screen';
  el.innerHTML=`
    <div class="lk-mark">M</div>
    <div class="lk-title" id="lk-title"></div>
    <div class="lk-dots" id="lk-dots">${'<span></span>'.repeat(4)}</div>
    <div class="lk-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <span></span><button data-k="0">0</button><button data-k="del">⌫</button>
    </div>`;
  document.body.appendChild(el);
  const title=el.querySelector('#lk-title');
  const dots=el.querySelectorAll('#lk-dots span');
  const setTitle=()=>{title.textContent=stage==='enter'?'Enter your code':stage==='set'?'Set a 4-digit code':'Enter it again';};
  const paint=()=>{dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length));};
  const shake=()=>{
    const w=el.querySelector('#lk-dots');
    w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
    buf='';setTimeout(paint,250);
  };
  const done=()=>{el.remove();document.removeEventListener('keydown',keys);onUnlock();};
  const submit=async()=>{
    const h=await pinHash(buf);
    if(stage==='enter'){
      const entered=buf;
      title.textContent='Checking…';
      try{
        const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:entered})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){title.textContent=d.error==='Too many attempts. Wait 15 minutes.'?d.error:'Enter your code';shake();return;}
        cryptoKey=await deriveKey(entered,d.pepper);
        await stashKey();
        try{localStorage.setItem('os:unlock',h);}catch(_){}
        if(!S){await load();if(!S){title.textContent='Could not read your data';return;}}
        done();
      }catch(e){
        // offline or local dev: fall back to local check while data is unencrypted
        if(S&&S.pinHash&&h===S.pinHash){try{localStorage.setItem('os:unlock',h);}catch(_){}done();}
        else{title.textContent='Cannot verify right now';shake();}
      }
    }else if(stage==='set'){
      firstPin=buf;buf='';stage='confirm';setTitle();paint();
    }else{
      if(buf===firstPin){
        S.pinHash=h;save();
        try{localStorage.setItem('os:unlock',h);}catch(_){}
        done();
      }else{stage='set';firstPin='';setTitle();shake();}
    }
  };
  const press=k=>{
    if(k==='del'){buf=buf.slice(0,-1);paint();return;}
    if(buf.length>=4)return;
    buf+=k;paint();
    if(buf.length===4)setTimeout(submit,140);
  };
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  function keys(e){
    if(/^[0-9]$/.test(e.key))press(e.key);
    if(e.key==='Backspace')press('del');
  }
  document.addEventListener('keydown',keys);
  setTitle();paint();
}

/* BACKGROUND MUSIC */
const MUSIC={id:'cml0QO7Pkos',title:'Manifest Your Desires'};
let ytPlayer=null,ytReady=false,musicOn=false;
function musicPlaying(){return musicOn;}
function ensureYT(cb){
  if(ytReady)return cb();
  if(!window.__ytLoading){
    window.__ytLoading=true;
    const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);
    window.onYouTubeIframeAPIReady=()=>{ytReady=true;cb();};
  }else{
    const iv=setInterval(()=>{if(ytReady){clearInterval(iv);cb();}},200);
  }
}
function musicPill(){
  let p=document.getElementById('music-pill');
  if(!musicOn){if(p)p.remove();return;}
  if(!p){
    p=document.createElement('div');p.id='music-pill';
    p.innerHTML=`<span class="mp-eq"><i></i><i></i><i></i></span><span class="mp-name">${esc(MUSIC.title)}</span><button class="mp-x" title="Stop">×</button>`;
    document.body.appendChild(p);
    p.querySelector('.mp-x').onclick=()=>toggleMusic();
  }
}
function toggleMusic(){
  ensureYT(()=>{
    if(!ytPlayer){
      const host=document.createElement('div');host.id='yt-host';host.style.cssText='position:fixed;width:1px;height:1px;left:-100px;bottom:-100px;opacity:0;pointer-events:none';
      const div=document.createElement('div');div.id='yt-player';host.appendChild(div);document.body.appendChild(host);
      ytPlayer=new YT.Player('yt-player',{
        videoId:MUSIC.id,
        playerVars:{autoplay:1,loop:1,playlist:MUSIC.id,controls:0,disablekb:1},
        events:{
          onReady:e=>{e.target.setVolume(55);e.target.playVideo();musicOn=true;musicPill();if(currentView==='morning')renderMorning();},
          onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)e.target.playVideo();}
        }
      });
      return;
    }
    if(musicOn){ytPlayer.pauseVideo();musicOn=false;}
    else{ytPlayer.playVideo();musicOn=true;}
    musicPill();if(currentView==='morning')renderMorning();
  });
}

/* boot */
function finishBoot(){
  const wn=document.getElementById('ws-name');wn.value=S.wsName||'OS';
  wn.oninput=()=>{S.wsName=wn.value;save();document.title=wn.value||'MO OS';document.getElementById('brandmark').textContent=(S.name||wn.value||'M').trim().charAt(0).toUpperCase()||'M';};
  document.title=S.wsName||'MO OS';
  document.getElementById('brandmark').textContent=(S.name||S.wsName||'M').trim().charAt(0).toUpperCase()||'M';
  render();
}
(async function(){
  tick();setInterval(tick,20000);
  await restoreKey();
  await load();
  if(!S){
    // data is encrypted and this device has no (or a stale) key
    if(window.__LOCKED==='__BADKEY__'){try{localStorage.removeItem('os:key');}catch(_){}cryptoKey=null;}
    showLock('enter',finishBoot);
    return;
  }
  let stored=null;try{stored=localStorage.getItem('os:unlock');}catch(_){}
  if(!S.pinHash)showLock('set',finishBoot);
  else if(stored!==S.pinHash&&!cryptoKey)showLock('enter',finishBoot);
  else finishBoot();
})();
</script>
