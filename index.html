<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MO OS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff7a47'/%3E%3Cstop offset='1' stop-color='%23ffb02e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='50' font-family='Inter,Arial,sans-serif' font-size='58' font-weight='800' fill='%23111' text-anchor='middle' dominant-baseline='central'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060607;
    --bg-2:#0a0a0c;
    --panel:#08080a;
    --card:#101012;
    --card-2:#141416;
    --card-hi:#18181b;
    --border:rgba(255,255,255,.07);
    --border-2:rgba(255,255,255,.13);
    --text:#f4f4f5;
    --muted:#9c9ca4;
    --faint:#63636b;
    --accent:#ff7a47;
    --accent-2:#ffb02e;
    --accent-soft:rgba(255,122,71,.13);
    --teal:#2dd4bf;
    --good:#34d399;
    --good-soft:rgba(52,211,153,.13);
    --warn:#fbbf24;
    --warn-soft:rgba(251,191,36,.13);
    --bad:#f87171;
    --bad-soft:rgba(248,113,113,.13);
    --gold:#fbbf24;
    --r:16px;
    --r-sm:11px;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --display:'Space Grotesk','Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:
      radial-gradient(80% 50% at 50% -20%,rgba(255,122,71,.045),transparent 60%),
      var(--bg);
    color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  ::selection{background:rgba(255,122,71,.32)}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--accent)}

  .shell{display:flex;min-height:100vh}
  .rail{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;padding:20px 13px;position:sticky;top:0;height:100vh}
  .brand{padding:6px 10px 20px;display:flex;flex-direction:column;gap:4px}
  .brand .logo{display:flex;align-items:center;gap:9px}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 12px rgba(255,122,71,.35);flex:0 0 32px}
  .brand input{background:none;border:none;font-size:17px;font-weight:700;color:var(--text);padding:0;width:100%;letter-spacing:-.01em}
  .brand input:focus{outline:none}
  .brand .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding-left:1px}
  .navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:var(--muted);cursor:pointer;padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:500;transition:.15s;position:relative}
  .navbtn svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .navbtn:hover{color:var(--text);background:rgba(255,255,255,.035)}
  .navbtn.active{color:var(--text);background:linear-gradient(90deg,var(--accent-soft),transparent 85%)}
  .navbtn.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .navbtn.active svg{stroke:var(--accent)}
  .rail-foot{margin-top:auto;padding:11px 13px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:8px}
  .rail-foot .dot{width:7px;height:7px;border-radius:99px;background:var(--faint)}
  .rail-foot .dot.live{background:var(--good);box-shadow:0 0 9px var(--good)}
  .rail-foot .dot.err{background:var(--bad)}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{border-bottom:1px solid var(--border);padding:18px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
  .topbar .hi{font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .hi .greet-hey{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .streak-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 10px;border-radius:99px;
    background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.06));
    border:1px solid rgba(251,191,36,.35);box-shadow:0 2px 10px rgba(251,191,36,.12)}
  .streak-badge svg{width:16px;height:16px;fill:var(--gold);stroke:none;filter:drop-shadow(0 0 5px rgba(251,191,36,.5))}
  .streak-badge b{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--gold);line-height:1}
  .streak-badge span{font-size:11px;color:var(--gold);opacity:.85;letter-spacing:.02em}
  .topbar .clock{font-size:21px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .topbar .date{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:2px;text-align:right}

  main{padding:26px 34px 90px;max-width:1240px;width:100%}
  .view{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view{animation:none}}

  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  h2.sec{font-size:25px;font-weight:700;margin:0;letter-spacing:-.02em;font-family:var(--display)}
  .sec-sub{color:var(--muted);font-size:13px;margin:3px 0 0}

  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g23{grid-template-columns:1.4fr 1fr}
  @media (max-width:960px){.g2,.g3,.g23{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
  .card.hover:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .card h3{margin:0 0 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card h3 .h3sub{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500;font-size:11px}

  .hero{background:
      radial-gradient(120% 120% at 100% 0,rgba(255,176,46,.12),transparent 55%),
      linear-gradient(150deg,var(--card-hi),var(--card));
    border:1px solid var(--border-2);display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .ring-wrap{position:relative;width:140px;height:140px;flex:0 0 140px}
  .ring-wrap .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-wrap .pct b{font-size:32px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
  .ring-wrap .pct span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .hero-info{flex:1;min-width:180px}
  .hero-info .big{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero-info .streak{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:4px 0 2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:11px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:99px;padding:5px 12px}
  .chip b{color:var(--text);font-family:var(--mono)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px}
  .tile{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:var(--r-sm);padding:16px 17px;transition:.15s;position:relative;overflow:hidden}
  .tile:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .tile.big{grid-column:span 2}
  @media (max-width:600px){.tile.big{grid-column:span 1}}
  .tile .n{font-size:27px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
  .tile .n.money{font-size:30px}
  .tile .n.accent{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile .n.gold{color:var(--gold)}
  .tile .n.good{color:var(--good)}
  .tile .n.teal{color:var(--teal)}
  .tile .n.bad{color:var(--bad)}
  .tile .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:500}
  .tile .sub{font-size:10.5px;color:var(--faint);margin-top:3px}

  .meter{margin-bottom:16px}.meter:last-child{margin-bottom:0}
  .track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

  .funnel{display:flex;flex-direction:column;gap:9px}
  .fstep{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:14px}
  .fstep .fl{font-size:12.5px;color:var(--muted)}
  .fbar-track{height:26px;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
  .fbar{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1);min-width:2px}
  .fstep .fv{font-family:var(--mono);font-size:13px;font-weight:600;min-width:78px;text-align:right}
  .fstep .fv small{color:var(--faint);font-weight:400;font-size:11px}

  .disc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .disc li{display:flex;align-items:center;gap:12px;padding:10px 9px;border-radius:9px;cursor:pointer;transition:background .12s}
  .disc li:hover{background:rgba(255,255,255,.035)}
  .box{width:20px;height:20px;flex:0 0 20px;border:1.5px solid var(--border-2);border-radius:7px;display:grid;place-items:center;transition:.14s}
  .box svg{width:11px;height:11px;stroke:#04121a;stroke-width:3.2;opacity:0;fill:none}
  .disc li.done .box,.ai.done .box,.box.done{background:linear-gradient(135deg,var(--good),#6ff0bd);border-color:var(--good)}
  .disc li.done .box svg,.box.done svg{opacity:1}
  .disc li.done .lbl{color:var(--muted)}
  .disc .lbl{flex:1;font-size:13.5px}

  .addrow{display:flex;gap:9px;margin-top:14px}
  .hb-addrow{border:1px dashed var(--border-2);border-radius:11px;padding:8px 8px 8px 12px}
  .hb-addrow input{background:transparent}
  .addrow input,.inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--text)}
  .addrow input:focus,.inp:focus{outline:none;border-color:var(--accent)}
  .btn{background:var(--card-2);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:10px 15px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.13s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.solid{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;box-shadow:0 4px 14px rgba(255,122,71,.3)}
  .btn.solid:hover{filter:brightness(1.1);color:#fff}
  a.track-btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  a.track-btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
  .rm{opacity:0;background:none;border:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
  li:hover .rm,.ai:hover .rm{opacity:.7}.rm:hover{color:var(--bad);opacity:1}
  .pill{font-size:11px;font-weight:500;padding:4px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
  .pill .d{width:7px;height:7px;border-radius:99px;background:currentColor}
  .pill.live{color:var(--good);background:var(--good-soft)}
  .pill.off{color:var(--muted);background:rgba(255,255,255,.05)}
  .pill.err{color:var(--bad);background:var(--bad-soft)}
  .pill .d.live{animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px}
  .seg button{background:none;border:none;color:var(--muted);padding:6px 13px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;transition:.12s}
  .seg button.on{background:var(--card-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}

  .bars{display:flex;align-items:stretch;gap:6px;height:150px;margin-top:8px}
  .bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;min-width:0}
  .bar-col{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar{width:100%;max-width:30px;min-height:3px;background:var(--border-2);border-radius:5px 5px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1);position:relative}
  .bar.on{background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .bar.hit{background:linear-gradient(180deg,var(--good),#6ff0bd)}
  .bar-lbl{font-size:9.5px;color:var(--muted);margin-top:7px;white-space:nowrap}
  .bar-val{font-size:9px;color:var(--faint);margin-bottom:4px;white-space:nowrap}

  .seth-quote{margin:2px 0 20px;padding:11px 0 11px 16px;border-left:2px solid var(--border-2);color:var(--muted);font-size:13px;font-style:italic;line-height:1.5;max-width:640px}
  .seth-quote b{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:600}

  .hb-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}
  @media(max-width:600px){.hb-summary{grid-template-columns:1fr}}
  .hbcard{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow)}
  .hbcard .mini-ring{position:relative;width:56px;height:56px;flex:0 0 56px}
  .hbcard .mini-ring .mp{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);z-index:1}
  .hbcard .hbc-info .hbc-n{font-size:22px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
  .hbcard .hbc-info .hbc-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  .hb-hero{background:radial-gradient(120% 120% at 100% 0,rgba(251,191,36,.1),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2);display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .hb-hero-info{flex:1;min-width:200px}
  .hb-streak-row{display:flex;align-items:baseline;gap:12px}
  .hb-streak-num{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,var(--gold),#f5915e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hb-streak-lbl{font-size:13px;color:var(--muted);font-weight:600}
  .chip.hb-chip-lg{font-size:12.5px;padding:7px 15px}
  .chip.hb-chip-lg b{font-size:15px;margin-right:5px}
  .chip.hb-chip-lg b.good{color:var(--good)}.chip.hb-chip-lg b.accent{color:var(--accent)}.chip.hb-chip-lg b.warn{color:var(--warn)}
  .bar-lbl.today{color:var(--accent);font-weight:700}

  .hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .hcard2{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);transition:border-color .15s}
  .hcard2:hover{border-color:var(--border-2)}
  .hc2-top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .hlabel2{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:7px;color:var(--text);font-family:var(--sans);font-size:14.5px;font-weight:600;padding:5px 7px;transition:.12s}
  .hlabel2:hover{border-color:var(--border)}
  .hlabel2:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  .hc2-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--border)}
  .hc2-stat{text-align:center}
  .hc2-pct{font-size:19px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em}
  .hc2-pct.good{color:var(--good)}.hc2-pct.accent{color:var(--accent)}.hc2-pct.warn{color:var(--warn)}.hc2-pct.faint{color:var(--faint);font-weight:500}
  .hc2-stat-lbl{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .hs-dots{display:flex;flex-wrap:wrap;gap:6px}
  .hs-col{display:flex;flex-direction:column;align-items:center;gap:5px}
  .hs-dot{width:17px;height:17px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:.13s}
  .hs-dot:hover{border-color:var(--border-2);transform:scale(1.15)}
  .hs-dot.on{border-color:transparent}
  .hs-dot.today{box-shadow:0 0 0 2px var(--accent)}
  .hs-dot-lbl{font-size:8.5px;color:var(--faint);text-transform:uppercase;font-weight:600}
  .hs-dots-lbl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}

  .today-row{display:flex;gap:11px;flex-wrap:wrap}
  .today-tile{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:11px;padding:20px 12px;background:var(--bg);border:1px solid var(--border);border-radius:13px;cursor:pointer;transition:.15s;font-family:inherit}
  .today-tile:hover{border-color:var(--dc,var(--accent));transform:translateY(-2px)}
  .today-tile.on{background:var(--good-soft);border-color:var(--good)}
  .today-tile .box{width:30px;height:30px;pointer-events:none;border-color:var(--dc,var(--border-2))}
  .today-tile-lbl{font-size:12.5px;font-weight:600;color:var(--text);text-align:center;line-height:1.3}
  .today-tile.on .today-tile-lbl{color:var(--good)}
  @media(max-width:700px){.today-tile{min-width:calc(50% - 6px)}}

  .hboard{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .hboard::-webkit-scrollbar{height:8px}.hboard::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .hgrid{border-collapse:separate;border-spacing:0;width:100%}
  .hgrid th{padding:0}
  .col-h{text-align:center;padding:0 0 10px;min-width:34px}
  .col-h .cd{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
  .col-h .cn{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
  .col-h.istoday .cn{color:var(--accent);font-weight:700}
  .hname{padding:5px 12px 5px 2px;min-width:170px;position:sticky;left:0;background:var(--bg-2);z-index:2;display:flex;align-items:center;gap:9px}
  .hname input{background:none;border:1px solid transparent;border-radius:7px;color:var(--text);font-family:var(--sans);font-size:13.5px;padding:6px 8px;width:100%;transition:.12s}
  .hname input:hover{border-color:var(--border)}
  .hname input:focus{outline:none;border-color:var(--accent);background:var(--bg)}

  input[type=date].datepick{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-family:var(--mono);font-size:12px;cursor:pointer}

  /* MORNING FORMULA */
  .mo-vision{background:
      radial-gradient(120% 120% at 0 0,rgba(251,191,36,.08),transparent 55%),
      linear-gradient(150deg,var(--card-hi),var(--card));border:1px solid var(--border-2)}
  .vboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .vcard{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .18s,box-shadow .18s}

  .et-iconbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .et-iconbtn:disabled{opacity:.25;cursor:default}
  .et-projsel{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px;padding:4px 6px;max-width:120px}
  .et-status-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px;font-weight:600}

  .qa-panel{position:relative;width:min(440px,92vw);background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:22px}
  .qa-title{font-size:16px;font-weight:700;margin-bottom:14px}
  .qa-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .qa-est-row{display:flex;gap:8px;margin-bottom:18px}
  .qa-est-chip{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;transition:.13s}
  .qa-est-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .qa-actions{display:flex;justify-content:flex-end;gap:10px}

  /* habit weight input */
  .hname{display:flex;align-items:center;gap:8px}
  .hwt{display:inline-flex;align-items:center;gap:3px;margin-left:auto;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px 6px}
  .hwt input.hweight{width:26px;background:none;border:none;color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:700;text-align:right;padding:0}
  .hwt input.hweight:focus{outline:none}
  .hwt .hwt-lbl{font-size:9px;color:var(--faint);text-transform:uppercase}
  .hname input.hlabel{flex:1;min-width:60px}
  .disc-w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600}
  .disc li.done .disc-w{color:var(--good)}

  /* DISCREET DAY NOTE */
  .day-note{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:0 2px}
  .day-note input{flex:1;background:none;border:none;border-bottom:1px solid var(--border);color:var(--muted);font-size:12.5px;padding:7px 2px;transition:.15s}
  .day-note input::placeholder{color:var(--faint)}
  .day-note input:hover{border-bottom-color:var(--border-2)}
  .day-note input:focus{outline:none;border-bottom-color:var(--accent);color:var(--text)}
  .day-note.has-note input{color:var(--text)}
  .dn-saved{flex-shrink:0}

  /* WEEKLY REVIEW */
  .wk-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
  .wk-title{text-align:center;font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:2px}
  .wk-title span{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.02em}
  .wk-disc{display:flex;flex-direction:column;gap:11px}
  .wk-disc-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:12px}
  .wk-disc-label{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk-disc-track{height:8px;background:var(--bg);border:1px solid var(--border);border-radius:99px;overflow:hidden}
  .wk-disc-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .5s}
  .wk-disc-val{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
  .wk-notes{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .wk-notes-hdr{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:2px}
  .wk-note{display:flex;gap:10px;font-size:12.5px;line-height:1.45}
  .wk-note-day{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--muted);width:42px}
  .wk-note-txt{color:var(--text)}
  .wk-journal .wk-j-field{margin-bottom:14px}
  .wk-journal .wk-j-field:last-child{margin-bottom:0}
  .wk-journal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
  .wk-journal textarea.write{min-height:70px}

  /* HEAD TRASH */
  .headtrash-launch{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:border-color .15s,transform .15s}
  .headtrash-launch:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .htl-left{display:flex;align-items:center;gap:14px}
  .htl-icon{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:var(--bad-soft);display:grid;place-items:center}
  .htl-icon svg{width:20px;height:20px;stroke:var(--bad);fill:none;stroke-width:1.8}
  .htl-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .htl-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .htl-open{font-size:12px;color:var(--accent);font-weight:500;white-space:nowrap}
  .ht-panel{padding-bottom:0}
  .ht-panel .ht-add{display:flex;gap:9px;padding:0 22px 16px}
  .ht-panel .ht-add input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px 15px;font-size:14px;color:var(--text)}
  .ht-panel .ht-add input:focus{outline:none;border-color:var(--bad)}
  .ht-scroll{flex:1;overflow-y:auto;padding:0 22px 22px}
  .ht-scroll::-webkit-scrollbar{width:8px}.ht-scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .ht-list{display:flex;flex-direction:column;gap:9px}
  .ht-item{display:flex;align-items:flex-start;gap:12px;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
  .ht-body{flex:1;min-width:0}
  .ht-text{font-size:14px;line-height:1.5}
  .ht-time{font-size:10.5px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .ht-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ht-flip{background:none;border:1px solid var(--border-2);color:var(--good);font-size:11px;padding:5px 10px;border-radius:8px;cursor:pointer;transition:.13s;white-space:nowrap}
  .ht-flip:hover{background:var(--good-soft);border-color:var(--good)}
  .ht-del{align-self:center}
  .ht-item.inverting{display:block;border-color:var(--good);background:linear-gradient(180deg,var(--good-soft),var(--bg))}
  .ht-invert{display:flex;flex-direction:column;gap:10px}
  .hti-original{font-size:13px}
  .hti-strike{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--border-2)}
  .hti-arrow{font-size:11px;letter-spacing:.03em;color:var(--good);font-weight:600}
  .hti-input{width:100%;background:var(--bg);border:1px solid var(--good);border-radius:9px;color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;padding:11px 13px;resize:vertical}
  .hti-input:focus{outline:none;box-shadow:0 0 0 3px var(--good-soft)}
  .hti-actions{display:flex;gap:8px}
  .hti-actions .btn{font-size:12px;padding:8px 14px}

  /* COACHING EXPAND + MODAL */
  .co-expand{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.13s}
  .co-expand svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
  .co-expand:hover{border-color:var(--accent);color:var(--accent)}
  .co-notes-lbl{display:flex;align-items:center}
  textarea.co-note-area{min-height:200px;max-height:340px}
  .note-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:28px}
  .nm-backdrop{position:absolute;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(4px)}
  .nm-panel{position:relative;width:min(860px,100%);height:min(80vh,760px);background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
  .nm-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--border)}
  .nm-title{font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:2px}
  .nm-title .nm-sub{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.02em}
  .nm-actions{display:flex;align-items:center;gap:12px}
  .nm-area{flex:1;width:100%;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;padding:22px;resize:none}
  .nm-area:focus{outline:none}

  /* ===== TOPBAR GOAL CHIP ===== */
  .goal-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;
    background:linear-gradient(135deg,var(--accent-soft),rgba(255,176,46,.08));border:1px solid rgba(255,122,71,.35)}
  .goal-chip b{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);line-height:1}
  .goal-chip span{font-size:11px;color:var(--muted);letter-spacing:.02em;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== MORNING GOAL ===== */
  .mo-goal{background:radial-gradient(120% 140% at 0 0,rgba(255,122,71,.12),transparent 58%),radial-gradient(80% 100% at 100% 100%,rgba(255,176,46,.06),transparent 60%),var(--card);border-color:var(--border-2);padding:26px 28px}
  .mo-goal-row{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
  .mo-goal-cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .mo-goal-big{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.25;
    background:linear-gradient(95deg,var(--text),rgba(255,176,46,.85));-webkit-background-clip:text;background-clip:text;color:transparent}
  .mo-goal-cd{text-align:center;flex:0 0 auto;min-width:132px;padding:14px 22px;border-radius:14px;background:rgba(255,122,71,.09);border:1px solid rgba(255,122,71,.28)}
  .mo-goal-cd b{display:block;font-family:var(--mono);font-size:38px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
  .mo-goal-cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .mo-goal-track{margin-top:10px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .mo-goal-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease}
  .gl-label-in{background:none;border:none;color:var(--accent);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;font-family:inherit;padding:0;min-width:160px;flex:1}
  .gl-label-in:focus{outline:none;color:var(--text)}
  .gl-card{margin-bottom:12px;padding:18px 20px}
  .gl-card.done{opacity:.55}
  .gl-card.done .gl-text-in{text-decoration:line-through}
  .gl-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .gl-card-acts{display:flex;align-items:center;gap:6px;opacity:0;transition:.13s}
  .gl-card:hover .gl-card-acts{opacity:1}
  .gl-card-acts .et-status-tag{opacity:1}
  textarea.gl-text-in{border:1px solid transparent;background:none;padding:2px 4px;min-height:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3;resize:none;overflow:hidden;border-radius:6px;width:100%;color:var(--text)}
  textarea.gl-text-in:hover{background:rgba(255,255,255,.02)}
  textarea.gl-text-in:focus{outline:none;background:rgba(255,255,255,.03)}
  .gl-card .gl-meta-row{margin-top:10px}
  .mo-goal-minis{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:7px}
  .mo-goal-mini{display:flex;align-items:center;gap:12px;font-size:13px}
  .mgm-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;flex:0 0 auto;min-width:74px}
  .mgm-text{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mgm-days{font-family:var(--mono);font-size:12px;color:var(--accent);flex:0 0 auto}
  .mo-goal-edit{display:flex;flex-direction:column;gap:12px}
  .mo-goal-date{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .mo-goal-date input{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text);font-size:13px;color-scheme:dark}

  /* ===== JOURNAL & NOTES ===== */
  .btn-sm{padding:5px 11px;font-size:11.5px;text-transform:none;letter-spacing:0}
  textarea.jr-write{min-height:170px;font-size:15px;overflow:hidden}
  .jr-meta{margin-top:8px;font-size:11px;color:var(--faint);font-family:var(--mono);min-height:14px}
  .jr-list{display:flex;flex-direction:column;gap:4px}
  .jr-row{border:1px solid transparent;border-radius:10px;transition:.13s}
  .jr-row.open{border-color:var(--border);background:rgba(255,255,255,.02);padding:0 12px 12px}
  .jr-row-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;padding:11px 12px;border-radius:10px;font-size:13px}
  .jr-row.open .jr-row-head{padding-left:0;padding-right:0}
  .jr-row-head:hover{background:rgba(255,255,255,.03)}
  .jr-row.open .jr-row-head:hover{background:none}
  .jr-row-date{font-weight:600;flex:0 0 auto;white-space:nowrap}
  .jr-row-snip{color:var(--faint);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr-row-arrow{color:var(--faint);flex:0 0 auto}
  .jr-past-edit{min-height:100px}
  .jr-row2{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);cursor:pointer;padding:12px 14px;border-radius:11px;font-family:inherit;transition:.13s}
  .jr-row2:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
  .jr2-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr2-date{font-size:12px;color:var(--faint);flex:0 0 auto}
  .jr-month{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:26px 0 10px;padding-left:2px}
  .jr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .jr-card{display:flex;flex-direction:column;gap:7px;text-align:left;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:13px;padding:15px 16px;cursor:pointer;font-family:inherit;color:var(--text);transition:.14s}
  .jr-card:hover{border-color:rgba(255,122,71,.35);background:rgba(255,255,255,.04);transform:translateY(-2px)}
  .jr-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%}
  .jr-card-title{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr-card-day{font-family:var(--mono);font-size:10.5px;color:var(--accent);flex:0 0 auto;opacity:.85}
  .jr-card-prev{font-size:12px;color:var(--faint);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .jr-notes .inp{width:100%;margin-top:2px}
  .note-list{display:flex;flex-direction:column;gap:4px;margin-top:12px}
  .note-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);cursor:pointer;padding:10px 11px;border-radius:10px;transition:.13s}
  .note-row:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
  .note-pin{flex:0 0 auto;font-size:15px;color:var(--faint);cursor:pointer;line-height:1;padding:2px}
  .note-pin.on{color:var(--gold)}
  .note-pin:hover{color:var(--gold)}
  .note-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .note-title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-snip{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-date{flex:0 0 auto;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  .note-panel{padding:0}
  .note-title-in{flex:1;background:none;border:none;color:var(--text);font-size:17px;font-weight:700;padding:0;letter-spacing:-.01em}
  .note-title-in:focus{outline:none}
  .note-body{flex:1;border:none;border-radius:0;background:none;padding:20px 22px;min-height:0;resize:none;overflow-y:auto!important}
  .note-body:focus{outline:none}
  .note-foot{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;border-top:1px solid var(--border);font-size:11px;color:var(--faint)}
  .danger-ghost{border-color:rgba(248,113,113,.4);color:var(--bad);background:none}
  .danger-ghost:hover{background:var(--bad-soft)}
  .jr-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px}
  .jr-tab{background:none;border:none;color:var(--muted);cursor:pointer;padding:7px 16px;border-radius:7px;font-size:12.5px;font-weight:600;transition:.13s}
  .jr-tab.active{background:var(--card-hi);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .gl-meta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .gl-countdown{font-size:12.5px;color:var(--muted)}
  .gl-countdown b{font-family:var(--mono);font-size:16px;color:var(--accent)}
  .big-goal{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;transition:.13s}
  .big-goal:hover{background:rgba(255,255,255,.02);border-color:var(--border)}
  .big-goal.done .bg-text{color:var(--faint);text-decoration:line-through}
  .bg-check{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1.5px solid var(--border-2);background:none;color:var(--good);font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:.13s;padding:0}
  .big-goal.done .bg-check{background:var(--good-soft);border-color:var(--good)}
  .bg-check:hover{border-color:var(--good)}
  .bg-text{flex:1;font-size:13.5px}
  .bg-del{opacity:0}
  .big-goal:hover .bg-del{opacity:1}
  .gl-log{padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.015)}
  .gl-log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .gl-log-date{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .gl-log-del{opacity:0}
  .gl-log:hover .gl-log-del{opacity:1}
  .gl-log-text{font-size:13.5px;line-height:1.6;white-space:pre-wrap}

  /* ===== TASKS POLISH ===== */
  .et-addbar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
  .et-addbar input{flex:1;background:none;border:none;color:var(--text);font-size:14.5px;padding:8px 10px}
  .et-addbar input:focus{outline:none}
  .et-addbar select{background:var(--card-2);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12.5px;padding:9px 10px;cursor:pointer}
  .et-addbar:focus-within{border-color:var(--border-2)}
  .et-lblbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.13s;white-space:nowrap}
  .et-lblbtn:hover{border-color:var(--border-2);color:var(--text);background:rgba(255,255,255,.04)}
  .et-lblbtn.act-focus:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .et-lblbtn.act-next:hover{border-color:var(--teal);color:var(--teal)}
  .et-lblbtn.on{border-color:rgba(255,122,71,.4);color:var(--accent);background:var(--accent-soft)}
  .et-row{border-bottom:none!important;border-radius:11px;padding:11px 10px!important;transition:background .13s}
  .et-row:hover{background:rgba(255,255,255,.025)}
  .et-row .et-actions{opacity:0;transition:opacity .13s}
  .et-row:hover .et-actions,.et-row .et-actions:focus-within{opacity:1}
  .et-row .et-actions .et-status-tag{opacity:1}
  .et-row .drag-grip{opacity:0;transition:opacity .13s}
  .et-row:hover .drag-grip{opacity:.6}
  @media (hover:none){.et-row .et-actions,.et-row .drag-grip{opacity:1}}

  /* ===== HABITS (simple) ===== */
  .hb-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .hb-score b{font-family:var(--mono);font-size:42px;font-weight:800;letter-spacing:-.03em}
  .hb-score span{font-size:13px;color:var(--faint);margin-left:4px}
  .hb-chips{display:flex;gap:8px}
  .hb-list{display:flex;flex-direction:column;gap:6px}
  .hb-row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--border);color:var(--text);cursor:pointer;padding:13px 15px;border-radius:12px;font-size:14.5px;font-weight:500;transition:.13s;font-family:inherit}
  .hb-row:hover{border-color:var(--border-2)}
  .hb-row.done{background:var(--good-soft);border-color:rgba(52,211,153,.3)}
  .hb-row.done .hb-name{color:var(--muted);text-decoration:line-through}
  .hb-check{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--good);transition:.13s}
  .hb-row.done .hb-check{background:var(--good);color:#08221a;border-color:var(--good)}
  .hb-ico{font-size:18px;flex:0 0 auto}
  .hb-name{flex:1}
  .hb-pts{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
  .hb-row.done .hb-pts{color:var(--good)}
  .hb-row.edit{cursor:default}
  .hb-name-in{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:13.5px}
  .hb-wt-in{width:52px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 6px;color:var(--text);font-size:13px;text-align:center;font-family:var(--mono)}
  .hb-week{display:flex;gap:10px;align-items:flex-end;justify-content:space-between}
  .hb-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:12px;padding:8px 4px;cursor:pointer;font-family:inherit;transition:.13s}
  .hb-day:disabled{cursor:default}
  .hb-day:not(:disabled):hover{background:rgba(255,255,255,.03);border-color:var(--border)}
  .hb-day.sel{border-color:rgba(255,122,71,.45);background:var(--accent-soft)}
  .hb-day-bar{width:100%;max-width:44px;height:110px;background:var(--card-2);border-radius:9px;display:flex;align-items:flex-end;overflow:hidden}
  .hb-day-fill{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:9px 9px 0 0;transition:height .4s ease}
  .hb-day-fill.perfect{background:linear-gradient(180deg,var(--good),var(--teal))}
  .hb-day-val{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:14px}
  .hb-day-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .hb-day.today .hb-day-lbl{color:var(--accent);font-weight:700}
  .hb-daylabel{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--accent)}
  .hb-cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .hb-cal-dow span{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
  .hb-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .hb-cal-cell{aspect-ratio:1.15;border-radius:9px;background:var(--card-2);border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:11.5px;cursor:pointer;display:grid;place-items:center;transition:.13s;padding:0}
  .hb-cal-cell.blank{background:none;cursor:default}
  .hb-cal-cell.fut{opacity:.3;cursor:default}
  .hb-cal-cell.zero:hover{border-color:var(--border-2)}
  .hb-cal-cell.some{background:rgba(255,122,71,.15)}
  .hb-cal-cell.good{background:rgba(255,122,71,.34);color:#fff}
  .hb-cal-cell.perfect{background:rgba(52,211,153,.25);color:var(--good)}
  .hb-cal-cell.now{border-color:var(--accent)}
  .hb-cal-cell.sel{outline:2px solid var(--accent);outline-offset:1px;color:var(--text)}
  .hb-cal-cell:not(.fut):not(.blank):hover{border-color:var(--border-2)}
  .hb-stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hb-viewing{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid rgba(255,122,71,.3);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--text)}
  .hb-viewing b{color:var(--accent)}
  .hb-viewing-dot{width:7px;height:7px;border-radius:99px;background:var(--accent);box-shadow:0 0 8px rgba(255,122,71,.6);flex:0 0 auto}

  /* write CTA + notes grid */
  .jr-write-cta{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);
    background:radial-gradient(120% 140% at 0 0,rgba(255,122,71,.12),transparent 58%),var(--card);
    border:1px solid var(--border-2);border-radius:var(--r);padding:26px 28px;transition:.15s;box-shadow:var(--shadow)}
  .jr-write-cta:hover{border-color:rgba(255,122,71,.45);transform:translateY(-2px)}
  .jwc-cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .jwc-date{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;letter-spacing:-.02em}
  .jwc-preview{color:var(--muted);font-size:14px;line-height:1.6;max-width:640px}
  .jwc-hint{color:var(--faint);font-size:12px;margin-top:4px}
  .note-search{width:100%;max-width:360px;border-radius:99px;margin-bottom:14px;background:rgba(255,255,255,.03);border-color:transparent;padding:10px 16px}
  .note-search:focus{outline:none;background:var(--bg);border-color:var(--border)}
  .note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .note-card{display:flex;flex-direction:column;gap:7px;text-align:left;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:13px;padding:15px 16px;cursor:pointer;font-family:inherit;color:var(--text);transition:.14s}
  .note-card:hover{border-color:rgba(255,122,71,.35);background:rgba(255,255,255,.04);transform:translateY(-2px)}
  .note-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
  .note-card-ico{font-size:22px;line-height:1}
  .note-card .note-title{white-space:normal;font-size:14px;font-weight:650;line-height:1.35}
  .note-card-date{font-size:11px;color:var(--faint)}

  /* immersive writer: a page in a dark room */
  #writer-modal{position:fixed;inset:0;z-index:6000;overflow-y:auto;
    background:
      radial-gradient(85% 60% at 50% 115%,rgba(255,122,71,.22),transparent 64%),
      radial-gradient(55% 45% at 12% 90%,rgba(255,176,46,.09),transparent 70%),
      radial-gradient(50% 40% at 88% 15%,rgba(255,122,71,.07),transparent 70%),
      radial-gradient(120% 90% at 50% -30%,#141416,#060608 72%);
    animation:vmIn .3s ease both}
  .wr-amb{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .wr-ember{position:absolute;bottom:-12px;width:5px;height:5px;border-radius:99px;background:rgba(255,140,80,.55);filter:blur(1.5px);opacity:0;animation:emberUp linear infinite}
  .wr-ember.e1{left:12%;animation-duration:16s;animation-delay:0s}
  .wr-ember.e2{left:28%;animation-duration:21s;animation-delay:5s;width:4px;height:4px}
  .wr-ember.e3{left:47%;animation-duration:18s;animation-delay:9s}
  .wr-ember.e4{left:66%;animation-duration:24s;animation-delay:3s;width:3px;height:3px}
  .wr-ember.e5{left:82%;animation-duration:19s;animation-delay:12s}
  .wr-ember.e6{left:93%;animation-duration:26s;animation-delay:7s;width:4px;height:4px}
  @keyframes emberUp{
    0%{transform:translateY(0) translateX(0);opacity:0}
    8%{opacity:.7}
    60%{opacity:.35}
    100%{transform:translateY(-105vh) translateX(-30px);opacity:0}
  }
  .wr-halo{position:fixed;left:50%;top:52%;width:min(900px,110vw);height:70vh;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,122,71,.09),transparent 70%);
    animation:haloBreathe 7s ease-in-out infinite alternate}
  @keyframes haloBreathe{from{opacity:.5;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
  .wr-chrome{position:fixed;top:18px;right:22px;z-index:3;display:flex;align-items:center;gap:14px}
  .wr-count{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.4)}
  .wr-icon{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);width:36px;height:36px;border-radius:99px;font-size:16px;cursor:pointer;transition:.14s;backdrop-filter:blur(8px);display:grid;place-items:center}
  .wr-icon:hover{color:#fff;border-color:rgba(255,255,255,.4)}
  .wr-x{font-size:22px}

  /* background music */
  .mo-music-btn.on{border-color:rgba(255,122,71,.45);color:var(--accent);background:var(--accent-soft)}
  #music-pill{position:fixed;bottom:20px;right:20px;z-index:5500;display:flex;align-items:center;gap:11px;padding:9px 12px 9px 14px;border-radius:99px;
    background:rgba(18,18,20,.85);border:1px solid var(--border-2);box-shadow:0 8px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px);animation:vmRise .4s ease both}
  .mp-eq{display:flex;align-items:flex-end;gap:2px;height:14px}
  .mp-eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .mp-eq i:nth-child(1){height:6px;animation-delay:0s}
  .mp-eq i:nth-child(2){height:13px;animation-delay:.25s}
  .mp-eq i:nth-child(3){height:9px;animation-delay:.5s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .mp-name{font-size:12px;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mp-x{background:none;border:none;color:var(--faint);font-size:17px;cursor:pointer;line-height:1;padding:0 2px}
  .mp-x:hover{color:var(--text)}
  .wr-stage{position:relative;display:flex;flex-direction:column;align-items:center}
  .wr-label{margin-top:34px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,122,71,.9);font-weight:700;
    padding:7px 18px;border:1px solid rgba(255,122,71,.35);border-radius:99px;background:rgba(255,122,71,.07);
    animation:vmRise .7s ease both}
  .wr-goalline{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;animation:vmRise 1s .3s ease both}
  .wr-page{position:relative;width:min(740px,93vw);min-height:calc(100vh - 190px);margin:22px auto 40vh;
    background:linear-gradient(178deg,#151517,#111113 60%,#0e0e10);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 70px rgba(0,0,0,.8),0 60px 140px rgba(0,0,0,.55);
    padding:58px 68px 72px;
    animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(30px) scale(.965)}to{opacity:1;transform:none}}
  .wr-page-date{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
  .wr-title{display:block;width:100%;background:none;border:none;color:var(--text);font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;padding:0 0 10px;line-height:1.2}
  .wr-title:focus{outline:none}
  .wr-title::placeholder{color:rgba(255,255,255,.18)}
  .wr-rule{height:1px;background:linear-gradient(90deg,rgba(255,122,71,.35),rgba(255,255,255,.07) 40%,transparent);margin-bottom:8px}
  #wr-ta{display:block;width:100%;background:
      repeating-linear-gradient(transparent 0px,transparent 35px,rgba(255,255,255,.045) 35px,rgba(255,255,255,.045) 36px);
    border:none;color:var(--text);font-family:var(--sans);font-size:17px;line-height:36px;
    resize:none;overflow:hidden;caret-color:var(--accent);padding:0}
  #wr-ta:focus{outline:none}
  #wr-ta::selection{background:rgba(255,122,71,.3)}
  @media (max-width:640px){.wr-page{padding:40px 26px 56px;margin-top:38px}}

  /* ===== LOCK SCREEN ===== */
  #lock-screen{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:
      radial-gradient(80% 55% at 50% 115%,rgba(255,122,71,.16),transparent 62%),
      radial-gradient(120% 90% at 50% -30%,#131315,#050506 72%);
    animation:vmIn .3s ease both}
  .lk-mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;font-size:24px;color:#141414;box-shadow:0 8px 30px rgba(255,122,71,.35);animation:vmRise .6s ease both}
  .lk-title{font-family:var(--display);font-size:17px;font-weight:700;color:var(--muted);animation:vmRise .7s .1s ease both}
  .lk-dots{display:flex;gap:14px;animation:vmRise .7s .15s ease both}
  .lk-dots span{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--border-2);transition:.15s}
  .lk-dots span.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(255,122,71,.55)}
  .lk-dots.shake{animation:lkShake .4s ease}
  @keyframes lkShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .lk-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:8px;animation:vmRise .8s .2s ease both}
  .lk-pad button{height:64px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);font-size:22px;font-family:var(--mono);cursor:pointer;transition:.12s}
  .lk-pad button:hover{background:rgba(255,255,255,.08);border-color:var(--border-2)}
  .lk-pad button:active{background:var(--accent-soft);border-color:rgba(255,122,71,.4)}

  /* ===== COACHING ===== */
  .co-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .co-sel{background:var(--card-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;padding:9px 11px;cursor:pointer}
  .co-date{flex:0 0 auto;width:auto;color-scheme:dark}
  .co-badge{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(255,122,71,.3)}
  .co-badge.jj{background:rgba(45,212,191,.12);color:var(--teal);border-color:rgba(45,212,191,.3)}
  .note-row.co-active{background:rgba(255,255,255,.04);border-color:var(--border-2)}
  .co-err{font-size:12px;color:var(--bad)}
  .co-sum-text{margin:0;font-size:14px;line-height:1.65}
  .co-ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.55}
  .co-ul li::marker{color:var(--accent)}
  .co-ai{border-color:rgba(255,122,71,.25)}

  /* ===== MODERN PASS: flat sections, surfaces, pills ===== */
  .sect{margin-bottom:26px}
  .sect-head{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;padding:0 2px}
  .sect-head span{color:var(--faint);font-family:var(--mono);letter-spacing:0}
  .sect-empty{padding:10px 12px;font-size:12.5px}
  .sect-toggle{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;cursor:pointer;padding:0}
  .sect-toggle:hover{color:var(--text)}

  .ghost-add{margin-top:4px}
  .ghost-add input{background:none;border:1px dashed transparent;font-size:13.5px;padding:10px 12px;border-radius:11px;color:var(--text)}
  .ghost-add input::placeholder{color:var(--faint)}
  .ghost-add input:hover{background:rgba(255,255,255,.02)}
  .ghost-add input:focus{outline:none;background:var(--card);border-color:var(--border)}

  .jr-surface{width:100%;background:rgba(255,255,255,.02);border:1px solid transparent;border-radius:14px;padding:16px 18px;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;min-height:150px;resize:none;overflow:hidden;transition:.15s}
  .jr-surface:hover{background:rgba(255,255,255,.03)}
  .jr-surface:focus{outline:none;background:var(--card);border-color:var(--border)}
  .jr-surface::placeholder{color:var(--faint)}

  .jr-hero{margin-bottom:28px}
  .jr-hero-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;padding:0 2px}
  .jr-hero-date{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
  .jr-hero .jr-surface{min-height:200px;font-size:15.5px}

  .gl-compose{display:flex;gap:10px;align-items:flex-end;margin-bottom:18px}
  .gl-compose .jr-surface{flex:1}
  .gl-timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--border);margin-left:6px;padding-left:18px}
  .gl-timeline .gl-log{border:none;background:none;padding:2px 0 20px;position:relative}
  .gl-timeline .gl-log::before{content:"";position:absolute;left:-24px;top:8px;width:9px;height:9px;border-radius:99px;background:var(--accent);box-shadow:0 0 8px rgba(255,122,71,.4)}

  /* task rows: circles, calmer chrome */
  .et-row .box{border-radius:99px;width:21px;height:21px;flex:0 0 21px}
  .et-projsel{background:none;border:1px solid var(--border);border-radius:8px;color:var(--faint);font-size:11.5px;padding:5px 7px;cursor:pointer;max-width:120px}
  .et-projsel:hover{color:var(--muted);border-color:var(--border-2)}
  .proj-stack{display:flex;flex-direction:column;gap:6px}
  .proj-block{border:1px solid transparent;background:none;border-radius:13px}
  .proj-block:hover{border-color:var(--border);background:rgba(255,255,255,.015)}
  .proj-track{border:none;background:rgba(255,255,255,.06);height:4px}
  .proj-list{border-top:none;padding-top:0}
  .proj-empty{border-top:none}
  .addrow.proj-new{border-top:none;margin-top:6px;padding-top:0}
  .addrow.proj-new input{background:none;border:1px dashed transparent;border-radius:11px}
  .addrow.proj-new input:hover{background:rgba(255,255,255,.02)}
  .addrow.proj-new input:focus{outline:none;background:var(--card);border-color:var(--border)}
  .current-focus-card{border-radius:var(--r)}

  /* notes panel */
  .jr-notes{background:var(--card);border-radius:var(--r)}
  .jr-notes .inp{border-radius:99px;background:rgba(255,255,255,.03);border-color:transparent;padding:10px 16px}
  .jr-notes .inp:focus{outline:none;background:var(--bg);border-color:var(--border)}

  /* coaching header */
  .co-header{margin-bottom:24px}
  .co-title-big{width:100%;background:none;border:none;color:var(--text);font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;padding:0 2px 6px}
  .co-title-big:focus{outline:none}
  .co-title-big::placeholder{color:var(--faint)}
  .co-header-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 2px}
  .co-pill{background:none;border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:12px;font-weight:600;padding:6px 15px;cursor:pointer;transition:.13s;font-family:inherit}
  .co-pill:hover{border-color:var(--border-2);color:var(--text)}
  .co-pill.on{background:var(--accent-soft);border-color:rgba(255,122,71,.4);color:var(--accent)}
  .co-date-pill{background:none;border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:12px;padding:6px 13px;font-family:inherit;color-scheme:dark;cursor:pointer}
  .co-date-pill:hover{border-color:var(--border-2)}
  .co-ai-wrap{background:var(--card);border:1px solid rgba(255,122,71,.22);border-radius:var(--r);padding:20px;margin-bottom:26px;box-shadow:var(--shadow)}
  .co-ai-wrap .sect-head{margin-bottom:10px;padding:0}
  .co-toolrow{display:flex;align-items:center;gap:12px;padding:2px 2px 0;flex-wrap:wrap;margin-top:4px}
  .co-ghost-date{background:none;border:none;color:var(--muted);font-size:12.5px;font-family:inherit;color-scheme:dark;cursor:pointer;padding:4px 0;width:112px}
  .co-ghost-date:hover{color:var(--text)}
  .co-ghost-date:focus{outline:none;color:var(--text)}
  .co-sep{color:var(--faint)}
  .co-fathom{display:flex;align-items:center;gap:8px;color:var(--faint)}
  .co-fathom svg{width:13px;height:13px;flex:0 0 13px;stroke:currentColor;fill:none;stroke-width:2}
  .co-fathom input{background:none;border:none;color:var(--muted);font-size:12.5px;width:150px;padding:4px 0;font-family:inherit}
  .co-fathom input:hover{color:var(--text)}
  .co-fathom input:focus{outline:none;color:var(--text)}
  .co-fathom input::placeholder{color:var(--faint)}
  .co-open{color:var(--accent);text-decoration:none;font-size:14px;line-height:1}
  .co-pull-status{font-size:12px;color:var(--muted)}
  .co-pull-status.ok{color:var(--good)}
  .co-cardlist{display:flex;flex-direction:column;gap:7px}
  .co-step{display:flex;align-items:flex-start;gap:13px;padding:11px 14px;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:12px;transition:.13s}
  .co-step:hover{border-color:var(--border);background:rgba(255,255,255,.035)}
  .co-step.done{opacity:.5}
  .co-step.done .co-step-text{text-decoration:line-through;color:var(--muted)}
  .co-step-check{width:21px;height:21px;flex:0 0 21px;border-radius:99px;border:1.5px solid var(--border-2);background:none;color:#08221a;font-size:12px;font-weight:800;display:grid;place-items:center;cursor:pointer;transition:.13s;padding:0;margin-top:1px}
  .co-step.done .co-step-check{background:var(--good);border-color:var(--good)}
  .co-step-check:hover{border-color:var(--good)}
  .co-step-text{flex:1;font-size:13.5px;line-height:1.6}
  .co-step .rm{opacity:0}
  .co-step:hover .rm{opacity:1}
  .co-notes-view{background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:14px;padding:24px 26px;font-size:13.5px;line-height:1.7}
  .cnv-h{font-family:var(--display);font-size:15.5px;font-weight:700;margin:24px 0 8px;letter-spacing:-.01em}
  .cnv-h:first-child{margin-top:0}
  .cnv-sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);margin:16px 0 5px;opacity:.9}
  .cnv-p{margin:6px 0;color:var(--muted)}
  .cnv-b{display:flex;gap:11px;margin:5px 0;color:var(--muted);align-items:flex-start}
  .cnv-dot{width:5px;height:5px;border-radius:99px;background:var(--accent);flex:0 0 auto;margin-top:8px;opacity:.8}
  .cnv-num{font-family:var(--mono);font-size:12px;color:var(--accent);flex:0 0 auto;margin-top:1px}
  .cnv-pin{background:var(--accent-soft);border:1px solid rgba(255,122,71,.28);border-radius:11px;padding:11px 15px;margin:12px 0;color:var(--text);font-size:13px;line-height:1.6}
  .cnv-hr{border:none;border-top:1px solid var(--border);margin:18px 0}
  .cnv-chk{width:16px;height:16px;flex:0 0 16px;border-radius:5px;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:10px;font-weight:800;color:#08221a;margin-top:3px}
  .cnv-chk.on{background:var(--good);border-color:var(--good)}
  .cnv-done{text-decoration:line-through;opacity:.6}
  .mdc{font-family:var(--mono);font-size:.9em;background:rgba(255,255,255,.07);border-radius:5px;padding:1px 6px}
  .cnv-p b,.cnv-b b{color:var(--text)}
  .note-body-view{flex:1;overflow-y:auto;border:none;border-radius:0;background:none;margin:0}
  .co-tk{display:flex;align-items:flex-start;gap:13px;padding:11px 14px;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:12px;transition:.13s}
  .co-tk:hover{border-color:var(--border);background:rgba(255,255,255,.035)}
  .co-tk-dot{width:7px;height:7px;border-radius:99px;background:var(--accent-2);box-shadow:0 0 8px rgba(255,176,46,.5);flex:0 0 auto;margin-top:7px}
  .co-tk-text{flex:1;font-size:13.5px;line-height:1.6}
  .co-tk-del{opacity:0}
  .co-tk:hover .co-tk-del{opacity:1}
  .co-list-card{background:transparent;border:none;box-shadow:none;padding:8px 0 0}
  .co-list-card h3{padding:0 2px}
  .co-list-card .note-row{padding:11px 13px}
  .co-list-card .note-row.co-active{background:rgba(255,255,255,.035);border-color:var(--border)}

  /* ===== VISION MODE ===== */
  #vision-modal{position:fixed;inset:0;z-index:6000;background:#000;overflow:hidden;user-select:none}
  .vm-stage{position:absolute;inset:0;cursor:pointer}
  .vm-bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(48px) brightness(.4) saturate(1.2);animation:vmIn .8s ease both}
  .vm-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform,opacity;filter:drop-shadow(0 20px 60px rgba(0,0,0,.6))}
  .vm-img.kb0{animation:vmIn .8s ease both,kb0 9s ease-out forwards}
  .vm-img.kb1{animation:vmIn .8s ease both,kb1 9s ease-out forwards}
  @keyframes vmIn{from{opacity:0}to{opacity:1}}
  @keyframes kb0{from{transform:scale(1)}to{transform:scale(1.04)}}
  @keyframes kb1{from{transform:scale(1.04)}to{transform:scale(1)}}
  .vm-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 26%,transparent 55%,rgba(0,0,0,.8))}
  .vm-cap{position:absolute;left:6vw;bottom:13vh;max-width:76vw;font-family:var(--display);font-size:clamp(30px,5.5vw,62px);font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.08;text-shadow:0 4px 40px rgba(0,0,0,.7);animation:vmRise .9s .15s ease both;pointer-events:none}
  .vm-goal{position:absolute;left:6.2vw;bottom:8vh;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);animation:vmRise 1.1s .35s ease both;pointer-events:none}
  @keyframes vmRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .vm-x{position:absolute;top:22px;right:26px;z-index:2;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);width:42px;height:42px;border-radius:99px;font-size:22px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
  .vm-x:hover{color:#fff;border-color:rgba(255,255,255,.4)}
  .vm-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);width:48px;height:48px;border-radius:99px;font-size:26px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s;opacity:.5}
  .vm-nav:hover{opacity:1;color:#fff}
  .vm-prev{left:22px}
  .vm-next{right:22px}
  .vm-dots{position:absolute;bottom:3.6vh;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
  .vm-dots span{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.25);transition:.3s}
  .vm-dots span.on{background:var(--accent);box-shadow:0 0 10px rgba(255,122,71,.7);transform:scale(1.3)}
  .vm-textslide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;height:100%;padding:8vw;text-align:center;
    background:
      radial-gradient(75% 60% at 50% 32%,rgba(var(--sc),.16),transparent 68%),
      radial-gradient(50% 40% at 50% 100%,rgba(var(--sc),.07),transparent 70%),
      #050505;
    animation:vmGlow 9s ease-in-out infinite alternate}
  @keyframes vmGlow{from{background-position:0 0,0 0,0 0}to{background-position:0 -30px,0 20px,0 0}}
  .vm-slide-label{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:rgba(var(--sc),.9);font-weight:700;
    padding:8px 20px;border:1px solid rgba(var(--sc),.35);border-radius:99px;background:rgba(var(--sc),.07);
    animation:vmRise .7s ease both}
  .vm-words{max-width:min(88vw,980px);font-family:var(--display);font-size:clamp(28px,4.8vw,58px);font-weight:700;letter-spacing:-.02em;line-height:1.22;color:#fff}
  .vm-words span{opacity:0;display:inline-block;animation:vmWord .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes vmWord{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  @media (max-width:780px){.vm-nav{display:none}.vm-cap{left:7vw;bottom:15vh;max-width:86vw}.vm-goal{left:7.2vw;bottom:10vh}}

  @media (max-width:780px){
    .shell{flex-direction:column}
    .rail{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px}
    .brand{width:100%;padding:4px 8px 8px}
    .navbtn{flex:1 1 28%;justify-content:center;padding:9px}
    .navbtn.active::before{display:none}
    .rail-foot{display:none}
    main{padding:20px}
    .topbar{padding:14px 20px}
  }

  /* ===== HABITS v2 ===== */
  .h2-hero{display:flex;gap:34px;align-items:center;flex-wrap:wrap;
    background:radial-gradient(120% 120% at 100% 0,rgba(255,122,71,.13),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));
    border:1px solid var(--border-2);padding:30px}
  .h2-ring{width:168px;height:168px;flex:0 0 168px}
  .h2-ring .pct b{font-size:44px}
  .h2-hero-info{flex:1;min-width:220px}
  .h2-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .h2-remaining{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.1}
  .h2-remsub{font-size:14px;color:var(--muted)}
  .chip.hb-chip-lg b.gold{color:var(--gold)}

  .h2-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .h2-card{position:relative;overflow:hidden;text-align:left;font-family:inherit;cursor:pointer;
    background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);
    border-radius:16px;padding:18px;transition:transform .16s,border-color .16s,box-shadow .16s;display:flex;flex-direction:column;gap:6px}
  .h2-card:hover{transform:translateY(-3px);border-color:var(--hc);box-shadow:0 10px 28px rgba(0,0,0,.3)}
  .h2-card-top{display:flex;justify-content:space-between;align-items:center}
  .h2-icon{font-size:26px;line-height:1}
  .h2-pts{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);padding:4px 10px;border-radius:99px}
  .h2-name{font-size:16.5px;font-weight:700;color:var(--text);letter-spacing:-.01em}
  .h2-status{font-size:11.5px;color:var(--faint)}
  .h2-cta{margin-top:10px}
  .h2-card.done{border-color:var(--good);background:linear-gradient(180deg,var(--good-soft),var(--bg-2));box-shadow:0 0 0 1px rgba(52,211,153,.25),0 8px 26px rgba(52,211,153,.12)}
  .h2-card.done .h2-pts{color:var(--good);background:var(--good-soft)}
  .h2-card.done .h2-name{color:var(--good)}

  .h2-card.pop{animation:h2pop .42s cubic-bezier(.2,1.4,.3,1)}
  @keyframes h2pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
  .pt-float{position:fixed;z-index:9999;pointer-events:none;font-family:var(--mono);font-weight:800;font-size:22px;color:var(--good);
    text-shadow:0 0 14px rgba(52,211,153,.6);transform:translate(-50%,0);animation:ptfly .9s ease-out forwards}
  @keyframes ptfly{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

  .h2-week{display:flex;gap:10px;justify-content:space-between}
  .h2-day{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;border-radius:10px;transition:.13s}
  .h2-day:hover:not(:disabled){background:rgba(255,255,255,.04)}
  .h2-day:disabled{opacity:.35;cursor:default}
  .h2-day-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-2);background:var(--bg);transition:.2s}
  .h2-day.part .h2-day-dot{background:var(--warn);border-color:var(--warn)}
  .h2-day.hit .h2-day-dot{background:var(--accent);border-color:var(--accent)}
  .h2-day.perfect .h2-day-dot{background:linear-gradient(135deg,var(--good),#6ff0bd);border-color:var(--good);box-shadow:0 0 12px rgba(52,211,153,.5)}
  .h2-day.istoday .h2-day-dot{box-shadow:0 0 0 3px var(--accent-soft)}
  .h2-day.sel .h2-day-dot{outline:2px solid var(--accent);outline-offset:2px}
  .h2-day-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
  .h2-day-detail:not(:empty){margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .h2-dd-head{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .h2-dd-head b{color:var(--text);font-family:var(--mono)}
  .h2-dd-list{display:flex;flex-wrap:wrap;gap:7px}
  .h2-dd-pill{font-size:11.5px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--faint)}
  .h2-dd-pill.on{color:var(--good);background:var(--good-soft);border-color:rgba(52,211,153,.3)}

  .h2-lib{display:flex;flex-direction:column;gap:2px}
  .h2-lib-row{display:flex;align-items:center;gap:13px;padding:12px 8px;border-radius:11px;cursor:pointer;transition:background .12s}
  .h2-lib-row:hover{background:rgba(255,255,255,.035)}
  .h2-lib-icon{font-size:20px}
  .h2-lib-main{flex:1;min-width:0}
  .h2-lib-name{font-size:14.5px;font-weight:600;margin-bottom:6px}
  .h2-lib-week{display:flex;gap:5px}
  .h2-mini{width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--border)}
  .h2-mini.on{background:var(--hc);border-color:var(--hc)}
  .h2-lib-streak{font-family:var(--mono);font-size:12px;color:var(--gold)}
  .h2-lib-chev{color:var(--faint);font-size:18px}

  .h2-detail-hero{display:flex;align-items:center;gap:18px;border:1px solid var(--border-2);
    background:linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-detail-icon{font-size:40px}
  .h2-detail-name{background:none;border:1px solid transparent;border-radius:8px;font-size:22px;font-weight:800;color:var(--text);width:100%;padding:4px 8px;letter-spacing:-.02em}
  .h2-detail-name:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  .h2-detail-sub{font-size:12.5px;color:var(--muted);margin-top:4px;padding-left:8px}
  .h2-detail-sub b{color:var(--text);font-family:var(--mono)}
  .h2-heat{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
  .h2-heat-cell{aspect-ratio:1;border-radius:4px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:.12s}
  .h2-heat-cell:hover{transform:scale(1.25);border-color:var(--border-2)}

  /* ===== DRAG ===== */
  .drag-grip{color:var(--faint);font-size:14px;cursor:grab;opacity:0;transition:opacity .12s;flex:0 0 auto;line-height:1;user-select:none}
  .h2-lib-row:hover .drag-grip,.mo-line:hover .drag-grip,.et-row:hover .drag-grip{opacity:.5}
  .drag-grip:active{cursor:grabbing}
  .dragging{opacity:.4}
  .vcard{cursor:grab}
  .vcard:active{cursor:grabbing}

  @media (max-width:600px){
    .h2-cards{grid-template-columns:1fr 1fr}
    .h2-hero{padding:22px;gap:22px}
    .h2-ring{width:130px;height:130px;flex:0 0 130px}
    .h2-ring .pct b{font-size:34px}
    .h2-remaining{font-size:27px}
    .h2-heat{grid-template-columns:repeat(10,1fr)}
    .drag-grip{opacity:.45}
  }




  /* ===== PROJECTS v2 ===== */
  .proj-stack{display:flex;flex-direction:column;gap:10px}
  .proj-block{border:1px solid var(--border);border-radius:13px;background:var(--bg);overflow:hidden;transition:border-color .14s}
  .proj-block:hover{border-color:var(--border-2)}
  .proj-block.collapsed{background:none}
  .proj-head{display:flex;align-items:center;gap:11px;padding:12px 13px}
  .proj-info{flex:1;min-width:0}
  .proj-name-inp{width:100%;background:none;border:1px solid transparent;border-radius:7px;color:var(--text);
    font-family:var(--sans);font-size:14.5px;font-weight:600;padding:4px 7px;margin-bottom:6px;transition:.12s}
  .proj-name-inp:hover{border-color:var(--border)}
  .proj-name-inp:focus{outline:none;border-color:var(--accent);background:var(--bg-2)}
  .proj-track{height:5px;background:var(--bg-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-left:7px}
  .proj-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .proj-count{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;white-space:nowrap}
  .proj-collapse{flex-shrink:0}
  .proj-del-btn{opacity:0;flex-shrink:0;font-size:17px}
  .proj-head:hover .proj-del-btn{opacity:.45}
  .proj-del-btn:hover{opacity:1;color:var(--bad)}
  .proj-body{padding:0 13px 11px}
  .proj-list{border-top:1px solid var(--border);padding-top:5px}
  .proj-empty{padding:12px 4px;font-size:12.5px;border-top:1px solid var(--border)}
  .proj-done-toggle{background:none;border:none;color:var(--faint);font-family:inherit;font-size:11.5px;
    cursor:pointer;padding:8px 4px;text-align:left;width:100%;transition:color .12s}
  .proj-done-toggle:hover{color:var(--muted)}
  .proj-done-list{opacity:.6;padding-bottom:4px}
  .addrow.proj-add{margin-top:8px}
  .addrow.proj-add input{background:none;border:1px dashed var(--border);font-size:13px;padding:9px 11px}
  .addrow.proj-add input:hover{border-color:var(--border-2)}
  .addrow.proj-add input:focus{border-style:solid;border-color:var(--accent);background:var(--bg-2)}
  .addrow.proj-new{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

  /* task rows */
  .et-name{cursor:text;border-radius:5px;padding:1px 4px;margin-left:-4px;transition:background .12s}
  .et-row:hover .et-name{background:rgba(255,255,255,.04)}
  .et-rename{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--accent);border-radius:7px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:5px 8px;width:100%}
  .et-rename:focus{outline:none}
  .et-actions{opacity:.35;transition:opacity .13s}
  .et-row:hover .et-actions,.et-row:focus-within .et-actions{opacity:1}
  .et-iconbtn.act-focus:hover{border-color:var(--accent-2);color:var(--accent-2)}
  .et-iconbtn.act-next:hover{border-color:var(--teal);color:var(--teal)}
  .et-status-tag.focus{background:var(--accent-soft);color:var(--accent)}
  .et-hint{font-size:11px;margin-top:10px;color:var(--muted)}
  .et-hint.warn{color:var(--warn)}
  .et-projsel{cursor:pointer}
  .et-projsel:hover{border-color:var(--accent);color:var(--text)}

  /* toast */
  .et-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10001;
    display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:11px;
    background:var(--card-hi);border:1px solid var(--border-2);box-shadow:0 12px 40px rgba(0,0,0,.55);
    font-size:13px;color:var(--text);animation:toastIn .18s cubic-bezier(.2,.9,.3,1);max-width:min(440px,92vw)}
  .et-toast.warn{border-color:rgba(251,191,36,.4);color:var(--warn)}
  .et-toast-undo{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
  .et-toast-undo:hover{text-decoration:underline}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  /* ===== EMOJI PICKER ===== */
  .icon-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;
    font-size:19px;line-height:1;padding:0;width:38px;height:38px;display:inline-grid;place-items:center;
    transition:.14s;flex:0 0 38px;position:relative}

    color:var(--muted);font-weight:600;flex-shrink:0}

  .ep-item{background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;

  .ep-item:hover{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.18)}
  .ep-foot{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
