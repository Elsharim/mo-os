  .proj-body{padding:0 13px 11px}
  .proj-list{border-top:1px solid var(--border);padding-top:5px}
  .proj-empty{padding:12px 4px;font-size:12.5px;border-top:1px solid var(--border)}
  .proj-done-toggle{background:none;border:none;color:var(--faint);font-family:inherit;font-size:11.5px;
    cursor:pointer;padding:8px 4px;text-align:left;width:100%;transition:color .12s}
  .proj-done-toggle:hover{color:var(--muted)}
  .proj-done-list{opacity:.6;padding-bottom:4px}
  .addrow.proj-add{margin-top:8px}
  .addrow.proj-add input{background:none;border:1px dashed var(--border);font-size:13px;padding:9px 11px}
  .addrow.proj-add input:hover{border-color:var(--border-2)}
  .addrow.proj-add input:focus{border-style:solid;border-color:var(--accent);background:var(--bg-2)}
  .addrow.proj-new{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

  /* task rows */
  .et-name{cursor:text;border-radius:5px;padding:1px 4px;margin-left:-4px;transition:background .12s}
  .et-row:hover .et-name{background:rgba(255,255,255,.04)}
  .et-rename{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--accent);border-radius:7px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:5px 8px;width:100%}
  .et-rename:focus{outline:none}
  .et-actions{opacity:.35;transition:opacity .13s}
  .et-row:hover .et-actions,.et-row:focus-within .et-actions{opacity:1}
  .et-iconbtn.act-focus:hover{border-color:var(--accent-2);color:var(--accent-2)}
  .et-iconbtn.act-next:hover{border-color:var(--teal);color:var(--teal)}
  .et-status-tag.focus{background:var(--accent-soft);color:var(--accent)}
  .et-hint{font-size:11px;margin-top:10px;color:var(--muted)}
  .et-hint.warn{color:var(--warn)}
  .et-projsel{cursor:pointer}
  .et-projsel:hover{border-color:var(--accent);color:var(--text)}

  /* toast */
  .et-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10001;
    display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:11px;
    background:var(--card-hi);border:1px solid var(--border-2);box-shadow:0 12px 40px rgba(0,0,0,.55);
    font-size:13px;color:var(--text);animation:toastIn .18s cubic-bezier(.2,.9,.3,1);max-width:min(440px,92vw)}
  .et-toast.warn{border-color:rgba(251,191,36,.4);color:var(--warn)}
  .et-toast-undo{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
  .et-toast-undo:hover{text-decoration:underline}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  /* ===== EMOJI PICKER ===== */
  .icon-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;
    font-size:19px;line-height:1;padding:0;width:38px;height:38px;display:inline-grid;place-items:center;
    transition:.14s;flex:0 0 38px;position:relative}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .icon-btn::after{content:"▾";position:absolute;right:2px;bottom:0;font-size:8px;color:var(--faint);line-height:1}
  .icon-btn:hover::after{color:var(--accent)}
  .proj-icon.icon-btn{width:34px;height:34px;flex:0 0 34px;font-size:18px;background:none;border-color:transparent}
  .proj-head:hover .proj-icon.icon-btn{border-color:var(--border)}
  .proj-icon.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  .emoji-pop{position:fixed;z-index:10000;width:300px;max-height:360px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);
    border-radius:14px;box-shadow:0 20px 56px rgba(0,0,0,.62);overflow:hidden;
    animation:epIn .14s cubic-bezier(.2,.9,.3,1)}
  @keyframes epIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .ep-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;flex-shrink:0}
  .ep-close{background:none;border:none;color:var(--faint);font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
  .ep-close:hover{color:var(--bad)}
  .ep-body{flex:1;overflow-y:auto;padding:12px 14px}
  .ep-body::-webkit-scrollbar{width:7px}
  .ep-body::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .ep-group{margin-bottom:14px}
  .ep-group:last-child{margin-bottom:0}
  .ep-group-name{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-bottom:7px}
  .ep-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .ep-item{background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;
    font-size:16px;line-height:1;padding:0;aspect-ratio:1;display:grid;place-items:center;transition:.1s}
  .ep-item:hover{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.18)}
  .ep-foot{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
  .ep-custom{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:8px 11px;font-size:13px;color:var(--text);text-align:center}
  .ep-custom:focus{outline:none;border-color:var(--accent)}
  .ep-custom::placeholder{color:var(--faint);font-size:12px}
  /* ===== WEEK: DAYS KEPT ===== */
  .h2-pace{border:1px solid var(--border-2);padding:24px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-pace::before{content:"";position:absolute;inset:0 0 auto;height:3px}
  .h2-pace.good::before,.h2-pace.secured::before{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .h2-pace.open::before{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .h2-pace.critical::before{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .h2-pace.blown::before{background:var(--border-2)}

  .h2-wk-top{margin-bottom:20px}
  .h2-wk-count{display:flex;align-items:baseline;gap:8px;line-height:1}
  .h2-wk-n{font-size:56px;font-weight:800;font-family:var(--mono);letter-spacing:-.05em}
  .h2-pace.secured .h2-wk-n,.h2-pace.good .h2-wk-n{color:var(--good)}
  .h2-pace.critical .h2-wk-n{color:var(--warn)}
  .h2-wk-of{font-size:22px;font-family:var(--mono);color:var(--faint);font-weight:600}
  .h2-wk-cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:9px}

  .h2-wk-track{display:flex;gap:8px;margin-bottom:20px}
  .h2-wk-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
  .h2-wk-mark{width:100%;height:42px;border-radius:10px;display:grid;place-items:center;
    font-size:15px;font-weight:800;border:1.5px solid var(--border);background:var(--bg);
    color:var(--faint);transition:.2s}
  .h2-wk-day.kept .h2-wk-mark{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .h2-wk-day.lost .h2-wk-mark{background:rgba(255,255,255,.02);border-color:var(--border);color:var(--faint);opacity:.5}
  .h2-wk-day.future .h2-wk-mark{border-style:dashed;opacity:.35}
  .h2-wk-day.today .h2-wk-mark{border-color:var(--accent);border-width:2px;box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent)}
  .h2-wk-day.today.kept .h2-wk-mark{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
  .h2-wk-dl{font-size:10.5px;font-weight:700;color:var(--muted)}
  .h2-wk-day.today .h2-wk-dl{color:var(--accent)}
  .h2-wk-day.kept .h2-wk-dl{color:var(--good)}

  .h2-wk-msg{font-size:13.5px;line-height:1.5;color:var(--muted);padding-top:16px;border-top:1px solid var(--border)}
  .h2-wk-msg b{color:var(--text)}
  .h2-wk-msg.secured b,.h2-wk-msg.good b{color:var(--good)}
  .h2-wk-msg.blown b{color:var(--muted)}

  .h2-wk-today{padding-top:16px;border-top:1px solid var(--border)}
  .h2-wk-today-k{font-size:15px;font-weight:700;letter-spacing:-.01em;font-family:var(--mono)}
  .h2-wk-today-k span{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--faint);margin-left:6px}
  .h2-wk-today-s{font-size:12px;color:var(--muted);margin-top:4px}
  .h2-wk-cap-note{text-transform:none;letter-spacing:.02em;color:var(--faint);font-weight:500}
  .h2-wk-plan-lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-top:15px;margin-bottom:9px}
  .h2-wk-plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .h2-wk-chip.extra{border-style:dashed;color:var(--muted)}
  .h2-wk-chip.extra b{color:var(--muted)}
  .h2-wk-chip.extra:hover{border-style:solid;color:var(--text)}
  .h2-wk-more{background:none;border:none;color:var(--faint);font-family:inherit;font-size:11.5px;
    cursor:pointer;padding:9px 6px;transition:color .12s;white-space:nowrap}
  .h2-wk-more:hover{color:var(--accent);text-decoration:underline}
  .h2-wk-chip{display:inline-flex;align-items:center;gap:9px;font-family:inherit;cursor:pointer;
    font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:10px;color:var(--text);
    background:var(--bg);border:1px solid var(--border-2);transition:.14s}
  .h2-wk-chip b{font-family:var(--mono);font-size:11.5px;color:var(--good);font-weight:700}
  .h2-wk-chip:hover{border-color:var(--good);background:var(--good-soft);transform:translateY(-2px)}
  .h2-wk-none{font-size:12px;color:var(--faint)}
  @media (max-width:600px){
    .h2-pace{padding:20px}
    .h2-wk-n{font-size:44px}
    .h2-wk-mark{height:36px}
    .h2-wk-chip{flex:1;justify-content:space-between}
  }

  /* ===== PROJECTS v2 ===== */
  .proj-stack{display:flex;flex-direction:column;gap:10px}
  .proj-block{border:1px solid var(--border);border-radius:13px;background:var(--bg);overflow:hidden;transition:border-color .14s}
  .proj-block:hover{border-color:var(--border-2)}
  .proj-block.collapsed{background:none}
  .proj-head{display:flex;align-items:center;gap:11px;padding:12px 13px}
  .proj-info{flex:1;min-width:0}
  .proj-name-inp{width:100%;background:none;border:1px solid transparent;border-radius:7px;color:var(--text);
    font-family:var(--sans);font-size:14.5px;font-weight:600;padding:4px 7px;margin-bottom:6px;transition:.12s}
  .proj-name-inp:hover{border-color:var(--border)}
  .proj-name-inp:focus{outline:none;border-color:var(--accent);background:var(--bg-2)}
  .proj-track{height:5px;background:var(--bg-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-left:7px}
  .proj-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .proj-count{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;white-space:nowrap}
  .proj-collapse{flex-shrink:0}
  .proj-del-btn{opacity:0;flex-shrink:0;font-size:17px}
  .proj-head:hover .proj-del-btn{opacity:.45}
  .proj-del-btn:hover{opacity:1;color:var(--bad)}
  .proj-body{padding:0 13px 11px}
  .proj-list{border-top:1px solid var(--border);padding-top:5px}
  .proj-empty{padding:12px 4px;font-size:12.5px;border-top:1px solid var(--border)}
  .proj-done-toggle{background:none;border:none;color:var(--faint);font-family:inherit;font-size:11.5px;
    cursor:pointer;padding:8px 4px;text-align:left;width:100%;transition:color .12s}
  .proj-done-toggle:hover{color:var(--muted)}
  .proj-done-list{opacity:.6;padding-bottom:4px}
  .addrow.proj-add{margin-top:8px}
  .addrow.proj-add input{background:none;border:1px dashed var(--border);font-size:13px;padding:9px 11px}
  .addrow.proj-add input:hover{border-color:var(--border-2)}
  .addrow.proj-add input:focus{border-style:solid;border-color:var(--accent);background:var(--bg-2)}
  .addrow.proj-new{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

  /* task rows */
  .et-name{cursor:text;border-radius:5px;padding:1px 4px;margin-left:-4px;transition:background .12s}
  .et-row:hover .et-name{background:rgba(255,255,255,.04)}
  .et-rename{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--accent);border-radius:7px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:5px 8px;width:100%}
  .et-rename:focus{outline:none}
  .et-actions{opacity:.35;transition:opacity .13s}
  .et-row:hover .et-actions,.et-row:focus-within .et-actions{opacity:1}
  .et-iconbtn.act-focus:hover{border-color:var(--accent-2);color:var(--accent-2)}
  .et-iconbtn.act-next:hover{border-color:var(--teal);color:var(--teal)}
  .et-status-tag.focus{background:var(--accent-soft);color:var(--accent)}
  .et-hint{font-size:11px;margin-top:10px;color:var(--muted)}
  .et-hint.warn{color:var(--warn)}
  .et-projsel{cursor:pointer}
  .et-projsel:hover{border-color:var(--accent);color:var(--text)}

  /* toast */
  .et-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10001;
    display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:11px;
    background:var(--card-hi);border:1px solid var(--border-2);box-shadow:0 12px 40px rgba(0,0,0,.55);
    font-size:13px;color:var(--text);animation:toastIn .18s cubic-bezier(.2,.9,.3,1);max-width:min(440px,92vw)}
  .et-toast.warn{border-color:rgba(251,191,36,.4);color:var(--warn)}
  .et-toast-undo{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
  .et-toast-undo:hover{text-decoration:underline}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  /* ===== EMOJI PICKER ===== */
  .icon-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;
    font-size:19px;line-height:1;padding:0;width:38px;height:38px;display:inline-grid;place-items:center;
    transition:.14s;flex:0 0 38px;position:relative}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .icon-btn::after{content:"▾";position:absolute;right:2px;bottom:0;font-size:8px;color:var(--faint);line-height:1}
  .icon-btn:hover::after{color:var(--accent)}
  .proj-icon.icon-btn{width:34px;height:34px;flex:0 0 34px;font-size:18px;background:none;border-color:transparent}
  .proj-head:hover .proj-icon.icon-btn{border-color:var(--border)}
  .proj-icon.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  .emoji-pop{position:fixed;z-index:10000;width:300px;max-height:360px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);
    border-radius:14px;box-shadow:0 20px 56px rgba(0,0,0,.62);overflow:hidden;
    animation:epIn .14s cubic-bezier(.2,.9,.3,1)}
  @keyframes epIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .ep-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;flex-shrink:0}
  .ep-close{background:none;border:none;color:var(--faint);font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
  .ep-close:hover{color:var(--bad)}
  .ep-body{flex:1;overflow-y:auto;padding:12px 14px}
  .ep-body::-webkit-scrollbar{width:7px}
  .ep-body::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .ep-group{margin-bottom:14px}
  .ep-group:last-child{margin-bottom:0}
  .ep-group-name{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-bottom:7px}
  .ep-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .ep-item{background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;
    font-size:16px;line-height:1;padding:0;aspect-ratio:1;display:grid;place-items:center;transition:.1s}
  .ep-item:hover{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.18)}
  .ep-foot{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
  .ep-custom{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:8px 11px;font-size:13px;color:var(--text);text-align:center}
  .ep-custom:focus{outline:none;border-color:var(--accent)}
  .ep-custom::placeholder{color:var(--faint);font-size:12px}
  /* ===== WEEK PACE ===== */
  .h2-pace{border:1px solid var(--border-2);position:relative;overflow:hidden;padding:24px}
  .h2-pace::before{content:"";position:absolute;inset:0 0 auto;height:3px;opacity:.9}
  .h2-pace.ahead::before,.h2-pace.locked::before{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .h2-pace.behind::before{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .h2-pace.lost::before{background:linear-gradient(90deg,var(--bad),#f5915e)}
  .h2-pace.ahead,.h2-pace.locked{background:radial-gradient(130% 140% at 100% 0,rgba(52,211,153,.09),transparent 60%),linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-pace.behind{background:radial-gradient(130% 140% at 100% 0,rgba(251,191,36,.09),transparent 60%),linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-pace.lost{background:radial-gradient(130% 140% at 100% 0,rgba(248,113,113,.08),transparent 60%),linear-gradient(150deg,var(--card-hi),var(--card))}

  .h2-pace-grid{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
  .h2-pace-eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .h2-pace-avg{font-size:52px;font-weight:800;font-family:var(--mono);letter-spacing:-.045em;line-height:1;margin:8px 0 9px}
  .h2-pace-avg span{font-size:22px;color:var(--muted);margin-left:1px;letter-spacing:0}
  .h2-pace-delta{font-size:12.5px;font-weight:600;font-family:var(--mono);display:inline-flex;align-items:center;gap:6px}
  .h2-pace-delta.up{color:var(--good)}
  .h2-pace-delta.down{color:var(--warn)}
  .h2-pace.lost .h2-pace-delta.down{color:var(--bad)}

  .h2-pace-side{flex-shrink:0}
  .h2-pace-callout{text-align:right;padding:13px 17px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--border-2);min-width:132px}
  .h2-pace-callout.locked{background:var(--good-soft);border-color:rgba(52,211,153,.35)}
  .h2-pace-callout.lost{background:var(--bad-soft);border-color:rgba(248,113,113,.3)}
  .h2-pc-n{font-family:var(--mono);font-size:29px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--text)}
  .h2-pc-n span{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
  .h2-pace-callout.locked .h2-pc-n{font-size:21px;color:var(--good)}
  .h2-pace-callout.lost .h2-pc-n{color:var(--bad)}
  .h2-pc-l{font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:.02em}

  .h2-pace-bars{position:relative;display:flex;gap:9px;margin-bottom:20px}
  .h2-pb{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .h2-pb-col{height:84px;display:flex;align-items:flex-end;background:var(--bg);border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .h2-pb-fill{width:100%;border-radius:0 0 6px 6px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
  .h2-pb.good .h2-pb-fill{background:linear-gradient(180deg,var(--good),#2fb87d)}
  .h2-pb.under .h2-pb-fill{background:linear-gradient(180deg,var(--warn),#d99a2e)}
  .h2-pb.zero .h2-pb-fill{background:var(--border-2)}
  .h2-pb.future .h2-pb-col{border-style:dashed;opacity:.45}
  .h2-pb-lbl{text-align:center;font-size:10px;color:var(--muted);font-weight:600;margin-top:7px}
  .h2-pb.now .h2-pb-lbl{color:var(--accent);font-weight:800}
  .h2-pb.now .h2-pb-col{border-color:var(--accent)}
  .h2-pace-line{position:absolute;left:0;right:0;top:calc(84px - (84px * 0.8));height:0;border-top:1px dashed var(--border-2);pointer-events:none;z-index:2}
  .h2-pace-line span{position:absolute;right:-2px;top:-15px;font-size:9px;font-family:var(--mono);color:var(--faint);background:var(--card-hi);padding:1px 5px;border-radius:4px;border:1px solid var(--border)}

  .h2-pace-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-top:17px;border-top:1px solid var(--border)}
  .h2-ps{display:flex;flex-direction:column;gap:4px;min-width:0}
  .h2-ps b{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:-.015em;color:var(--text);white-space:nowrap}
  .h2-ps-of{font-size:12px;color:var(--faint);font-weight:500}
  .h2-ps span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:500}
  @media (max-width:640px){
    .h2-pace{padding:20px}
    .h2-pace-grid{flex-direction:column;gap:16px}
    .h2-pace-side{width:100%}
    .h2-pace-callout{text-align:left;min-width:0}
    .h2-pace-avg{font-size:42px}
    .h2-pace-stats{grid-template-columns:1fr 1fr;gap:16px}
  }
  /* ===== CARD STATE CLARITY ===== */
  .h2-card{border-width:1.5px}
  .h2-card .h2-icon{filter:grayscale(.55);opacity:.72;transition:.18s}
  .h2-card.done .h2-icon{filter:none;opacity:1}
  .h2-cta-btn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
    padding:7px 13px;border-radius:8px;border:1px solid var(--border-2);color:var(--text);background:rgba(255,255,255,.05);transition:.14s}
  .h2-card:hover .h2-cta-btn{border-color:var(--hc);color:var(--hc);background:rgba(255,255,255,.08)}
  .h2-cta-btn.undo{border-color:transparent;background:none;color:var(--faint);padding-left:0;font-weight:500}
  .h2-card.done:hover .h2-cta-btn.undo{color:var(--muted);background:none;border-color:transparent}
  .h2-card.done .h2-status{color:var(--good);font-weight:600}
  .h2-card.done .h2-pts{color:var(--good);background:var(--good-soft);border-color:rgba(52,211,153,.35)}
  .h2-check{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,var(--good),#6ff0bd);display:grid;place-items:center;
    box-shadow:0 2px 10px rgba(52,211,153,.45);animation:h2check .3s cubic-bezier(.2,1.5,.4,1)}
  .h2-check svg{width:12px;height:12px;stroke:#04121a;stroke-width:3.4;fill:none}
  @keyframes h2check{0%{transform:scale(0) rotate(-45deg)}100%{transform:scale(1) rotate(0)}}
  .h2-card.done .h2-card-top .h2-pts{margin-right:30px}

  /* ===== EDITABLE DAY DETAIL ===== */
  .h2-dd-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted);margin-bottom:4px}
  .h2-dd-head b{color:var(--text);font-family:var(--mono);font-size:14px}
  .h2-dd-hint{font-size:11px;color:var(--faint);margin-bottom:12px}
  .h2-dd-pill{display:inline-flex;align-items:center;gap:8px;font-family:inherit;cursor:pointer;
    font-size:12.5px;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.04);
    border:1px solid var(--border);color:var(--muted);transition:.13s}
  .h2-dd-pill:hover{border-color:var(--border-2);color:var(--text);transform:translateY(-1px)}
  .h2-dd-pill.on{color:var(--good);background:var(--good-soft);border-color:rgba(52,211,153,.35);font-weight:600}
  .h2-dd-pill.on:hover{border-color:var(--good)}
  .h2-dd-pts{font-family:var(--mono);font-size:10.5px;opacity:.65}
  .h2-day{position:relative}
  .h2-day:hover:not(:disabled) .h2-day-dot{transform:scale(1.12)}

  /* ===== DATED HEATMAP ===== */
  .h2-heat{display:grid;grid-template-columns:repeat(13,1fr);gap:6px}
  .h2-heat-cell{position:relative;aspect-ratio:1;border-radius:7px;background:var(--bg);
    border:1px solid var(--border);cursor:pointer;transition:.12s;display:grid;place-items:center;
    padding:0;font-family:var(--mono);overflow:visible}
  .h2-heat-cell:hover{transform:scale(1.12);border-color:var(--border-2);z-index:3}
  .h2-heat-num{font-size:10.5px;color:var(--faint);font-weight:500;transition:.12s;line-height:1}
  .h2-heat-cell.on .h2-heat-num{color:#04121a;font-weight:700;opacity:.85}
  .h2-heat-cell.monthstart{border-color:var(--border-2)}
  .h2-heat-mon{position:absolute;top:-13px;left:0;font-size:8.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);font-family:var(--sans);font-weight:700;white-space:nowrap}
  .h2-heat-cell.istoday{box-shadow:0 0 0 2px var(--accent)}
  .h2-heat-cell.istoday .h2-heat-num{color:var(--accent);font-weight:700}
  .h2-heat-cell.on.istoday .h2-heat-num{color:#04121a}
  .h2-heat-legend{display:flex;gap:16px;margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
  .h2-heat-key{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--faint)}
  .h2-heat-swatch{width:12px;height:12px;border-radius:4px;background:var(--bg);border:1px solid var(--border)}
  @media (max-width:600px){
    .h2-heat{grid-template-columns:repeat(7,1fr);gap:7px}
    .h2-heat-num{font-size:11px}
  }

  /* ===== WEEK (merged pace + strip) ===== */
  .card.wk{border:1px solid var(--border-2);padding:24px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--card-hi),var(--card))}
  .card.wk::before{content:"";position:absolute;inset:0 0 auto;height:2px;opacity:.75}
  .card.wk.ahead::before,.card.wk.secured::before{background:var(--good)}
  .card.wk.behind::before{background:var(--warn)}
  .card.wk.lost::before{background:var(--bad)}

  .wk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}
  .wk-cap{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .wk-fig{display:flex;align-items:baseline;gap:7px;margin:9px 0 7px;line-height:1}
  .wk-n{font-family:var(--mono);font-size:44px;font-weight:800;letter-spacing:-.045em}
  .card.wk.ahead .wk-n,.card.wk.secured .wk-n{color:var(--good)}
  .card.wk.behind .wk-n{color:var(--warn)}
  .card.wk.lost .wk-n{color:var(--bad)}
  .wk-of{font-family:var(--mono);font-size:19px;color:var(--faint);font-weight:600}
  .wk-note{font-size:12.5px;color:var(--muted)}
  .wk-pace{text-align:right;flex-shrink:0}
  .wk-pace b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em}
  .wk-pace span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

  .wk-meter{height:6px;background:var(--bg);border:1px solid var(--border);border-radius:99px;
    overflow:hidden;margin-bottom:20px}
  .wk-meter-f{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .card.wk.ahead .wk-meter-f,.card.wk.secured .wk-meter-f{background:var(--good)}
  .card.wk.behind .wk-meter-f{background:var(--warn)}
  .card.wk.lost .wk-meter-f{background:var(--bad)}

  .wk-days{display:flex;gap:8px}
  .wk-d{flex:1;min-width:0;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:7px}
  .wk-d:disabled{cursor:default}
  .wk-d-bar{width:100%;height:58px;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    display:flex;align-items:flex-end;overflow:hidden;transition:.14s}
  .wk-d-fill{width:100%;transition:height .6s cubic-bezier(.2,.8,.2,1)}
  .wk-d.perfect .wk-d-fill{background:linear-gradient(180deg,var(--good),#2fb87d)}
  .wk-d.good .wk-d-fill{background:var(--accent)}
  .wk-d.weak .wk-d-fill{background:var(--warn)}
  .wk-d.zero .wk-d-fill{background:var(--border-2)}
  .wk-d.future .wk-d-bar{border-style:dashed;opacity:.35}
  .wk-d:hover:not(:disabled) .wk-d-bar{border-color:var(--border-2)}
  .wk-d.istoday .wk-d-bar{border-color:var(--accent)}
  .wk-d.sel .wk-d-bar{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .wk-d-v{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;min-height:14px}
  .wk-d-l{font-size:10px;font-weight:700;color:var(--faint)}
  .wk-d.istoday .wk-d-l,.wk-d.istoday .wk-d-v{color:var(--accent)}
  @media(max-width:600px){
    .card.wk{padding:20px}
    .wk-top{flex-direction:column;gap:12px}
    .wk-pace{text-align:left}
    .wk-n{font-size:36px}
    .wk-d-bar{height:46px}
  }

  /* =====================================================================
     POLISH LAYER v3: calm surfaces, sentence-case type, less chrome.
     Appended last so it cleanly overrides the earlier layered rules.
     ===================================================================== */
  :root{
    --bg:#08080a;
    --surface:rgba(255,255,255,.028);
    --surface-hi:rgba(255,255,255,.052);
    --hair:rgba(255,255,255,.066);
    --hair-2:rgba(255,255,255,.12);
    --r:20px;--r-sm:12px;
  }
  body{background:
      radial-gradient(75% 45% at 50% -14%,rgba(255,122,71,.065),transparent 62%),
      radial-gradient(45% 35% at 100% 0%,rgba(255,176,46,.03),transparent 60%),
      var(--bg);
    font-size:14.5px}

  /* shell */
  .rail{background:rgba(255,255,255,.012);border-right:1px solid var(--hair);padding:24px 14px}
  .brand{padding:4px 10px 28px}
  .brand .mark{background:#18181c;border:1px solid var(--hair-2);color:#f5f5f7;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border-radius:10px;font-weight:700;font-family:var(--display)}
  .brand .sub{text-transform:none;letter-spacing:.01em;font-size:11.5px;color:var(--faint)}
  .navbtn{padding:10px 12px;border-radius:11px;font-size:14px;color:var(--faint)}
  .navbtn:hover{background:var(--surface);color:var(--text)}
  .navbtn.active{background:var(--surface-hi);color:var(--text);box-shadow:inset 0 0 0 1px var(--hair)}
  .navbtn.active::before{display:none}
  .navbtn.active svg{stroke:var(--accent)}
  .topbar{border-bottom:none;background:none;padding:24px 44px 4px}
  .topbar .hi .greet-hey{display:none}
  .topbar .clock{font-size:14px;font-weight:500;color:var(--muted)}
  .topbar .date{text-transform:none;letter-spacing:0;font-size:12px;color:var(--faint)}
  main{padding:20px 44px 110px;max-width:1120px}

  /* page head */
  .head{margin-bottom:30px;align-items:center}
  h2.sec{font-size:32px;letter-spacing:-.035em;line-height:1.1}
  .sec-sub{font-size:14px;color:var(--faint);margin-top:8px}

  /* surfaces: soft, no heavy drop shadow */
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:24px 26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
  .grid{gap:18px}

  /* type: real sentence-case headings instead of tiny caps labels */
  .card h3{font-family:var(--display);font-size:16px;letter-spacing:-.015em;text-transform:none;color:var(--text);font-weight:600;margin:0 0 18px}
  .card h3 .h3sub{font-family:var(--sans);font-size:12.5px;color:var(--faint);font-weight:400;letter-spacing:0}
  .sect-head,.sect-toggle{font-family:var(--display);font-size:16px;letter-spacing:-.015em;text-transform:none;color:var(--text);font-weight:600}
  .sect-head span{font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:400}
  .jr-month,.jwc-cap,.mo-goal-cap,.mo-goal-cd span,.ap-head,.ns-cap,.lens-cap,.lens-horizon,.gl-ms-cap,.gl-first-cap,.gl-sixcap,.gl-log-date,.htc-edit-lbl,.htc-arrow,.ht-sect,.bn-result-cap,.mpanel-head,.ep-group-name,.tk-today-h,.tk-top3-h{text-transform:none;letter-spacing:0}
  .jr-month{font-size:13px;color:var(--muted);font-weight:600;margin:30px 0 8px}
  .lens-name{text-transform:none;letter-spacing:-.01em;font-family:var(--display);font-size:15px}

  /* buttons: hairline ghost by default, one confident primary */
  .btn{background:transparent;border:1px solid var(--hair-2);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:500;color:var(--text)}
  .btn:hover{background:var(--surface-hi);border-color:rgba(255,255,255,.2)}
  .btn.solid{background:linear-gradient(135deg,#ff8350,#ffa83c);border:none;color:#1c0e06;font-weight:600;box-shadow:0 8px 24px -8px rgba(255,122,71,.6)}
  .btn.solid:hover{filter:brightness(1.05);background:linear-gradient(135deg,#ff8350,#ffa83c)}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:9px}

  /* inputs */
  .inp,.addrow input{background:var(--surface);border:1px solid var(--hair);border-radius:12px}
  .inp:focus,.addrow input:focus{border-color:rgba(255,122,71,.5);box-shadow:0 0 0 4px rgba(255,122,71,.08)}

  /* special cards (re-declared after .card so they keep their character) */
  .mo-goal{background:radial-gradient(110% 150% at 0 0,rgba(255,122,71,.15),transparent 55%),radial-gradient(70% 90% at 100% 100%,rgba(255,176,46,.07),transparent 60%),var(--surface);border:1px solid rgba(255,122,71,.16);border-radius:24px;padding:32px 34px}
  .mo-goal-cap{font-size:13px;font-weight:600;color:var(--accent)}
  .mo-goal-cd{background:rgba(255,122,71,.07);border:1px solid rgba(255,122,71,.2);border-radius:18px}
  .mo-goal-cd span{font-size:12px;color:var(--muted)}
  .mo-vision{background:radial-gradient(110% 110% at 0 0,rgba(251,191,36,.05),transparent 55%),var(--surface);border:1px solid var(--hair)}
  .headtrash-launch{background:linear-gradient(115deg,rgba(226,75,74,.07),transparent 42%),var(--surface);border:1px solid var(--hair)}
  .ns-card{background:linear-gradient(180deg,rgba(255,122,71,.06),rgba(255,122,71,.012));border:1px solid rgba(255,122,71,.2)}

  /* vision board: text-only tiles compact and editorial */
  .vcard{border:1px solid var(--hair);border-radius:16px;box-shadow:none}
  .vcard .vimg.noimg{aspect-ratio:16/10;background:radial-gradient(120% 120% at 0 0,rgba(255,122,71,.09),transparent 60%),rgba(255,255,255,.02)}
  .vcard .vimg.noimg svg{display:none}
  .vcard .vimg.noimg .vcap{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--text)}

  /* journal: entries as clean full-width rows */
  .jr-tabs{background:var(--surface);border:1px solid var(--hair);border-radius:12px}
  .jr-tab{border-radius:9px}
  .jr-tab.active{background:var(--surface-hi);box-shadow:none}
  .jr-write-cta{background:radial-gradient(120% 150% at 0 0,rgba(255,122,71,.13),transparent 58%),var(--surface);border:1px solid rgba(255,122,71,.16);border-radius:24px;padding:30px 32px;box-shadow:none}
  .jwc-cap{font-size:13px;font-weight:600;color:var(--accent)}
  .jr-cards{grid-template-columns:1fr;gap:2px}
  .jr-card{background:none;border:1px solid transparent;border-radius:12px;padding:13px 14px}
  .jr-card:hover{background:var(--surface);border-color:var(--hair)}
  .jr-card-title{font-weight:500;font-size:14.5px}
  .jr-card-day{color:var(--faint);opacity:1}

  /* tasks */
  .tk-capture{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:none;padding:8px 8px 8px 18px}
  .tk-capture:focus-within{border-color:rgba(255,122,71,.45);box-shadow:0 0 0 4px rgba(255,122,71,.07)}
  .tk-today-h{font-family:var(--display);font-size:16px;color:var(--text);font-weight:600}
  .tk-today-h span{font-family:var(--sans)}
  .tk-top3-card{border-radius:16px}
  .tk-fchip{border-color:var(--hair)}
  .et-row:hover{background:var(--surface)}

  /* goals lenses */
  .lens{background:var(--surface);border-color:var(--hair);border-top:2px solid var(--lc)}

  /* vision videos */
  .vcard .vimg-wrap video{width:100%;height:100%;object-fit:cover;display:block;background:#0c0c0e}
  .vcard .vvideo{position:absolute;top:9px;right:73px;z-index:2;background:rgba(10,11,15,.75);border:none;border-radius:7px;width:26px;height:26px;color:#fff;font-size:12px;cursor:pointer;backdrop-filter:blur(4px)}
  .vcard .vvideo:hover{background:rgba(10,11,15,.9)}
  .vm-vid{background:#000}

  /* lock screen mark: match the white M icon */
  .lk-mark{background:#18181c;border:1px solid var(--hair-2);color:#f5f5f7;box-shadow:0 10px 40px rgba(0,0,0,.5);font-family:var(--display);font-weight:700}

  @media (max-width:760px){
    main{padding:16px 18px 110px}
    .topbar{padding:16px 18px 2px}
    .topbar .clock,.topbar .date{display:none}
    h2.sec{font-size:26px}
    .head > div:last-child{flex-wrap:wrap}
    .card{padding:20px}
    .mo-goal,.jr-write-cta{padding:24px}
  }
  /* TODAY CARD (Morning) + BODY page: live data from Whoop / Hevy / calendar / food */
  .tday{margin-bottom:16px;padding:26px 28px}
  .tday-date{font-size:12.5px;color:var(--faint)}
  .tday-say{font-size:16px;line-height:1.6;color:var(--text);margin:8px 0 0;max-width:780px;letter-spacing:-.005em}
  .tday-say b{font-weight:600}
  .tday-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .ts{padding:16px 18px 15px;border-left:1px solid var(--hair);min-width:0}
  .ts:first-child{border-left:none;padding-left:0}
  .ts-k{font-size:11.5px;color:var(--faint)}
  .ts-v{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.035em;margin-top:5px;line-height:1.05;white-space:nowrap;color:var(--tv,var(--text))}
  .ts-v small{font-size:13px;color:var(--faint);font-weight:500;letter-spacing:0;margin-left:3px}
  .ts-s{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ts-bar{height:3px;border-radius:3px;background:var(--hair);margin-top:9px;overflow:hidden;max-width:160px}
  .ts-bar b{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .tday-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;margin-top:20px}
  .tday-cap{font-size:12px;color:var(--faint);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .tday-cap a{color:var(--faint);cursor:pointer;text-decoration:none}.tday-cap a:hover{color:var(--text)}
  .sch{display:flex;gap:14px;align-items:baseline;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--hair)}
  .sch:last-child{border-bottom:none}
  .sch-t{font-family:var(--mono);font-size:12px;color:var(--muted);width:58px;flex:none}
  .sch-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sch.past{opacity:.38}
  .sch.next .sch-t{color:var(--accent)}
  .sch-b{font-size:11px;color:var(--accent);flex:none}
  .t3{display:flex;gap:11px;align-items:center;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--hair);cursor:pointer}
  .t3:last-child{border-bottom:none}
  .t3 i{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--hair-2);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px;color:#1c0e06}
  .t3.done i{background:var(--good);border-color:var(--good)}
  .t3.done span{color:var(--faint);text-decoration:line-through}
  .t3:hover i{border-color:var(--good)}
  .tday-empty{font-size:13px;color:var(--faint);padding:8px 0}
  .tday-connect{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border:1px dashed var(--hair-2);border-radius:16px;color:var(--muted);font-size:13px;margin-bottom:16px}
  .rec-red{--tv:#f87171}.rec-amber{--tv:#fbbf24}.rec-green{--tv:#34d399}
  .iconbtn{width:38px;padding:9px 0;text-align:center}
  @media (max-width:900px){.tday-stats{grid-template-columns:1fr 1fr}.ts:nth-child(3){border-left:none;padding-left:0}.ts:nth-child(n+3){border-top:1px solid var(--hair)}.tday-cols{grid-template-columns:1fr;gap:18px}}

  .bd-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-12px 0 10px}
  .bd-period{font-size:13px;color:var(--muted);margin:0 0 18px}
  .bd-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .bd-tab{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--hair);background:transparent;cursor:pointer}
  .bd-tab:hover{color:var(--text);background:var(--surface)}
  .bd-tab.on{background:var(--surface-hi);color:var(--text);border-color:var(--hair-2)}
  .bd-range{display:flex;border:1px solid var(--hair);border-radius:10px;padding:3px;gap:2px}
  .bd-range button{background:transparent;border:none;color:var(--faint);font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .bd-range button:hover{color:var(--text)}
  .bd-range button.on{background:var(--surface-hi);color:var(--text)}
  .bd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .bd-big{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:6px;color:var(--tv,var(--text))}
  .bd-big small{font-size:14px;color:var(--faint);font-weight:500;letter-spacing:0;margin-left:4px}
  .bd-cap{font-size:12px;color:var(--faint)}
  .bd-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
  .bd-goal{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:end;padding:18px 20px}
  .bd-goal .bd-cap{grid-column:1/-1}
  .bd-goal .bd-big{margin-top:2px}
  .bd-goal .pct{font-size:12.5px;color:var(--muted);padding-bottom:5px}
  .bd-goal .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--hair);overflow:hidden;margin-top:6px}
  .bd-goal .bar b{display:block;height:100%;border-radius:4px;background:var(--gc,var(--accent))}
  .ch{position:relative}
  .ch svg{width:100%;height:auto;display:block;overflow:visible}
  .ch text{fill:var(--faint);font-size:8.5px;font-family:var(--mono)}
  .ch .grid line{stroke:rgba(255,255,255,.055)}
  .ch .tgt{stroke:rgba(255,255,255,.3);stroke-dasharray:3 4}
  .ch .avgl{stroke:rgba(255,176,46,.55);stroke-dasharray:2 3}
  .ch text.lbl{fill:var(--muted);font-size:8px}
  .ch text.lbl.avg{fill:rgba(255,176,46,.85)}
  .ch text.val{fill:var(--text);font-size:9px;font-weight:600;font-family:var(--sans)}
  .ch text.now{fill:var(--text);font-weight:600}
  .ch text.fut{fill:rgba(255,255,255,.22)}
  .ch .grid line{stroke:rgba(255,255,255,.08)}
  .ch rect.b{transition:opacity .12s}
  .ch rect.b:hover,.ch circle.p:hover{opacity:.75;cursor:default}
  .ch-tip{position:absolute;pointer-events:none;background:#1a1a1e;border:1px solid var(--hair-2);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--text);white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .ch-tip small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
  .ch-legend{display:flex;gap:14px;font-size:11.5px;color:var(--faint);margin-top:8px}
  .ch-legend i{display:inline-block;width:14px;border-top:2px dashed rgba(255,255,255,.35);vertical-align:middle;margin-right:5px}
  .ch-legend i.a{border-color:rgba(255,176,46,.7)}
  .bd-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .bd-mini .card{padding:16px 18px}
  .bd-mini h4{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between}
  .bd-mini h4 b{color:var(--text);font-weight:600}
  .bd-rows .r{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:10px 0;border-top:1px solid var(--hair);font-size:13px;align-items:baseline}
  .bd-rows .r:first-child{border-top:none}
  .bd-rows .r .d{color:var(--faint);font-family:var(--mono);font-size:12px}
  .bd-rows .r .m{color:var(--muted);font-size:12.5px;text-align:right;white-space:nowrap}
  .bd-rows .r .x{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
  .bd-rows .r.meal{padding:13px 0}.bd-rows .r.meal .m b{color:var(--text);font-weight:600;font-size:14px}
  .bd-empty{color:var(--faint);font-size:13px;padding:6px 0;line-height:1.6}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
  .cgrid i{aspect-ratio:1;border-radius:3px;background:var(--hair);display:block}
  .cgrid i.on{background:var(--good)}
  .cgrid i.today{outline:1px solid var(--hair-2)}
  .cgrid-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:8px}
  .lift-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .lift-pick button{background:transparent;border:1px solid var(--hair);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .lift-pick button.on{background:var(--surface-hi);color:var(--text);border-color:var(--hair-2)}
  .macro{display:flex;height:8px;border-radius:8px;overflow:hidden;background:var(--hair);margin:10px 0 8px}
  .macro b{display:block;height:100%}
  .macro-k{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .macro-k i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
  @media (max-width:900px){.bd-stats{grid-template-columns:1fr 1fr}.bd-mini{grid-template-columns:1fr}.bd-rows .r{grid-template-columns:84px 1fr auto}}
  /* TASKS + DAY TIMELINE */
  .tk-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
  @media (max-width:980px){.tk-layout{grid-template-columns:1fr}}
  .tl{position:sticky;top:12px}

<script>
/* ============================================================
   PERSONAL OS
   Sales = live from Poppy Firebase (poppy/log:Mo, field v = JSON string)
   Everything else = local via window.storage
   ============================================================ */
const FIREBASE = {
  config:{
    apiKey:"AIzaSyCYCt9-opphzCOSInAaPnrGIBN8M6kWW-Y",
    authDomain:"poppy-sales.firebaseapp.com",
    projectId:"poppy-sales",
    storageBucket:"poppy-sales.firebasestorage.app",
    messagingSenderId:"575070387533",
    appId:"1:575070387533:web:8971533228a1e60caf8b04"
  },
  collection:"poppy",
  doc:"log:Mo",
  field:"v",
  trackerUrl:"https://poppysales.netlify.app/"
};

const STORE_KEY='os:v1';
const OS_DOC={collection:"poppy",doc:"os:Mo",field:"v"};
const _mem={};
let _fbDb=null;
async function fbInit(){
  if(_fbDb)return _fbDb;
  const base='https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/';
  if(!window.firebase){
    await loadScript(base+'firebase-app-compat.js');
    await loadScript(base+'firebase-firestore-compat.js');

  _fbDb=firebase.firestore();
  return _fbDb;
}
/* end-to-end encryption: data is AES-encrypted before it leaves the browser */
let cryptoKey=null,encAtRest=false;
const ENC='enc1:';
function b64e(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64d(str){const s=atob(str);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function deriveKey(pin,pepper){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin+':'+pepper),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('mo-os-v1'),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function restoreKey(){
  try{
    const raw=localStorage.getItem('os:key');
    if(!raw)return null;
    cryptoKey=await crypto.subtle.importKey('raw',b64d(raw),{name:'AES-GCM'},true,['encrypt','decrypt']);
    return cryptoKey;
  }catch(e){return null;}
}
async function stashKey(){try{localStorage.setItem('os:key',b64e(await crypto.subtle.exportKey('raw',cryptoKey)));}catch(e){}}
async function encStr(str){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(str));
  return ENC+b64e(iv)+':'+b64e(ct);
}
async function decStr(v){
  const p=v.slice(ENC.length).split(':');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[0])},cryptoKey,b64d(p[1]));
  return new TextDecoder().decode(pt);
}
const store={
  async get(k){
    try{
      const db=await fbInit();
      const doc=await db.collection(OS_DOC.collection).doc(OS_DOC.doc).get();
      setSyncStatus('live');
      if(doc.exists){
        const v=doc.data()[OS_DOC.field];
        if(v!=null){
          if(String(v).startsWith(ENC)){
            encAtRest=true;
            if(!cryptoKey)return '__LOCKED__';
            try{const pt=await decStr(v);_mem[k]=pt;return pt;}
            catch(e){return '__BADKEY__';}
          }
          _mem[k]=v;return v;
        }
      }
    }catch(e){console.warn('store.get failed',e);setSyncStatus('error');}
    return _mem[k]??null;
  },
  async set(k,v){
    _mem[k]=v;
    try{
      let out=v;
      if(cryptoKey)out=await encStr(v);
      else if(encAtRest){console.warn('locked, write skipped');return;}
      const db=await fbInit();
      await db.collection(OS_DOC.collection).doc(OS_DOC.doc).set({[OS_DOC.field]:out});
      setSyncStatus('live');
    }catch(e){console.warn('store.set failed',e);setSyncStatus('error');}
  }
};

/* vision images uploaded from device: each lives (encrypted) in its own doc, since the main doc caps at 1MB */
const _imgCache={};
const imgDocId=id=>'osimg:Mo:'+id;
async function putImage(id,dataUrl){
  const db=await fbInit();
  const out=cryptoKey?await encStr(dataUrl):dataUrl;
  await db.collection(OS_DOC.collection).doc(imgDocId(id)).set({v:out});
  _imgCache[id]=dataUrl;
}
async function getImage(id){
  if(_imgCache[id])return _imgCache[id];
  const db=await fbInit();
  const doc=await db.collection(OS_DOC.collection).doc(imgDocId(id)).get();
  if(!doc.exists)return null;
  let v=doc.data().v;
  if(String(v).startsWith(ENC))v=await decStr(v);
  return _imgCache[id]=v;
}
async function delImage(id){delete _imgCache[id];try{const db=await fbInit();await db.collection(OS_DOC.collection).doc(imgDocId(id)).delete();}catch(e){}}
function shrinkImage(file,max=1400){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      let q=.85,d=c.toDataURL('image/jpeg',q);
      while(d.length>550000&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q);}
      res(d);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That file is not an image'));};
    im.src=u;
  });
}
function pickImage(){
  return new Promise(res=>{
    const f=document.createElement('input');f.type='file';f.accept='image/*';
    f.onchange=()=>res(f.files&&f.files[0]||null);f.click();
  });
}
/* turn share-page links into direct image links */
function fixImgUrl(u){
  u=(u||'').trim();let m;
  if((m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/)))return 'https://lh3.googleusercontent.com/d/'+m[1];
  if(/dropbox\.com\//.test(u))return /[?&]dl=0/.test(u)?u.replace(/dl=0/,'raw=1'):u+(u.includes('?')?'&':'?')+'raw=1';
  return u;
}
function visionImg(v){return v.imgRef?(_imgCache[v.imgRef]||null):(v.img?fixImgUrl(v.img):null);}

/* vision videos: encrypted in the browser, stored in Vercel Blob (api/media.js), cached per device */
const VIDEO_MAX=75*1024*1024;
const _vidCache={},_vidPending={};
const isVideoLink=u=>/\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(u||'');
async function stashMediaSecret(pepper){
  try{
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pepper),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode('mo-os-media-v1')));
    localStorage.setItem('os:media',[...sig].map(b=>b.toString(16).padStart(2,'0')).join(''));
  }catch(_){}
}
function mediaSecret(){try{return localStorage.getItem('os:media');}catch(_){return null;}}
async function ensureMediaSecret(){
  if(mediaSecret())return mediaSecret();
  await new Promise(res=>showLock('enter',res)); // confirm once per device, then it's remembered
  return mediaSecret();
}
function pickVideo(){
  return new Promise(res=>{
    const f=document.createElement('input');f.type='file';f.accept='video/*';
    f.onchange=()=>res(f.files&&f.files[0]||null);f.click();
  });
}
async function encBytes(buf){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,buf));
  const out=new Uint8Array(12+ct.length);out.set(iv,0);out.set(ct,12);return out;
}
let _blobMod=null;
async function blobUpload(){if(!_blobMod)_blobMod=await import('https://esm.sh/@vercel/blob@2.8.0/client');return _blobMod.upload;}
function videoURL(v){
  const vid=v&&v.vid;if(!vid)return Promise.resolve(null);
  if(vid.link)return Promise.resolve(fixImgUrl(vid.link));
  if(_vidCache[vid.url])return Promise.resolve(_vidCache[vid.url]);
  if(_vidPending[vid.url])return _vidPending[vid.url];
  return _vidPending[vid.url]=(async()=>{
    try{
      let buf=null,cache=null;
      try{if('caches' in window){cache=await caches.open('mo-vid');const hit=await cache.match(vid.url);if(hit)buf=await hit.arrayBuffer();}}catch(_){}
      if(!buf){
        const r=await fetch(vid.url);if(!r.ok)throw new Error('fetch '+r.status);
        if(cache){try{await cache.put(vid.url,r.clone());}catch(_){}}
        buf=await r.arrayBuffer();
      }
      const u8=new Uint8Array(buf);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.subarray(0,12)},cryptoKey,u8.subarray(12));

async function delVideo(vid){

  const sec=mediaSecret();if(!sec)return;
  try{await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',url:vid.url,secret:sec})});}catch(_){}
}
async function uploadVisionVideo(item,btn){

  const label=btn.textContent;btn.disabled=true;
  try{
    const secret=await ensureMediaSecret();
    if(!secret)throw new Error('could not verify this device, try again online');
    btn.textContent='Encrypting…';
    const sealed=await encBytes(await file.arrayBuffer());
    const upload=await blobUpload();
    const name='vision/v'+Date.now()+Math.random().toString(36).slice(2,6)+'.bin';
    const r=await upload(name,new Blob([sealed],{type:'application/octet-stream'}),{
      access:'public',handleUploadUrl:'/api/media',clientPayload:secret,contentType:'application/octet-stream',
      multipart:sealed.length>8*1024*1024,onUploadProgress:p=>{btn.textContent=Math.round(p.percentage)+'%';}
    });
    const vid={url:r.url,type:file.type||'video/mp4',size:file.size};

function makeSortable(container,rowSel,onDrop){
  if(!container)return;
  let dragEl=null;
  container.querySelectorAll(rowSel).forEach(row=>{
    row.draggable=true;
    row.addEventListener('dragstart',e=>{dragEl=row;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','');}catch(_){}});
    row.addEventListener('dragend',()=>{
      row.classList.remove('dragging');
      const ids=[...container.querySelectorAll(rowSel)].map(r=>r.dataset.id);
      dragEl=null;onDrop(ids);
    });
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||dragEl===row)return;
      const r=row.getBoundingClientRect();
      const after=(e.clientY-r.top)/r.height>.5;
      container.insertBefore(dragEl,after?row.nextSibling:row);
    });
  });
}

/* MARKDOWN VIEW */
function mdInline(t){
  let h=esc(t);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/__([^_]+)__/g,'<b>$1</b>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
  h=h.replace(/`([^`]+)`/g,'<code class="mdc">$1</code>');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h;
}
function coNotesViewHtml(txt){
  return txt.split(/\n/).map(l=>{
    const t=l.trim();
    if(!t)return'';
    if(/^📌/.test(t))return `<div class="cnv-pin">${mdInline(t.replace(/^📌\s*/,''))}</div>`;
    if(/^#{1,2}\s/.test(t))return `<div class="cnv-h">${mdInline(t.replace(/^#+\s*/,''))}</div>`;
    if(/^#{3,5}\s/.test(t))return `<div class="cnv-sub">${mdInline(t.replace(/^#+\s*/,''))}</div>`;
    const chk=t.match(/^[-*]\s+\[([ xX])\]\s+(.*)/);
    if(chk)return `<div class="cnv-b"><span class="cnv-chk ${chk[1].trim()?'on':''}">${chk[1].trim()?'✓':''}</span><span class="${chk[1].trim()?'cnv-done':''}">${mdInline(chk[2])}</span></div>`;
    if(/^\d+\.\d+/.test(t))return `<div class="cnv-sub">${mdInline(t)}</div>`;
    const mNum=t.match(/^(\d+)\.\s+(.*)/);
    if(mNum){
      if(t.length<=60)return `<div class="cnv-h">${mdInline(t)}</div>`;
      return `<div class="cnv-b"><span class="cnv-num">${mNum[1]}</span><span>${mdInline(mNum[2])}</span></div>`;
    }
    if(/^>\s+/.test(t))return `<div class="cnv-pin">${mdInline(t.replace(/^>\s+/,''))}</div>`;
    if(/^[-—_]{3,}$/.test(t))return `<hr class="cnv-hr">`;
    if(/^[-•*]\s+/.test(t))return `<div class="cnv-b"><span class="cnv-dot"></span><span>${mdInline(t.replace(/^[-•*]\s+/,''))}</span></div>`;
    if(!/^[a-zA-Z0-9"'(<]/.test(t))return `<div class="cnv-h">${mdInline(t)}</div>`;
    if(t.length<60&&/[:：]$/.test(t))return `<div class="cnv-sub">${mdInline(t)}</div>`;
    return `<p class="cnv-p">${mdInline(t)}</p>`;
  }).join('');
}

  const tk=today();

  return keys.length?keys[keys.length-1]:null;
}
function jrNewKey(){
  const tk=today();
  let k=tk,n=1;
  while(jrData()[k])k=tk+'#'+(++n);
  return k;
}
function jrEntryKeys(){
  const active=jrActiveKey();
  return Object.keys(jrData()).filter(k=>k!==active&&((jrData()[k]||{}).text||'').trim()).sort((a,b)=>b.localeCompare(a));
}
function noteDisplay(n){
  const raw=(n.title||'').trim();
  try{
    const m=raw.match(/^(\p{Extended_Pictographic}(?:‍\p{Extended_Pictographic})*[️]?)\s*(.*)$/u);
    if(m&&m[2])return {icon:m[1],title:m[2]};
  }catch(e){}
  return {icon:noteIcon(n),title:raw||'Untitled'};
}
function noteIcon(n){
  try{if(/^\p{Extended_Pictographic}/u.test((n.title||'').trim()))return '🗒️';}catch(e){}
  const t=((n.title||'')+' '+(n.body||'').slice(0,80)).toLowerCase();
  const map=[[/money|sale|close|revenue|pay|cc\b/,'💰'],[/idea|insight/,'💡'],[/call|phone/,'📞'],[/gym|lift|workout|body|bulk/,'🏋️'],[/girl|date|love/,'❤️'],[/plan|goal|vision/,'🎯'],[/script|write|copy/,'📝'],[/book|read/,'📚'],[/ai|gpt|claude|poppy/,'🤖'],[/food|eat|meal/,'🍽️'],[/trip|travel|flight|spain|dubai/,'✈️']];
  for(const [re,ic] of map)if(re.test(t))return ic;
  const set=['🗒️','🧠','⚡','🌙','🔥','🧭','🌊','🪨'];
  let h=0;for(const c of String(n.id||''))h=(h*31+c.charCodeAt(0))>>>0;
  return set[h%set.length];
}
function noteSnippet(n){const b=(n.body||'').trim().replace(/\s+/g,' ');return b?clip(b,64):'No content yet';}
function noteTime(ts){const d=new Date(ts||Date.now());return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function sortedNotes(){
  const q=noteQuery.trim().toLowerCase();
  let arr=notesData().slice();
  if(q)arr=arr.filter(n=>((n.title||'')+' '+(n.body||'')).toLowerCase().includes(q));
  return arr.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updated||0)-(a.updated||0));
}
function renderJournal(){
  const J=jrData(),tk=today();
  const activeK=jrActiveKey();
  const entry=activeK?J[activeK]:{text:'',title:''};
  const words=(entry.text||'').trim()?entry.text.trim().split(/\s+/).length:0;
  const past=jrEntryKeys();
  const notes=sortedNotes();
  const g=S.goals||{};

  const niceDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});};
  const writePane=`
    <button class="jr-write-cta" id="jr-open-writer">
      <span class="jwc-cap">Today</span>
      <span class="jwc-date">${activeK?(entry.title?esc(entry.title):longDate(tk)):'Start a new entry'}</span>
      <span class="jwc-hint">${activeK?(words?words+' words · keep going →':'start writing →'):'open the page →'}</span>
    </button>
    <div class="sect" style="margin-top:26px">
      <div class="sect-head">
        <button class="sect-toggle" id="jr-past-toggle">${jrPastOpen?'▾':'▸'} Past entries</button>
        <span>${past.length||''}</span>
        <span style="flex:1"></span>
        ${past.length?'<button class="btn btn-sm" id="jr-dl">↓ Download all</button>':''}
      </div>
      ${!jrPastOpen?'':past.length?(()=>{
        const groups=[];let cur=null;
        past.forEach(k=>{
          const [y,m]=jrBase(k).split('-');
          const gk=y+'-'+m;
          if(!cur||cur.gk!==gk){cur={gk,label:new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}),items:[]};groups.push(cur);}
          cur.items.push(k);
        });
        return groups.map((g,gi)=>`
          <div class="jr-month" ${gi===0?'style="margin-top:4px"':''}>${g.label}</div>
          <div class="jr-cards">${g.items.map(k=>{
            const e=J[k];
            const [y,m,d]=jrBase(k).split('-').map(Number);
            const day=new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
            const title=e.title||clip((e.text||'').replace(/^#+\s*/gm,'').trim().split('\n')[0],42)||'Untitled';
            return `<button class="jr-card" data-open-day="${k}">
              <span class="jr-card-top"><span class="jr-card-title">${esc(title)}</span><span class="jr-card-day">${day}</span></span>
            </button>`;
          }).join('')}</div>`).join('');
      })():'<div class="empty sect-empty">No entries yet.</div>'}
    </div>`;

  ensureLenses();
  const GL=goalsList();
  const feat=featuredGoal();
  const activeGoals=GL.filter(x=>!x.done),doneGoals=GL.filter(x=>x.done);
  const goalCard=(gl,idx)=>{
    const gcd=goalDays(gl);
    const ms=glMilestones(gl);
    const col=LENS_COLORS[idx%LENS_COLORS.length];
    return `<div class="lens ${gl.done?'done':''}" data-gid="${gl.id}" style="--lc:${col}">
      <div class="lens-head">
        <input class="lens-name" data-glabel="${gl.id}" value="${esc(gl.label||'')}" placeholder="Lens" spellcheck="false">
        <div class="lens-acts">
          ${!gl.done?`<button class="lens-ico ${feat&&gl.id===feat.id?'on':''}" data-gfeat="${gl.id}" title="Feature in Morning">★</button>`:''}
          <button class="lens-ico" data-gdone="${gl.id}" title="${gl.done?'Reopen':'Mark done'}">${gl.done?'↺':'✓'}</button>
          <button class="lens-ico" data-gdel="${gl.id}" title="Delete lens">×</button>
        </div>
      </div>
      <div class="lens-cap lens-cap-h"><input class="lens-horizon" data-ghorizon="${gl.id}" value="${esc(gl.horizon||'6-month')}" style="width:${((gl.horizon||'6-month').length+2.5)}ch" spellcheck="false" title="Change the timeframe">goal</div>
      <textarea class="lens-goal" data-gtext="${gl.id}" rows="1" placeholder="Specific and quantified">${esc(gl.text||'')}</textarea>
      <div class="lens-target">
        <input type="date" data-gdate="${gl.id}" value="${esc(gl.targetDate||'')}">
        ${gcd!==null?`<span class="lens-cd">${gcd>=0?`<b>${gcd}</b> days left`:`<b>${-gcd}</b> days past`}</span>`:''}
      </div>
      ${gl.done?'':`
      <div class="lens-cap spaced">Milestones</div>
      ${ms.map(m=>`<div class="gl-ms-row ${m.done?'done':''}">
        <button class="gl-ms-check ${m.done?'on':''}" data-mscheck="${gl.id}:${m.id}">${m.done?'✓':''}</button>
        <input class="gl-ms-in" data-mstext="${gl.id}:${m.id}" value="${esc(m.text||'')}" placeholder="Milestone" spellcheck="false">
        <button class="rm gl-ms-del" data-msdel="${gl.id}:${m.id}">×</button>
      </div>`).join('')}
      <div class="gl-ms-add"><input data-msnew="${gl.id}" placeholder="+ Milestone"></div>
      <div class="lens-foot">
        <div class="lens-cap">First step this week</div>
        <input class="lens-first-in" data-gfirst="${gl.id}" value="${esc(gl.firstStep||'')}" placeholder="One physical action" spellcheck="false">
        <input class="lens-when-in" data-gwhen="${gl.id}" value="${esc(gl.firstWhen||'')}" placeholder="When?" spellcheck="false">
        <button class="lens-bn" data-bn="${gl.id}">Find the real first step</button>
      </div>`}
    </div>`;
  };
  const log=goalLog().slice().sort((a,b)=>b.ts-a.ts);
  const goalsPane=`
    <div class="card ns-card">
      <div class="ns-cap">★ North Star</div>
      <textarea class="ns-in" id="ns-in" rows="1" placeholder="What do you want your life to look like and feel like? Not a number, a direction.">${esc(northStar())}</textarea>
    </div>
    <div class="sect">
      <div class="sect-head">Lenses <span>${activeGoals.length||''}</span></div>

      </div>
      ${doneGoals.length?`<div class="sect-head" style="margin-top:22px">Done <span>${doneGoals.length}</span></div><div class="gl-lenses">${doneGoals.map((gl,i)=>goalCard(gl,i)).join('')}</div>`:''}
    </div>
    <div class="sect">
      <div class="sect-head">Goal journal</div>
      <div class="gl-compose">
        <textarea id="gl-entry" class="jr-surface" style="min-height:64px" placeholder="Add an update"></textarea>
        <button class="btn solid btn-sm" id="gl-entry-add">Log</button>
      </div>
      ${log.length?`<div class="gl-timeline">${log.map(e=>`
        <div class="gl-log" data-id="${e.id}">
          <div class="gl-log-head"><span class="gl-log-date">${longDate(keyOf(new Date(e.ts)))}</span><button class="rm gl-log-del" data-id="${e.id}">×</button></div>
          <div class="gl-log-text">${esc(e.text)}</div>

  const notesPane=`
    <div class="sect">
      <div class="sect-head">Notes <span>${notesData().length||''}</span>
        <span style="flex:1"></span>
        <button class="btn btn-sm" id="notes-dl">↓ Download</button>
        <button class="btn solid btn-sm" id="note-new">+ New</button>
      </div>
      <input id="note-search" class="inp note-search" placeholder="Search notes" value="${esc(noteQuery)}" autocomplete="off">
      ${notes.length?`<div class="note-grid">${notes.map(n=>{
        const d=noteDisplay(n);
        return `<button class="note-card" data-id="${n.id}">
          <span class="note-ico">${d.icon}</span>
          <span class="note-main">
            <span class="note-title">${esc(d.title)}</span>
            <span class="note-card-date">${new Date(n.updated||n.created||Date.now()).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>
          </span>
          <span class="note-pin ${n.pinned?'on':''}" data-pin="${n.id}">${n.pinned?'★':'☆'}</span>
        </button>`;}).join('')}</div>`
      :`<div class="empty sect-empty" style="margin-top:12px">${noteQuery?'No matches.':'No notes yet.'}</div>`}
    </div>`;

  main.innerHTML=`<div class="view">
    <div class="head">
      <div><h2 class="sec">Journal</h2></div>
      <div class="jr-tabs">
        ${[['daily','Write'],['goals','Goals'],['notes','Notes']].map(([k,l])=>`<button class="jr-tab ${jrTab===k?'active':''}" data-t="${k}">${l}</button>`).join('')}
      </div>
    </div>
    ${jrTab==='goals'?goalsPane:jrTab==='notes'?notesPane:writePane}
  </div>`;

  main.querySelectorAll('.jr-tab').forEach(b=>b.onclick=()=>{jrTab=b.dataset.t;renderJournal();});

  // write tab
  const cta=document.getElementById('jr-open-writer');
  if(cta)cta.onclick=()=>openWriter(activeK||jrNewKey());
  main.querySelectorAll('[data-open-day]').forEach(b=>b.onclick=()=>openWriter(b.dataset.openDay));
  const jd=document.getElementById('jr-dl');
  if(jd)jd.onclick=exportJournals;
  const jpt=document.getElementById('jr-past-toggle');
  if(jpt)jpt.onclick=()=>{jrPastOpen=!jrPastOpen;renderJournal();};
  const nd=document.getElementById('notes-dl');

  // goals tab
  const glAddLens=document.getElementById('gl-add-lens');
  if(glAddLens)glAddLens.onclick=()=>{
    goalsList().push({id:'g'+Date.now(),label:'',text:'',targetDate:'',setAt:'',done:false,milestones:[],firstStep:'',firstWhen:''});
    save();renderJournal();topbar();
    const names=main.querySelectorAll('.lens-name');const last=names[names.length-1];if(last)last.focus();
  };
  const glFind=id=>goalsList().find(x=>x.id===id);
  main.querySelectorAll('[data-glabel]').forEach(inp=>inp.oninput=()=>{const gl=glFind(inp.dataset.glabel);if(gl){gl.label=inp.value;save();topbar();}});
  main.querySelectorAll('[data-gtext]').forEach(ta=>{
    autosize(ta);
    ta.oninput=()=>{const gl=glFind(ta.dataset.gtext);if(gl){gl.text=ta.value;save();autosize(ta);topbar();}};
  });
  main.querySelectorAll('[data-gdate]').forEach(inp=>inp.onchange=()=>{
    const gl=glFind(inp.dataset.gdate);if(gl){gl.targetDate=inp.value;gl.setAt=today();save();renderJournal();topbar();}
  });
  main.querySelectorAll('[data-gfeat]').forEach(b=>b.onclick=()=>{
    const L=goalsList();const i=L.findIndex(x=>x.id===b.dataset.gfeat);
    if(i>0){const [gl]=L.splice(i,1);L.unshift(gl);save();renderJournal();topbar();}
  });
  main.querySelectorAll('[data-gdone]').forEach(b=>b.onclick=()=>{
    const gl=glFind(b.dataset.gdone);if(gl){gl.done=!gl.done;save();renderJournal();topbar();}
  });
  main.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this lens?'))return;
    S.goalsList=goalsList().filter(x=>x.id!==b.dataset.gdel);save();renderJournal();topbar();
  });
  const nsIn=document.getElementById('ns-in');
  if(nsIn){autosize(nsIn);nsIn.oninput=()=>{S.northStar=nsIn.value;autosize(nsIn);save();topbar();};}
  const msFind=key=>{const [gid,mid]=key.split(':');const gl=glFind(gid);return gl?{gl,m:glMilestones(gl).find(x=>x.id===mid)}:{};};
  main.querySelectorAll('[data-mscheck]').forEach(b=>b.onclick=()=>{const {m}=msFind(b.dataset.mscheck);if(m){m.done=!m.done;save();renderJournal();topbar();}});
  main.querySelectorAll('[data-mstext]').forEach(inp=>inp.oninput=()=>{const {m}=msFind(inp.dataset.mstext);if(m){m.text=inp.value;save();}});
  main.querySelectorAll('[data-msdel]').forEach(b=>b.onclick=()=>{const [gid,mid]=b.dataset.msdel.split(':');const gl=glFind(gid);if(gl){gl.milestones=glMilestones(gl).filter(x=>x.id!==mid);save();renderJournal();}});
  main.querySelectorAll('[data-msnew]').forEach(inp=>inp.onkeydown=e=>{
    if(e.key==='Enter'){const v=inp.value.trim();if(!v)return;const gl=glFind(inp.dataset.msnew);if(gl){glMilestones(gl).push({id:'m'+Date.now(),text:v,done:false});save();renderJournal();topbar();}}
  });
  main.querySelectorAll('[data-ghorizon]').forEach(inp=>inp.oninput=()=>{const gl=glFind(inp.dataset.ghorizon);if(gl){gl.horizon=inp.value;inp.style.width=(inp.value.length+2.5)+'ch';save();}});
  main.querySelectorAll('[data-gfirst]').forEach(inp=>inp.oninput=()=>{const gl=glFind(inp.dataset.gfirst);if(gl){gl.firstStep=inp.value;save();topbar();}});
  main.querySelectorAll('[data-gwhen]').forEach(inp=>inp.oninput=()=>{const gl=glFind(inp.dataset.gwhen);if(gl){gl.firstWhen=inp.value;save();topbar();}});
  main.querySelectorAll('[data-bn]').forEach(b=>b.onclick=()=>openBottleneck(b.dataset.bn));
  const glEntry=document.getElementById('gl-entry'),glAdd=document.getElementById('gl-entry-add');
  if(glEntry&&glAdd){
    autosize(glEntry);glEntry.oninput=()=>autosize(glEntry);
    glAdd.onclick=()=>{const v=glEntry.value.trim();if(!v)return;goalLog().push({id:'gl'+Date.now(),ts:Date.now(),text:v});save();renderJournal();};
  }
  main.querySelectorAll('.gl-log-del').forEach(b=>b.onclick=()=>{S.goalLog=goalLog().filter(x=>x.id!==b.dataset.id);save();renderJournal();});

  // notes tab
  const search=document.getElementById('note-search');
  if(search)search.oninput=()=>{
    noteQuery=search.value;

    const s2=document.getElementById('note-search');if(s2){s2.focus();s2.setSelectionRange(pos,pos);}
  };
  const nn=document.getElementById('note-new');
  if(nn)nn.onclick=()=>{
    const n={id:'n'+Date.now(),title:'',body:'',pinned:false,created:Date.now(),updated:Date.now()};
    notesData().unshift(n);save();openNote(n.id);
  };
  main.querySelectorAll('.note-card').forEach(r=>r.onclick=e=>{
    if(e.target.closest('[data-pin]'))return;
    openNote(r.dataset.id);
  });
  main.querySelectorAll('[data-pin]').forEach(p=>p.onclick=e=>{
    e.stopPropagation();
    const n=notesData().find(x=>x.id===p.dataset.pin);
    if(n){n.pinned=!n.pinned;save();renderJournal();}
  });
}

/* EXPORTS */
function fullDate(k){const [y,m,d]=jrBase(k).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});}
function docShell(title,body){return `<html><head><meta charset="utf-8"><title>${esc(title)}</title>
<style>body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;max-width:660px;margin:44px auto;color:#1a1a1a;line-height:1.6;font-size:14px;padding:0 20px}
.brand{font-size:11px;letter-spacing:4px;color:#ff7a47;font-weight:bold;text-transform:uppercase}
h1{font-size:32px;margin:6px 0 4px;letter-spacing:-1px}
.meta{color:#888;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:0 0 14px}
h2{font-size:20px;margin:0 0 2px}
.hr{border:none;border-top:1px solid #e8e8e8;margin:36px 0}
pre{white-space:pre-wrap;font-family:inherit;font-size:14.5px;margin:0;line-height:1.7}</style></head><body>${body}</body></html>`;}
function dlDoc(name,html){
  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);}
function jrEntryDocHtml(k){
  const e=jrData()[k];
  return `<h2>${esc(e.title||'Untitled')}</h2><div class="meta">${fullDate(k)}</div><pre>${esc((e.text||'').trim())}</pre>`;
}
function jrAllKeys(){return Object.keys(jrData()).filter(k=>((jrData()[k]||{}).text||'').trim()).sort();}
function exportJournals(){
  const keys=jrAllKeys();if(!keys.length)return;
  const body=`<div class="brand">MO OS</div><h1>Journal</h1><div class="meta">${keys.length} entries · exported ${fullDate(today())}</div>`+
    keys.map((k,i)=>(i?'<hr class="hr">':'<div style="margin-top:28px"></div>')+jrEntryDocHtml(k)).join('');
  dlDoc('journal-'+today()+'.doc',docShell('Journal',body));
}
function exportJournalOne(k){
  const e=jrData()[k];if(!e)return;
  dlDoc('journal-'+jrBase(k)+(e.title?'-'+slug(e.title):'')+'.doc',
    docShell(e.title||'Journal entry','<div class="brand">MO OS</div><div style="margin-top:22px"></div>'+jrEntryDocHtml(k)));
}
function noteDocHtml(n){
  return `<h2>${esc(n.title||'Untitled')}</h2><div class="meta">${new Date(n.updated||n.created||Date.now()).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div><pre>${esc((n.body||'').trim())}</pre>`;
}
function exportNotes(){
  const ns=notesData().filter(n=>(n.title||'').trim()||(n.body||'').trim());if(!ns.length)return;
  const body=`<div class="brand">MO OS</div><h1>Notes</h1><div class="meta">${ns.length} notes · exported ${fullDate(today())}</div>`+
    ns.map((n,i)=>(i?'<hr class="hr">':'<div style="margin-top:28px"></div>')+noteDocHtml(n)).join('');
  dlDoc('notes-'+today()+'.doc',docShell('Notes',body));
}
function exportNoteOne(id){
  const n=notesData().find(x=>x.id===id);if(!n)return;
  dlDoc('note-'+(slug(n.title)||id)+'.doc',docShell(n.title||'Note','<div class="brand">MO OS</div><div style="margin-top:22px"></div>'+noteDocHtml(n)));
}

/* IMMERSIVE WRITER */
function openWriter(k){
  const old=document.getElementById('writer-modal');if(old)old.remove();
  const J=jrData();
  const el=document.createElement('div');
  el.id='writer-modal';
  el.innerHTML=`
    <div class="wr-amb">${[1,2,3,4,5,6].map(i=>`<span class="wr-ember e${i}"></span>`).join('')}</div>
    <div class="wr-halo"></div>
    <div class="wr-chrome">
      <span class="wr-count" id="wr-count"></span>
      <button class="wr-icon" id="wr-copy" title="Copy this entry">⧉</button>
      <button class="wr-icon" id="wr-dl" title="Download this entry">↓</button>
      <button class="btn solid" id="wr-done" title="Finish this entry">Finish</button>
      <button class="wr-icon wr-x" id="wr-leave" title="Save and come back later">×</button>
    </div>
    <div class="wr-stage">
      <div class="wr-label">Journal</div>
      <div class="wr-page">
        <div class="wr-page-date">${(()=>{const [y,m,d]=jrBase(k).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});})()}</div>
        <input id="wr-title" class="wr-title" placeholder="Title" value="${esc((J[k]&&J[k].title)||'')}" spellcheck="false" autocomplete="off">
        <div class="wr-rule"></div>
        <textarea id="wr-ta">${esc((J[k]&&J[k].text)||'')}</textarea>
      </div>
    </div>`;
  document.body.appendChild(el);
  const ta=el.querySelector('#wr-ta');
  const ti=el.querySelector('#wr-title');
  const count=el.querySelector('#wr-count');
  const ensure=()=>{if(!J[k])J[k]={text:'',title:'',ts:Date.now()};return J[k];};
  const caretY=()=>{
    let mir=document.getElementById('wr-mirror');
    if(!mir){mir=document.createElement('div');mir.id='wr-mirror';document.body.appendChild(mir);}
    const cs=getComputedStyle(ta);
    ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textTransform','padding'].forEach(p=>mir.style[p]=cs[p]);

    mir.textContent=ta.value.slice(0,ta.selectionStart);
