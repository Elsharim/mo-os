  .tk-areachip{font-size:11px;font-weight:600;margin-left:10px;white-space:nowrap}
  .tk-stale{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:11px;color:var(--gold);background:rgba(255,176,46,.1);border:1px solid rgba(255,176,46,.3);border-radius:99px;padding:2px 9px}
  .tk-stale button{background:none;border:none;color:var(--gold);font-weight:700;font-size:11px;cursor:pointer;padding:0}
  .tk-stale .tk-drop{color:var(--muted)}
  .tk-stale button:hover{text-decoration:underline}
  .tk-row.stale .et-name{color:var(--muted)}
  /* task hub v2 — calmer */
  .tk-today{margin-bottom:24px}
  .tk-today-h{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:11px;display:flex;align-items:baseline;gap:10px}
  .tk-today-h span{font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--faint);font-weight:400}
  .tk-filter{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .tk-fchip{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.13s;font-family:inherit}
  .tk-fchip:hover{border-color:var(--border-2);color:var(--text)}
  .tk-fchip.on{background:rgba(255,255,255,.05);border-color:var(--border-2);color:var(--text)}
  .tk-fchip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .tk-fdot{width:8px;height:8px;border-radius:50%;background:var(--dc,var(--border-2))}
  .tk-fadd{color:var(--faint);font-size:15px;padding:6px 12px}
  .tk-dot{width:12px;height:12px;border-radius:50%;background:none;border:2px solid var(--dc,var(--border-2));cursor:pointer;padding:0;flex:0 0 auto;transition:.13s}
  .tk-dot:hover{transform:scale(1.2)}
  .tk-quiet{margin-top:18px}
  .tk-quiet-h{background:none;border:none;color:var(--faint);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 2px;display:flex;align-items:center;gap:8px}
  .tk-quiet-h:hover{color:var(--muted)}
  .tk-quiet-h span{font-weight:400;font-size:11px;color:var(--faint);opacity:.8}
  .tk-quiet-list{opacity:.7}
  .area-pop{position:fixed;z-index:9500;width:220px;max-height:min(70vh,360px);overflow:auto;background:var(--card);border:1px solid var(--border-2);border-radius:13px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:7px}
  .ap-head{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:6px 9px 4px}
  .ap-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--text);font-family:inherit;font-size:14px;text-align:left;padding:9px;border-radius:9px;cursor:pointer;transition:.1s}
  .ap-row:hover{background:rgba(255,255,255,.05)}
  .ap-row.on{color:var(--accent)}
  .ap-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--dc,var(--border-2));flex:0 0 auto}
  .ap-row.on .ap-dot{background:var(--dc)}
  .ap-edit{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.12s}
  .ap-row:hover .ap-edit{opacity:1}
  .ap-ren,.ap-del{color:var(--faint);font-size:13px;padding:2px 5px;border-radius:5px}
  .ap-ren:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .ap-del:hover{color:var(--bad);background:rgba(255,255,255,.08)}
  .ap-new{color:var(--muted);font-size:13px;margin-top:2px;border-top:1px solid var(--border)}
  /* Morning Top 3 picker */
  .mo-top3 .mt3-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
  @media(max-width:620px){.mo-top3 .mt3-slots{grid-template-columns:1fr}}
  .mt3-slot{display:flex;align-items:center;gap:11px;border-radius:13px;padding:14px 15px;min-height:58px;transition:.14s}
  .mt3-slot:not(.filled){border:1px dashed var(--border-2);background:rgba(255,255,255,.012)}
  .mt3-slot.filled{border:1px solid rgba(255,122,71,.32);background:radial-gradient(130% 130% at 0 100%,rgba(255,122,71,.13),transparent 66%),var(--bg)}
  .mt3-num{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--mono);font-weight:600}
  .mt3-slot:not(.filled) .mt3-num{border:1px dashed var(--border-2);color:var(--faint)}
  .mt3-slot.filled .mt3-num{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a0f0a}
  .mt3-name{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3}
  .mt3-empty{flex:1;color:var(--faint);font-size:13px}
  .mt3-x{background:none;border:none;color:var(--faint);font-size:17px;cursor:pointer;flex:0 0 auto;opacity:0;transition:.12s;line-height:1}
  .mt3-slot.filled:hover .mt3-x{opacity:.7}
  .mt3-x:hover{opacity:1!important}
  .mt3-pickrow{margin-bottom:12px}
  .mt3-pickrow input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:14px;padding:12px 14px}
  .mt3-pickrow input:focus{outline:none;border-color:var(--accent)}
  .mt3-poollbl{font-size:11px;letter-spacing:.03em;color:var(--faint);margin-bottom:9px}
  .mt3-pool{display:flex;flex-wrap:wrap;gap:8px}
  .mt3-chip{display:inline-flex;align-items:center;background:rgba(255,255,255,.025);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:8px 14px;font-size:12.5px;cursor:pointer;transition:.13s;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mt3-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .mt3-none,.mt3-done{color:var(--faint);font-size:13px}

  /* ===== HABITS (simple) ===== */
  .hb-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .hb-score b{font-family:var(--mono);font-size:42px;font-weight:800;letter-spacing:-.03em}
  .hb-score span{font-size:13px;color:var(--faint);margin-left:4px}
  .hb-chips{display:flex;gap:8px}
  .hb-list{display:flex;flex-direction:column;gap:6px}
  .hb-row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);cursor:pointer;padding:14px 16px;border-radius:12px;font-size:14.5px;font-weight:550;transition:.13s;font-family:inherit}
  .hb-row:hover{border-color:var(--border-2)}
  .hb-row.done{background:var(--good-soft);border-color:rgba(52,211,153,.3)}
  .hb-row.done .hb-name{color:var(--muted);text-decoration:line-through}
  .hb-check{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--good);transition:.13s}
  .hb-row.done .hb-check{background:var(--good);color:#08221a;border-color:var(--good)}
  .hb-ico{font-size:18px;flex:0 0 auto}
  .hb-name{flex:1}
  .hb-pts{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .hb-row.done .hb-pts{color:var(--good)}
  .hb-row.edit{cursor:default}
  .hb-name-in{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:13.5px}
  .hb-wt-in{width:52px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 6px;color:var(--text);font-size:13px;text-align:center;font-family:var(--mono)}
  .hb-week{display:flex;gap:10px;align-items:flex-end;justify-content:space-between}
  .hb-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:12px;padding:8px 4px;cursor:pointer;font-family:inherit;transition:.13s}
  .hb-day:disabled{cursor:default}
  .hb-day:not(:disabled):hover{background:rgba(255,255,255,.03);border-color:var(--border)}
  .hb-day.sel{border-color:rgba(255,122,71,.45);background:var(--accent-soft)}
  .hb-day-bar{width:100%;max-width:44px;height:110px;background:var(--card-2);border-radius:9px;display:flex;align-items:flex-end;overflow:hidden}
  .hb-day-fill{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:9px 9px 0 0;transition:height .4s ease}
  .hb-day-fill.perfect{background:linear-gradient(180deg,var(--good),var(--teal))}
  .hb-day-val{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:14px}
  .hb-day-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .hb-day.today .hb-day-lbl{color:var(--accent);font-weight:700}
  .hb-daylabel{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--accent)}
  .hb-cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .hb-cal-dow span{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
  .hb-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .hb-cal-cell{aspect-ratio:1.15;border-radius:9px;background:var(--card-2);border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:11.5px;cursor:pointer;display:grid;place-items:center;transition:.13s;padding:0}
  .hb-cal-cell.blank{background:none;cursor:default}
  .hb-cal-cell.fut{opacity:.3;cursor:default}
  .hb-cal-cell.zero:hover{border-color:var(--border-2)}
  .hb-cal-cell.some{background:rgba(255,122,71,.15)}
  .hb-cal-cell.good{background:rgba(255,122,71,.34);color:#fff}
  .hb-cal-cell.perfect{background:rgba(52,211,153,.25);color:var(--good)}
  .hb-cal-cell.now{border-color:var(--accent)}
  .hb-cal-cell.sel{outline:2px solid var(--accent);outline-offset:1px;color:var(--text)}
  .hb-cal-cell:not(.fut):not(.blank):hover{border-color:var(--border-2)}
  .hb-stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hb-viewing{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid rgba(255,122,71,.3);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--text)}
  .hb-viewing b{color:var(--accent)}
  .hb-viewing-dot{width:7px;height:7px;border-radius:99px;background:var(--accent);box-shadow:0 0 8px rgba(255,122,71,.6);flex:0 0 auto}

  /* write CTA + notes grid */
  .jr-write-cta{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);
    background:radial-gradient(120% 140% at 0 0,rgba(255,122,71,.12),transparent 58%),var(--card);
    border:1px solid var(--border-2);border-radius:var(--r);padding:26px 28px;transition:.15s;box-shadow:var(--shadow)}
  .jr-write-cta:hover{border-color:rgba(255,122,71,.45);transform:translateY(-2px)}
  .jwc-cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .jwc-date{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;letter-spacing:-.02em}
  .jwc-preview{color:var(--muted);font-size:14px;line-height:1.6;max-width:640px}
  .jwc-hint{color:var(--faint);font-size:12px;margin-top:4px}
  .note-search{width:100%;max-width:360px;border-radius:99px;margin-bottom:14px;background:rgba(255,255,255,.03);border-color:transparent;padding:10px 16px}
  .note-search:focus{outline:none;background:var(--bg);border-color:var(--border)}
  .note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
  .note-card{display:flex;align-items:center;gap:13px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:13px;padding:14px 15px;cursor:pointer;font-family:inherit;color:var(--text);transition:.14s}
  .note-card:hover{border-color:rgba(255,122,71,.35);background:rgba(255,255,255,.05);transform:translateY(-1px)}
  .note-ico{font-size:24px;line-height:1;flex:0 0 auto;width:28px;text-align:center}
  .note-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .note-card .note-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;font-weight:600;line-height:1.3}
  .note-card-date{font-size:11.5px;color:var(--faint)}
  .note-card .note-pin{flex:0 0 auto;font-size:15px;line-height:1;color:var(--faint);opacity:.5}
  .note-card:hover .note-pin,.note-card .note-pin.on{opacity:1}
  .note-card .note-pin.on{color:var(--gold)}

  /* immersive writer: a page in a dark room */
  #writer-modal{position:fixed;inset:0;z-index:6000;overflow-y:auto;
    background:
      radial-gradient(85% 60% at 50% 115%,rgba(255,122,71,.22),transparent 64%),
      radial-gradient(55% 45% at 12% 90%,rgba(255,176,46,.09),transparent 70%),
      radial-gradient(50% 40% at 88% 15%,rgba(255,122,71,.07),transparent 70%),
      radial-gradient(120% 90% at 50% -30%,#141416,#060608 72%);
    animation:vmIn .3s ease both}
  .wr-amb{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .wr-ember{position:absolute;bottom:-12px;width:5px;height:5px;border-radius:99px;background:rgba(255,140,80,.55);filter:blur(1.5px);opacity:0;animation:emberUp linear infinite}
  .wr-ember.e1{left:12%;animation-duration:16s;animation-delay:0s}
  .wr-ember.e2{left:28%;animation-duration:21s;animation-delay:5s;width:4px;height:4px}
  .wr-ember.e3{left:47%;animation-duration:18s;animation-delay:9s}
  .wr-ember.e4{left:66%;animation-duration:24s;animation-delay:3s;width:3px;height:3px}
  .wr-ember.e5{left:82%;animation-duration:19s;animation-delay:12s}
  .wr-ember.e6{left:93%;animation-duration:26s;animation-delay:7s;width:4px;height:4px}
  @keyframes emberUp{
    0%{transform:translateY(0) translateX(0);opacity:0}
    8%{opacity:.7}
    60%{opacity:.35}
    100%{transform:translateY(-105vh) translateX(-30px);opacity:0}
  }
  .wr-halo{position:fixed;left:50%;top:52%;width:min(900px,110vw);height:70vh;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,122,71,.09),transparent 70%);
    animation:haloBreathe 7s ease-in-out infinite alternate}
  @keyframes haloBreathe{from{opacity:.5;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
  .wr-chrome{position:fixed;top:18px;right:22px;z-index:3;display:flex;align-items:center;gap:14px}
  .wr-count{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.4)}
  .wr-icon{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);width:36px;height:36px;border-radius:99px;font-size:16px;cursor:pointer;transition:.14s;backdrop-filter:blur(8px);display:grid;place-items:center}
  .wr-icon:hover{color:#fff;border-color:rgba(255,255,255,.4)}
  .wr-x{font-size:22px}

  /* background music */
  .mo-music-btn.on{border-color:rgba(255,122,71,.45);color:var(--accent);background:var(--accent-soft)}
  #music-pill{position:fixed;bottom:20px;right:20px;z-index:5500;display:flex;align-items:center;gap:11px;padding:9px 12px 9px 14px;border-radius:99px;
    background:rgba(18,18,20,.85);border:1px solid var(--border-2);box-shadow:0 8px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px);animation:vmRise .4s ease both}
  .mp-eq{display:flex;align-items:flex-end;gap:2px;height:14px}
  .mp-eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .mp-eq i:nth-child(1){height:6px;animation-delay:0s}
  .mp-eq i:nth-child(2){height:13px;animation-delay:.25s}
  .mp-eq i:nth-child(3){height:9px;animation-delay:.5s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .mp-name{font-size:12px;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .vm-tracks{display:none;flex-direction:column;gap:4px;margin-top:10px;width:220px;background:rgba(10,10,12,.9);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:10px;backdrop-filter:blur(12px)}

  .vm-track{text-align:left;background:none;border:1px solid transparent;color:rgba(255,255,255,.85);cursor:pointer;padding:9px 11px;border-radius:9px;font-size:13px;font-family:inherit;transition:.12s}
  .vm-track:hover{background:rgba(255,255,255,.08)}

  .wr-stage{position:relative;display:flex;flex-direction:column;align-items:center}

    animation:vmRise .7s ease both}

  .wr-page{position:relative;width:min(740px,93vw);min-height:calc(100vh - 190px);margin:22px auto 40vh;

      repeating-linear-gradient(transparent 0px,transparent 35px,rgba(255,255,255,.045) 35px,rgba(255,255,255,.045) 36px);

  /* ===== VISION MODE ===== */
  #vision-modal{position:fixed;inset:0;z-index:6000;background:#000;overflow:hidden;user-select:none}

  .vm-bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(74px) brightness(.28) saturate(1.55);transform:scale(1.1);animation:vmBgDrift 22s ease-in-out infinite alternate,vmIn 1.1s ease both}
  @keyframes vmBgDrift{from{transform:scale(1.1) translate(0,0)}to{transform:scale(1.16) translate(-2%,-1.5%)}}
  .vm-img{position:relative;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:24px;border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 110px rgba(0,0,0,.7),0 10px 34px rgba(0,0,0,.55);will-change:transform,opacity}
  .vm-img.kb0{animation:vmIn 1s ease both,kb0 11s ease-out forwards}
  .vm-img.kb1{animation:vmIn 1s ease both,kb1 11s ease-out forwards}
  @keyframes vmIn{from{opacity:0}to{opacity:1}}
  @keyframes kb0{from{transform:scale(.99)}to{transform:scale(1.03)}}
  @keyframes kb1{from{transform:scale(1.03)}to{transform:scale(.99)}}
  .vm-scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(145% 110% at 50% 36%,transparent 44%,rgba(4,4,6,.62) 90%,rgba(2,2,4,.82)),radial-gradient(60% 48% at 14% 106%,rgba(255,122,71,.06),transparent 62%),radial-gradient(50% 45% at 92% 6%,rgba(120,110,220,.08),transparent 62%),linear-gradient(180deg,rgba(0,0,0,.34),transparent 24%,transparent 56%,rgba(0,0,0,.72))}
  .vm-cap{position:absolute;left:5.6vw;bottom:11.5vh;max-width:72vw;font-family:var(--display);font-size:clamp(26px,3.8vw,46px);font-weight:700;color:#fff;letter-spacing:-.015em;line-height:1.06;text-shadow:0 2px 26px rgba(0,0,0,.5);animation:vmRise .9s .15s ease both;pointer-events:none}
  .vm-cap:empty{display:none}
  .vm-cap::before{content:"";display:block;width:34px;height:2px;border-radius:2px;margin-bottom:18px;background:rgba(255,255,255,.5)}
  .vm-goal{position:absolute;left:5.8vw;bottom:7vh;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600;animation:vmRise 1.1s .35s ease both;pointer-events:none}
  .vm-goal .vm-goal-d{color:rgba(255,255,255,.85);font-weight:700}
  @keyframes vmRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .vm-x{position:absolute;top:22px;right:26px;z-index:2;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);width:42px;height:42px;border-radius:99px;font-size:22px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
  .vm-x:hover{color:#fff;border-color:rgba(255,255,255,.4)}
  .vm-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);width:48px;height:48px;border-radius:99px;font-size:26px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s;opacity:.5}
  .vm-nav:hover{opacity:1;color:#fff}
  .vm-prev{left:22px}
  .vm-next{right:22px}
  .vm-dots{position:absolute;bottom:3.6vh;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
  .vm-dots span{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.25);transition:.3s}
  .vm-dots span.on{background:var(--accent);box-shadow:0 0 10px rgba(255,122,71,.7);transform:scale(1.3)}
  .vm-textslide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;height:100%;padding:8vw;text-align:center;
    background:
      radial-gradient(75% 60% at 50% 32%,rgba(var(--sc),.16),transparent 68%),
      radial-gradient(50% 40% at 50% 100%,rgba(var(--sc),.07),transparent 70%),
      #050505;
    animation:vmGlow 9s ease-in-out infinite alternate}
  @keyframes vmGlow{from{background-position:0 0,0 0,0 0}to{background-position:0 -30px,0 20px,0 0}}
  .vm-slide-label{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:rgba(var(--sc),.9);font-weight:700;
    padding:8px 20px;border:1px solid rgba(var(--sc),.35);border-radius:99px;background:rgba(var(--sc),.07);
    animation:vmRise .7s ease both}
  .vm-words{max-width:min(88vw,980px);font-family:var(--display);font-size:clamp(28px,4.8vw,58px);font-weight:700;letter-spacing:-.02em;line-height:1.22;color:#fff}
  .vm-words span{opacity:0;display:inline-block;animation:vmWord .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes vmWord{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  @media (max-width:780px){.vm-nav{display:none}.vm-cap{left:7vw;bottom:13vh;max-width:86vw;font-size:clamp(24px,7vw,34px)}.vm-cap::before{margin-bottom:12px}.vm-goal{left:7.2vw;bottom:8.5vh}}

  @media (max-width:780px){
    .shell{flex-direction:column}
    .rail{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px}
    .brand{width:100%;padding:4px 8px 8px}
    .navbtn{flex:1 1 28%;justify-content:center;padding:9px}
    .navbtn.active::before{display:none}
    .rail-foot{display:none}
    main{padding:20px}
    .topbar{padding:14px 20px}
  }

  /* ===== HABITS v2 ===== */
  .h2-hero{display:flex;gap:34px;align-items:center;flex-wrap:wrap;
    background:radial-gradient(120% 120% at 100% 0,rgba(255,122,71,.13),transparent 55%),linear-gradient(150deg,var(--card-hi),var(--card));
    border:1px solid var(--border-2);padding:30px}
  .h2-ring{width:168px;height:168px;flex:0 0 168px}
  .h2-ring .pct b{font-size:44px}
  .h2-hero-info{flex:1;min-width:220px}
  .h2-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .h2-remaining{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.1}
  .h2-remsub{font-size:14px;color:var(--muted)}
  .chip.hb-chip-lg b.gold{color:var(--gold)}

  .h2-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .h2-card{position:relative;overflow:hidden;text-align:left;font-family:inherit;cursor:pointer;
    background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border);
    border-radius:16px;padding:18px;transition:transform .16s,border-color .16s,box-shadow .16s;display:flex;flex-direction:column;gap:6px}
  .h2-card:hover{transform:translateY(-3px);border-color:var(--hc);box-shadow:0 10px 28px rgba(0,0,0,.3)}
  .h2-card-top{display:flex;justify-content:space-between;align-items:center}
  .h2-icon{font-size:26px;line-height:1}
  .h2-pts{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);padding:4px 10px;border-radius:99px}
  .h2-name{font-size:16.5px;font-weight:700;color:var(--text);letter-spacing:-.01em}
  .h2-status{font-size:11.5px;color:var(--faint)}
  .h2-cta{margin-top:10px}
  .h2-card.done{border-color:var(--good);background:linear-gradient(180deg,var(--good-soft),var(--bg-2));box-shadow:0 0 0 1px rgba(52,211,153,.25),0 8px 26px rgba(52,211,153,.12)}
  .h2-card.done .h2-pts{color:var(--good);background:var(--good-soft)}
  .h2-card.done .h2-name{color:var(--good)}

  .h2-card.pop{animation:h2pop .42s cubic-bezier(.2,1.4,.3,1)}
  @keyframes h2pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
  .pt-float{position:fixed;z-index:9999;pointer-events:none;font-family:var(--mono);font-weight:800;font-size:22px;color:var(--good);
    text-shadow:0 0 14px rgba(52,211,153,.6);transform:translate(-50%,0);animation:ptfly .9s ease-out forwards}
  @keyframes ptfly{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

  .h2-week{display:flex;gap:10px;justify-content:space-between}
  .h2-day{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;border-radius:10px;transition:.13s}
  .h2-day:hover:not(:disabled){background:rgba(255,255,255,.04)}
  .h2-day:disabled{opacity:.35;cursor:default}
  .h2-day-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-2);background:var(--bg);transition:.2s}
  .h2-day.part .h2-day-dot{background:var(--warn);border-color:var(--warn)}
  .h2-day.hit .h2-day-dot{background:var(--accent);border-color:var(--accent)}
  .h2-day.perfect .h2-day-dot{background:linear-gradient(135deg,var(--good),#6ff0bd);border-color:var(--good);box-shadow:0 0 12px rgba(52,211,153,.5)}
  .h2-day.istoday .h2-day-dot{box-shadow:0 0 0 3px var(--accent-soft)}
  .h2-day.sel .h2-day-dot{outline:2px solid var(--accent);outline-offset:2px}
  .h2-day-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
  .h2-day-detail:not(:empty){margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .h2-dd-head{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .h2-dd-head b{color:var(--text);font-family:var(--mono)}
  .h2-dd-list{display:flex;flex-wrap:wrap;gap:7px}
  .h2-dd-pill{font-size:11.5px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--faint)}
  .h2-dd-pill.on{color:var(--good);background:var(--good-soft);border-color:rgba(52,211,153,.3)}

  .h2-lib{display:flex;flex-direction:column;gap:2px}
  .h2-lib-row{display:flex;align-items:center;gap:13px;padding:12px 8px;border-radius:11px;cursor:pointer;transition:background .12s}
  .h2-lib-row:hover{background:rgba(255,255,255,.035)}
  .h2-lib-icon{font-size:20px}
  .h2-lib-main{flex:1;min-width:0}
  .h2-lib-name{font-size:14.5px;font-weight:600;margin-bottom:6px}
  .h2-lib-week{display:flex;gap:5px}
  .h2-mini{width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--border)}
  .h2-mini.on{background:var(--hc);border-color:var(--hc)}
  .h2-lib-streak{font-family:var(--mono);font-size:12px;color:var(--gold)}
  .h2-lib-chev{color:var(--faint);font-size:18px}

  .h2-detail-hero{display:flex;align-items:center;gap:18px;border:1px solid var(--border-2);
    background:linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-detail-icon{font-size:40px}
  .h2-detail-name{background:none;border:1px solid transparent;border-radius:8px;font-size:22px;font-weight:800;color:var(--text);width:100%;padding:4px 8px;letter-spacing:-.02em}
  .h2-detail-name:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  .h2-detail-sub{font-size:12.5px;color:var(--muted);margin-top:4px;padding-left:8px}
  .h2-detail-sub b{color:var(--text);font-family:var(--mono)}
  .h2-heat{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
  .h2-heat-cell{aspect-ratio:1;border-radius:4px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:.12s}
  .h2-heat-cell:hover{transform:scale(1.25);border-color:var(--border-2)}

  /* ===== DRAG ===== */
  .drag-grip{color:var(--faint);font-size:14px;cursor:grab;opacity:0;transition:opacity .12s;flex:0 0 auto;line-height:1;user-select:none}
  .h2-lib-row:hover .drag-grip,.mo-line:hover .drag-grip,.et-row:hover .drag-grip{opacity:.5}
  .drag-grip:active{cursor:grabbing}
  .dragging{opacity:.4}
  .vcard{cursor:grab}
  .vcard:active{cursor:grabbing}

  @media (max-width:600px){
    .h2-cards{grid-template-columns:1fr 1fr}
    .h2-hero{padding:22px;gap:22px}
    .h2-ring{width:130px;height:130px;flex:0 0 130px}
    .h2-ring .pct b{font-size:34px}
    .h2-remaining{font-size:27px}
    .h2-heat{grid-template-columns:repeat(10,1fr)}
    .drag-grip{opacity:.45}
  }




  /* ===== PROJECTS v2 ===== */
  .proj-stack{display:flex;flex-direction:column;gap:10px}
  .proj-block{border:1px solid var(--border);border-radius:13px;background:var(--bg);overflow:hidden;transition:border-color .14s}
  .proj-block:hover{border-color:var(--border-2)}
  .proj-block.collapsed{background:none}
  .proj-head{display:flex;align-items:center;gap:11px;padding:12px 13px}
  .proj-info{flex:1;min-width:0}
  .proj-name-inp{width:100%;background:none;border:1px solid transparent;border-radius:7px;color:var(--text);
    font-family:var(--sans);font-size:14.5px;font-weight:600;padding:4px 7px;margin-bottom:6px;transition:.12s}
  .proj-name-inp:hover{border-color:var(--border)}
  .proj-name-inp:focus{outline:none;border-color:var(--accent);background:var(--bg-2)}
  .proj-track{height:5px;background:var(--bg-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-left:7px}
  .proj-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .proj-count{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;white-space:nowrap}
  .proj-collapse{flex-shrink:0}
  .proj-del-btn{opacity:0;flex-shrink:0;font-size:17px}
  .proj-head:hover .proj-del-btn{opacity:.45}
  .proj-del-btn:hover{opacity:1;color:var(--bad)}
  .proj-body{padding:0 13px 11px}
  .proj-list{border-top:1px solid var(--border);padding-top:5px}
  .proj-empty{padding:12px 4px;font-size:12.5px;border-top:1px solid var(--border)}
  .proj-done-toggle{background:none;border:none;color:var(--faint);font-family:inherit;font-size:11.5px;
    cursor:pointer;padding:8px 4px;text-align:left;width:100%;transition:color .12s}
  .proj-done-toggle:hover{color:var(--muted)}
  .proj-done-list{opacity:.6;padding-bottom:4px}
  .addrow.proj-add{margin-top:8px}
  .addrow.proj-add input{background:none;border:1px dashed var(--border);font-size:13px;padding:9px 11px}
  .addrow.proj-add input:hover{border-color:var(--border-2)}
  .addrow.proj-add input:focus{border-style:solid;border-color:var(--accent);background:var(--bg-2)}
  .addrow.proj-new{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

  /* task rows */
  .et-name{cursor:text;border-radius:5px;padding:1px 4px;margin-left:-4px;transition:background .12s}
  .et-row:hover .et-name{background:rgba(255,255,255,.04)}
  .et-rename{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--accent);border-radius:7px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:5px 8px;width:100%}
  .et-rename:focus{outline:none}
  .et-actions{opacity:.35;transition:opacity .13s}
  .et-row:hover .et-actions,.et-row:focus-within .et-actions{opacity:1}
  .et-iconbtn.act-focus:hover{border-color:var(--accent-2);color:var(--accent-2)}
  .et-iconbtn.act-next:hover{border-color:var(--teal);color:var(--teal)}
  .et-status-tag.focus{background:var(--accent-soft);color:var(--accent)}
  .et-hint{font-size:11px;margin-top:10px;color:var(--muted)}
  .et-hint.warn{color:var(--warn)}
  .et-projsel{cursor:pointer}
  .et-projsel:hover{border-color:var(--accent);color:var(--text)}

  /* toast */
  .et-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10001;
    display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:11px;
    background:var(--card-hi);border:1px solid var(--border-2);box-shadow:0 12px 40px rgba(0,0,0,.55);
    font-size:13px;color:var(--text);animation:toastIn .18s cubic-bezier(.2,.9,.3,1);max-width:min(440px,92vw)}
  .et-toast.warn{border-color:rgba(251,191,36,.4);color:var(--warn)}
  .et-toast-undo{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
  .et-toast-undo:hover{text-decoration:underline}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  /* ===== EMOJI PICKER ===== */
  .icon-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;
    font-size:19px;line-height:1;padding:0;width:38px;height:38px;display:inline-grid;place-items:center;
    transition:.14s;flex:0 0 38px;position:relative}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .icon-btn::after{content:"▾";position:absolute;right:2px;bottom:0;font-size:8px;color:var(--faint);line-height:1}
  .icon-btn:hover::after{color:var(--accent)}
  .proj-icon.icon-btn{width:34px;height:34px;flex:0 0 34px;font-size:18px;background:none;border-color:transparent}
  .proj-head:hover .proj-icon.icon-btn{border-color:var(--border)}
  .proj-icon.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  .emoji-pop{position:fixed;z-index:10000;width:300px;max-height:360px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--border-2);
    border-radius:14px;box-shadow:0 20px 56px rgba(0,0,0,.62);overflow:hidden;
    animation:epIn .14s cubic-bezier(.2,.9,.3,1)}
  @keyframes epIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .ep-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;flex-shrink:0}
  .ep-close{background:none;border:none;color:var(--faint);font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
  .ep-close:hover{color:var(--bad)}
  .ep-body{flex:1;overflow-y:auto;padding:12px 14px}
  .ep-body::-webkit-scrollbar{width:7px}
  .ep-body::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .ep-group{margin-bottom:14px}
  .ep-group:last-child{margin-bottom:0}
  .ep-group-name{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-bottom:7px}
  .ep-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .ep-item{background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;
    font-size:16px;line-height:1;padding:0;aspect-ratio:1;display:grid;place-items:center;transition:.1s}
  .ep-item:hover{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.18)}
  .ep-foot{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
  .ep-custom{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:8px 11px;font-size:13px;color:var(--text);text-align:center}
  .ep-custom:focus{outline:none;border-color:var(--accent)}
  .ep-custom::placeholder{color:var(--faint);font-size:12px}

  /* ===== HOME v2 ===== */
  .home2{display:flex;flex-direction:column;gap:14px}
  .hm-greet{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:2px}
  .hm-hello{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:0}
  .hm-date{font-size:12.5px;color:var(--muted);margin-top:4px}
  .hm-greet-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hm-streak{font-size:12px;color:var(--gold);background:rgba(251,191,36,.12);
    border:1px solid rgba(251,191,36,.3);padding:6px 13px;border-radius:99px}
  .hm-streak b{font-family:var(--mono);font-size:14px;font-weight:800}

  .hm-top{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
  @media(max-width:900px){.hm-top{grid-template-columns:1fr}}

  .hm-today{display:flex;gap:22px;align-items:center;padding:22px;border-radius:16px;
    border:1px solid var(--border-2);
    background:radial-gradient(120% 130% at 100% 0,rgba(255,122,71,.1),transparent 58%),linear-gradient(150deg,var(--card-hi),var(--card))}
  .hm-today.is-good{background:radial-gradient(120% 130% at 100% 0,rgba(52,211,153,.11),transparent 58%),linear-gradient(150deg,var(--card-hi),var(--card))}
  .hm-ring{position:relative;width:124px;height:124px;flex:0 0 124px}
  .hm-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hm-ring .pct b{font-size:34px;font-weight:800;font-family:var(--mono);letter-spacing:-.03em}
  .hm-ring .pct span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .hm-today-body{flex:1;min-width:0}
  .hm-today-hd{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:12px}
  .hm-chips{display:flex;flex-wrap:wrap;gap:7px}
  .hm-chip{display:inline-flex;align-items:center;gap:8px;font-family:inherit;cursor:pointer;
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;
    font-size:12.5px;color:var(--text);transition:.14s}
  .hm-chip:hover{border-color:var(--hc);transform:translateY(-2px)}
  .hm-chip-i{font-size:14px;filter:grayscale(.5);opacity:.7}
  .hm-chip b{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:700}
  .hm-chip.on{background:var(--good-soft);border-color:rgba(52,211,153,.4)}
  .hm-chip.on .hm-chip-i{filter:none;opacity:1}
  .hm-chip.on .hm-chip-l{color:var(--good)}
  .hm-chip.on b{color:var(--good)}

  .hm-focus{padding:22px;border-radius:16px;border:1px solid var(--border-2);cursor:pointer;
    background:radial-gradient(120% 130% at 0 0,rgba(251,191,36,.1),transparent 58%),linear-gradient(150deg,var(--card-hi),var(--card));
    display:flex;flex-direction:column;transition:.15s}
  .hm-focus:hover{transform:translateY(-2px);border-color:var(--warn)}
  .hm-focus.empty{background:linear-gradient(150deg,var(--card),var(--bg-2));border-style:dashed}
  .hm-focus-cap{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--warn);font-weight:700}
  .hm-focus-name{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.32;margin-top:12px}
  .hm-focus-none{font-size:16px;color:var(--faint);margin-top:12px;font-weight:600}

  .hm-week{display:block;padding:18px 22px;border-radius:16px;cursor:pointer;
    border:1px solid var(--border);background:linear-gradient(150deg,var(--card),var(--bg-2));

  .hm-week::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
  .hm-week.ahead::before,.hm-week.secured::before{background:var(--good)}
  .hm-week.behind::before{background:var(--warn)}
  .hm-week.lost::before{background:var(--bad)}
  .hm-week-hd{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:13px}
  .hm-week-lead{display:flex;align-items:baseline;gap:12px;min-width:0}
  .hm-week-cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
  .hm-week-val{font-family:var(--mono);font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .hm-week-val i{font-style:normal;font-size:14px;color:var(--faint);font-weight:600;margin-left:4px}
  .hm-week.ahead .hm-week-val,.hm-week.secured .hm-week-val{color:var(--good)}
  .hm-week.behind .hm-week-val{color:var(--warn)}
  .hm-week.lost .hm-week-val{color:var(--bad)}
  .hm-week-tag{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;flex-shrink:0}
  .hm-week-tag.up{color:var(--good);background:var(--good-soft)}
  .hm-week-tag.down{color:var(--warn);background:var(--warn-soft)}
  .hm-week.lost .hm-week-tag{color:var(--bad);background:var(--bad-soft)}
  .hm-week-bar{height:8px;background:var(--bg);border:1px solid var(--border);border-radius:99px;overflow:hidden}
  .hm-week-bar-f{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .hm-week.ahead .hm-week-bar-f,.hm-week.secured .hm-week-bar-f{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .hm-week.behind .hm-week-bar-f{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .hm-week.lost .hm-week-bar-f{background:linear-gradient(90deg,var(--bad),#f5915e)}
  .hm-week-ft{display:flex;justify-content:space-between;gap:12px;margin-top:10px;
    font-size:11px;color:var(--faint);font-family:var(--mono)}

  /* net worth modal */
  .nw-panel{height:auto;max-height:none;padding-bottom:22px}
  .nw-total{font-family:var(--mono);font-size:40px;font-weight:800;letter-spacing:-.04em;
    padding:22px 22px 6px;color:var(--good)}
  .nw-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:14px 22px 0}
  @media(max-width:560px){.nw-grid{grid-template-columns:1fr}}
  .nw-row{display:flex;flex-direction:column;gap:7px;background:var(--bg);border:1px solid var(--border);
    border-radius:11px;padding:12px 14px;transition:border-color .13s;cursor:text}
  .nw-row:focus-within{border-color:var(--c)}
  .nw-row-l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:600;position:relative;padding-left:12px}
  .nw-row-l::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:99px;background:var(--c)}
  .nw-row-in{display:flex;align-items:center;gap:2px;font-family:var(--mono);color:var(--muted);font-size:17px}
  .nw-row-in input{background:none;border:none;color:var(--text);font-family:var(--mono);
    font-size:17px;font-weight:700;width:100%;padding:0}
  .nw-row-in input:focus{outline:none}
  .nw-note{font-size:11px;color:var(--faint);padding:16px 22px 0;line-height:1.5}
  .hm-edit{text-transform:none;letter-spacing:0;color:var(--accent);font-size:10px;
    opacity:0;transition:opacity .13s;margin-left:6px}
  .hm-m-card:hover .hm-edit{opacity:1}
  #hm-nw{cursor:pointer}
  #hm-nw:hover{border-color:var(--border-2);transform:translateY(-2px)}

  .hm-money{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}
  @media(max-width:900px){.hm-money{grid-template-columns:1fr 1fr}.hm-m-card.wide{grid-column:span 2}}
  @media(max-width:560px){.hm-money{grid-template-columns:1fr}.hm-m-card.wide{grid-column:span 1}}
  .hm-m-card{padding:18px 20px;border-radius:15px;border:1px solid var(--border);
    background:linear-gradient(160deg,var(--card),var(--bg-2));transition:.15s}
  .hm-m-card[data-goto]{cursor:pointer}
  .hm-m-card[data-goto]:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .hm-m-card.urgent{border-color:rgba(251,191,36,.35)}
  .hm-m-cap{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
  .hm-m-row{display:flex;gap:26px}
  .hm-m-item b{display:block;font-family:var(--mono);font-size:25px;font-weight:800;letter-spacing:-.03em;color:var(--good)}
  .hm-m-item span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .hm-m-big{font-family:var(--mono);font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .hm-m-big span{font-size:13px;color:var(--faint);margin-left:5px;font-weight:600}
  .hm-m-big.muted{color:var(--faint)}
  .hm-m-foot{font-size:10.5px;color:var(--faint);margin-top:11px;line-height:1.4}

  .hm-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.hm-bottom{grid-template-columns:1fr}}
  .hm-card{padding:18px 20px;border-radius:15px;border:1px solid var(--border);
    background:linear-gradient(160deg,var(--card),var(--bg-2))}
  .hm-card-hd{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:13px}
  .hm-card-hd span{font-family:var(--mono);font-size:10.5px;color:var(--faint);
    background:rgba(255,255,255,.05);padding:2px 8px;border-radius:99px;letter-spacing:0}
  .hm-card-hd span.over{color:var(--bad);background:var(--bad-soft)}
  .hm-list{display:flex;flex-direction:column;gap:2px}
  .hm-li{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;
    background:none;border:none;color:var(--text);font-size:13px;padding:9px 7px;border-radius:9px;
    cursor:pointer;transition:background .12s}
  .hm-li:hover{background:rgba(255,255,255,.04)}
  .hm-li>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hm-li-box{width:16px;height:16px;flex:0 0 16px;border:1.5px solid var(--border-2);border-radius:5px;transition:.13s}
  .hm-li:hover .hm-li-box{border-color:var(--good);background:var(--good-soft)}
  .hm-li-dot{width:7px;height:7px;flex:0 0 7px;border-radius:99px;background:var(--muted)}
  .hm-li-dot.past{background:var(--bad)}
  .hm-li em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);flex-shrink:0}
  .hm-li em.past{color:var(--bad)}
  .hm-empty{font-size:12.5px;color:var(--faint);padding:8px 2px}

  /* ===== WEEK: PACE ===== */
  .h2-pace{border:1px solid var(--border-2);padding:24px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--card-hi),var(--card))}
  .h2-pace::before{content:"";position:absolute;inset:0 0 auto;height:3px}
  .h2-pace.ahead::before,.h2-pace.secured::before{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .h2-pace.behind::before{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .h2-pace.lost::before{background:linear-gradient(90deg,var(--bad),#f5915e)}

  .h2-wk-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:20px}
  .h2-wk-cap{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .h2-wk-pace{display:flex;align-items:baseline;gap:9px;margin:9px 0 8px;line-height:1}
  .h2-wk-n{font-size:58px;font-weight:800;font-family:var(--mono);letter-spacing:-.05em}
  .h2-pace.ahead .h2-wk-n,.h2-pace.secured .h2-wk-n{color:var(--good)}
  .h2-pace.behind .h2-wk-n{color:var(--warn)}
  .h2-pace.lost .h2-wk-n{color:var(--bad)}
  .h2-wk-of{font-size:21px;font-family:var(--mono);color:var(--faint);font-weight:600}
  .h2-wk-delta{font-size:12.5px;font-weight:700;font-family:var(--mono)}
  .h2-wk-delta.up{color:var(--good)}
  .h2-wk-delta.down{color:var(--warn)}
  .h2-pace.lost .h2-wk-delta.down{color:var(--bad)}

  .h2-wk-right{text-align:right;flex-shrink:0}
  .h2-wk-earned b{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--text)}
  .h2-wk-earned span{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:3px}
  .h2-wk-need{margin-top:13px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.045);
    border:1px solid var(--border-2);display:inline-block}
  .h2-wk-need b{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em}
  .h2-wk-need span{font-size:10.5px;color:var(--muted);margin-left:4px}
  .h2-wk-need.done{color:var(--good);background:var(--good-soft);border-color:rgba(52,211,153,.35);
    font-size:13px;font-weight:700;padding:12px 16px}
  .h2-wk-need.lost{color:var(--bad);background:var(--bad-soft);border-color:rgba(248,113,113,.3);
    font-size:12.5px;font-weight:600}

  .h2-wk-meter{position:relative;height:10px;background:var(--bg);border:1px solid var(--border);
    border-radius:99px;margin-bottom:22px}
  .h2-wk-meter-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .h2-pace.ahead .h2-wk-meter-fill,.h2-pace.secured .h2-wk-meter-fill{background:linear-gradient(90deg,var(--good),#6ff0bd)}
  .h2-pace.behind .h2-wk-meter-fill{background:linear-gradient(90deg,var(--warn),#f5915e)}
  .h2-pace.lost .h2-wk-meter-fill{background:linear-gradient(90deg,var(--bad),#f5915e)}
  .h2-wk-meter-goal{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text);opacity:.45;border-radius:2px}
  .h2-wk-meter-goal span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);
    font-size:9px;font-family:var(--mono);color:var(--muted);white-space:nowrap}

  .h2-wk-track{display:flex;gap:8px}
  .h2-wk-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .h2-wk-bar{width:100%;height:56px;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
  .h2-wk-bar-fill{width:100%;transition:height .6s cubic-bezier(.2,.8,.2,1)}
  .h2-wk-day.strong .h2-wk-bar-fill{background:linear-gradient(180deg,var(--good),#2fb87d)}
  .h2-wk-day.weak .h2-wk-bar-fill{background:linear-gradient(180deg,var(--warn),#d99a2e)}
  .h2-wk-day.zero .h2-wk-bar-fill{background:var(--border-2)}
  .h2-wk-day.today .h2-wk-bar{border-color:var(--accent);border-width:1.5px}
  .h2-wk-day.today .h2-wk-bar-fill{background:linear-gradient(180deg,var(--accent),var(--accent-2))}
  .h2-wk-day.future .h2-wk-bar{border-style:dashed;opacity:.4}
  .h2-wk-dv{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:600;min-height:13px}
  .h2-wk-dl{font-size:10px;font-weight:700;color:var(--faint)}
  .h2-wk-day.today .h2-wk-dl,.h2-wk-day.today .h2-wk-dv{color:var(--accent)}

  @media (max-width:600px){
    .h2-pace{padding:20px}
    .h2-wk-hero{flex-direction:column;gap:16px}
    .h2-wk-right{text-align:left}
    .h2-wk-n{font-size:46px}
    .h2-wk-bar{height:46px}
  }

  /* ===== PROJECTS v2 ===== */
  .proj-stack{display:flex;flex-direction:column;gap:10px}
  .proj-block{border:1px solid var(--border);border-radius:13px;background:var(--bg);overflow:hidden;transition:border-color .14s}
  .proj-block:hover{border-color:var(--border-2)}
  .proj-block.collapsed{background:none}
  .proj-head{display:flex;align-items:center;gap:11px;padding:12px 13px}
  .proj-info{flex:1;min-width:0}
  .proj-name-inp{width:100%;background:none;border:1px solid transparent;border-radius:7px;color:var(--text);
    font-family:var(--sans);font-size:14.5px;font-weight:600;padding:4px 7px;margin-bottom:6px;transition:.12s}
  .proj-name-inp:hover{border-color:var(--border)}
  .proj-name-inp:focus{outline:none;border-color:var(--accent);background:var(--bg-2)}
  .proj-track{height:5px;background:var(--bg-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-left:7px}
  .proj-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .proj-count{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;white-space:nowrap}
  .proj-collapse{flex-shrink:0}
  .proj-del-btn{opacity:0;flex-shrink:0;font-size:17px}
  .proj-head:hover .proj-del-btn{opacity:.45}
